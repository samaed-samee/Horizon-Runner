<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horizon Runner: Urban Parkour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* Cinematic UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: skewX(-5deg);
            pointer-events: auto;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pause-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.75rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            pointer-events: auto;
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        .pause-btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: white;
            color: black;
            padding: 1rem 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .key-hint {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.7rem;
            margin: 0 0.2rem;
        }

        /* ── Mobile Touch Controls ── */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1rem 1.5rem 1.5rem;
            justify-content: space-between;
            z-index: 40;
            pointer-events: none;
        }

        .touch-btn {
            pointer-events: auto;
            width: clamp(80px, 22vw, 130px);
            height: clamp(60px, 14vh, 90px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: clamp(0.6rem, 2.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.93);
        }

        .touch-btn .icon {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
        }

        /* Portrait Warning */
        .portrait-warning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: 'Inter', sans-serif;
        }

        .portrait-warning .rotate-icon {
            font-size: 3rem;
            animation: rotateHint 2s ease-in-out infinite;
        }

        @keyframes rotateHint {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        /* ── Responsive: show touch controls on touch devices ── */
        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: flex;
            }

            .key-hint-row {
                display: none !important;
            }
        }

        /* ── Responsive: small screens ── */
        @media (max-width: 640px) {
            .ui-layer {
                padding: 0.75rem;
            }

            .hud-panel {
                padding: 0.5rem 0.75rem;
                border-radius: 0.6rem;
                transform: skewX(-3deg);
            }
        }

        /* ── Portrait orientation on mobile ── */
        @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
            .portrait-warning {
                display: flex;
            }

            #game-container {
                filter: blur(6px);
            }
        }
    </style>
</head>

<body>

    <div id="game-container">

        <!-- HUD -->
        <div class="ui-layer">
            <div class="flex justify-between w-full">
                <div class="hud-panel">
                    <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Distance</div>
                    <div class="text-3xl font-black tabular-nums tracking-tighter"><span id="score-el">0</span><span
                            class="text-sm text-slate-500 ml-1">m</span></div>
                </div>
                <div class="flex items-start gap-2">
                    <div class="hud-panel text-right">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Stamina</div>
                        <div class="w-32 h-2 bg-slate-700 rounded-full mt-2 overflow-hidden">
                            <div id="stamina-bar" class="h-full bg-emerald-400 w-full"></div>
                        </div>
                    </div>
                    <button id="pause-btn" class="pause-btn" title="Pause (P)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <rect x="6" y="4" width="4" height="16" rx="1" />
                            <rect x="14" y="4" width="4" height="16" rx="1" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Controls Hint (desktop-only keyboard hints) -->
            <div
                class="key-hint-row text-center text-slate-500 text-xs font-medium uppercase tracking-widest opacity-50 md:hidden">
                Tap Left to Jump • Tap Right to Dash
            </div>
        </div>

        <!-- Mobile On-Screen Touch Buttons -->
        <div class="touch-controls" id="touch-controls">
            <button class="touch-btn" id="touch-jump">
                <span class="icon">⬆</span>
                JUMP
            </button>
            <button class="touch-btn" id="touch-dash">
                <span class="icon">⚡</span>
                DASH
            </button>
        </div>

        <!-- Portrait Rotation Warning -->
        <div class="portrait-warning" id="portrait-warning">
            <div class="rotate-icon">📱</div>
            <div class="text-lg font-bold uppercase tracking-widest">Rotate Your Device</div>
            <div class="text-sm text-slate-400">This game is best played in landscape mode</div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1
                class="text-4xl sm:text-6xl md:text-8xl font-black text-white mb-2 tracking-tighter uppercase italic drop-shadow-2xl">
                Horizon</h1>
            <h2 class="text-base sm:text-xl text-slate-400 uppercase tracking-[0.5em] font-light mb-8 sm:mb-12">Urban
                Parkour</h2>

            <button id="start-btn" class="btn-start">
                Begin Run
            </button>

            <div
                class="key-hint-row mt-6 sm:mt-8 text-slate-400 text-xs uppercase tracking-widest font-medium flex gap-6">
                <span><span class="key-hint">SPACE</span> Jump</span>
                <span><span class="key-hint">SHIFT</span> Dash</span>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="text-3xl sm:text-5xl font-black text-white mb-4 uppercase tracking-tight">Critical Failure</h2>
            <div class="text-center mb-6 sm:mb-10">
                <div class="text-xs text-slate-400 uppercase tracking-widest mb-1">Total Distance</div>
                <div class="text-4xl sm:text-6xl font-black text-white"><span id="final-score">0</span>m</div>
            </div>
            <button id="restart-btn" class="btn-start">
                Retry
            </button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreEl = document.getElementById('score-el');
        const finalScoreEl = document.getElementById('final-score');
        const staminaBar = document.getElementById('stamina-bar');

        // Game Constants
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const SPEED_base = 6;
        const DASH_SPEED = 10;
        const DAY_CYCLE_LENGTH = 100000;

        // Game State
        let gameState = 'MENU';
        let score = 0;
        let cameraX = 0;
        let gameSpeed = SPEED_base;
        let animTime = 0;
        let timeProgress = 0;
        let lastStepTime = 0;
        let frameCount = 0; // Fixed: Added global frameCount
        let lastTime = 0; // For delta-time normalization

        // Player
        const player = {
            x: 100,
            y: 0,
            width: 30,
            height: 50,
            vx: 0,
            vy: 0,
            isGrounded: false,
            stamina: 100,
            color: '#fff',
            trail: []
        };

        // World
        let platforms = [];
        let particles = [];
        let backgroundBuildings = [];
        let stars = [];
        let birds = [];
        let mountainPoints = [];

        // Biome System (city → jungle, looping)
        const BIOME_CYCLE = 40000; // pixels per full biome cycle (~4000m score)
        function getBiome(distance) {
            const pos = ((distance % BIOME_CYCLE) + BIOME_CYCLE) % BIOME_CYCLE;
            if (pos < 15000) return { type: 'city', blend: 0 };      // 0-1500m
            if (pos < 20000) return { type: 'transition', blend: (pos - 15000) / 5000 }; // 1500-2000m
            if (pos < 30000) return { type: 'jungle', blend: 1 };    // 2000-3000m
            return { type: 'transition', blend: 1 - (pos - 30000) / 10000 }; // 3000-4000m
        }

        function initBirds() {
            birds = [];
            for (let i = 0; i < 6; i++) {
                birds.push({
                    x: Math.random() * canvas.width,
                    y: 30 + Math.random() * canvas.height * 0.25,
                    speed: 0.3 + Math.random() * 0.5,
                    wingPhase: Math.random() * Math.PI * 2,
                    size: 3 + Math.random() * 4
                });
            }
        }

        function initMountains() {
            mountainPoints = [];
            const segments = 20;
            for (let i = 0; i <= segments; i++) {
                mountainPoints.push({
                    x: (i / segments) * canvas.width,
                    h: 40 + Math.random() * 80
                });
            }
        }

        // Weather System
        const weather = {
            active: false,
            intensity: 0, // 0 to 1
            flashOpacity: 0,
            nextChange: 600, // Frames until weather change logic
            raindrops: [],
            clouds: []
        };

        // --- AUDIO SYSTEM ---
        const SoundSys = {
            ctx: null,
            noiseBuffer: null,
            rainGain: null,
            initialized: false,

            init: function () {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // Create Noise Buffer
                const bufferSize = this.ctx.sampleRate * 2;
                this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                // Rain Sound Setup (Continuous loop, volume controlled by gain)
                const rainSrc = this.ctx.createBufferSource();
                rainSrc.buffer = this.noiseBuffer;
                rainSrc.loop = true;
                const rainFilter = this.ctx.createBiquadFilter();
                rainFilter.type = 'lowpass';
                rainFilter.frequency.value = 400; // Muffled rain sound
                this.rainGain = this.ctx.createGain();
                this.rainGain.gain.value = 0;

                rainSrc.connect(rainFilter);
                rainFilter.connect(this.rainGain);
                this.rainGain.connect(this.ctx.destination);
                rainSrc.start();

                this.initialized = true;
            },

            updateWeatherAudio: function (intensity) {
                if (!this.initialized) return;
                // Smoothly transition rain volume
                const targetVol = intensity * 0.3;
                this.rainGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.5);
            },

            playThunder: function () {
                if (!this.initialized) return;
                const osc = this.ctx.createBufferSource();
                osc.buffer = this.noiseBuffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 150; // Deep rumble
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.5); // Long decay

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 1.5);
            },

            playStep: function () {
                if (!this.initialized) return;
                const osc = this.ctx.createBufferSource();
                osc.buffer = this.noiseBuffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 600;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },

            playJump: function () {
                if (!this.initialized) return;
                const osc = this.ctx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.2);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                noise.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
                noise.start();
                noise.stop(this.ctx.currentTime + 0.3);
            },

            playLand: function () {
                if (!this.initialized) return;
                const osc = this.ctx.createBufferSource();
                osc.buffer = this.noiseBuffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 300;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            initClouds();
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => {
            setTimeout(resize, 150);
        });

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.6,
                    size: Math.random() * 2,
                    alpha: Math.random()
                });
            }
        }

        function initClouds() {
            weather.clouds = [];
            for (let i = 0; i < 8; i++) {
                weather.clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.3,
                    w: 100 + Math.random() * 200,
                    h: 40 + Math.random() * 40,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
        }
        resize();

        // --- Generation ---

        function initGame() {
            SoundSys.init();
            if (SoundSys.ctx.state === 'suspended') SoundSys.ctx.resume();

            player.x = 100;
            player.y = canvas.height - 200;
            player.vx = 0;
            player.vy = 0;
            player.stamina = 100;
            score = 0;
            cameraX = 0;
            gameSpeed = SPEED_base;
            animTime = 0;
            timeProgress = 0;
            lastStepTime = 0;
            frameCount = 0;
            lastTime = 0;

            platforms = [];
            particles = [];
            backgroundBuildings = [];
            birds = [];

            // Reset weather
            weather.active = false;
            weather.intensity = 0;
            weather.flashOpacity = 0;
            weather.raindrops = [];
            initClouds();
            initBirds();
            initMountains();

            platforms.push({ x: 0, y: canvas.height - 150, w: 1500, h: 600 });

            for (let i = 0; i < 18; i++) {
                backgroundBuildings.push(createBackgroundElement(i * 120 - 200, 0));
            }

            gameState = 'PLAYING';
            scoreEl.innerText = '0';
            updateStaminaUI();
            requestAnimationFrame(loop);
        }

        // Creates either a building (city) or tree (jungle) based on biome
        function createBackgroundElement(xOffset, distanceHint) {
            const biome = getBiome(distanceHint);
            if (biome.blend > 0.5) {
                return createTree(xOffset);
            }
            return createBuilding(xOffset);
        }

        function createBuilding(xOffset) {
            const h = 150 + Math.random() * 350;
            const w = 60 + Math.random() * 100;
            const layer = Math.floor(Math.random() * 3);
            const roofType = Math.floor(Math.random() * 3);
            const windows = [];
            if (layer > 0) {
                const rows = Math.floor(h / 25);
                const cols = Math.floor(w / 18);
                const style = Math.random();
                for (let r = 1; r < rows - 1; r++) {
                    for (let c = 1; c < cols - 1; c++) {
                        if ((style > 0.5 && Math.random() > 0.3) || (style <= 0.5 && (r + c) % 2 === 0)) {
                            windows.push({ x: c * 18, y: r * 25, w: 10, h: 16, lightSeed: Math.random() });
                        }
                    }
                }
            }
            // Rooftop details
            const rooftopDetails = [];
            // Antennas
            if (Math.random() > 0.4) {
                rooftopDetails.push({ type: 'antenna', x: w * 0.3 + Math.random() * w * 0.4, h: 15 + Math.random() * 25, blink: Math.random() });
            }
            // AC units
            const acCount = Math.floor(Math.random() * 3);
            for (let i = 0; i < acCount; i++) {
                rooftopDetails.push({ type: 'ac', x: 8 + Math.random() * (w - 24) });
            }
            // Water tank
            if (Math.random() > 0.6 && h > 250) {
                rooftopDetails.push({ type: 'tank', x: 10 + Math.random() * (w - 30) });
            }
            // Satellite dish
            if (Math.random() > 0.7) {
                rooftopDetails.push({ type: 'dish', x: w * 0.2 + Math.random() * w * 0.6 });
            }
            // Neon sign
            let neonSign = null;
            if (layer >= 1 && Math.random() > 0.5 && h > 200) {
                const neonColors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#22c55e', '#f59e0b'];
                neonSign = {
                    x: 5 + Math.random() * (w - 30),
                    y: 30 + Math.random() * 40,
                    w: 15 + Math.random() * 20,
                    h: 8 + Math.random() * 10,
                    color: neonColors[Math.floor(Math.random() * neonColors.length)]
                };
            }
            // Balconies
            const balconies = [];
            if (layer >= 1 && Math.random() > 0.5) {
                const bCount = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < bCount; i++) {
                    balconies.push({ y: 40 + i * (h / (bCount + 1)), side: Math.random() > 0.5 ? 'left' : 'right' });
                }
            }
            return {
                x: xOffset, y: canvas.height - h + 80, w, h,
                layer, roofType, windows, rooftopDetails, neonSign, balconies,
                elementType: 'building'
            };
        }

        function createTree(xOffset) {
            const layer = Math.floor(Math.random() * 3);
            const trunkH = 80 + Math.random() * 120;
            const trunkW = 8 + Math.random() * 10;
            const canopyType = Math.random() > 0.4 ? 'round' : 'pine';
            const canopySize = 30 + Math.random() * 50;
            const leafShade = Math.floor(Math.random() * 3); // 0=dark,1=mid,2=light
            // Vines
            const vines = [];
            if (Math.random() > 0.4) {
                const vCount = 1 + Math.floor(Math.random() * 3);
                for (let i = 0; i < vCount; i++) {
                    vines.push({
                        xOff: -canopySize * 0.6 + Math.random() * canopySize * 1.2,
                        len: 20 + Math.random() * 40,
                        sway: Math.random() * Math.PI * 2
                    });
                }
            }
            return {
                x: xOffset,
                y: canvas.height - trunkH + 80,
                w: Math.max(canopySize * 2, trunkW + 20),
                h: trunkH,
                layer, trunkW, canopyType, canopySize, leafShade, vines,
                elementType: 'tree'
            };
        }

        // --- Physics & Logic ---

        function update(dt) {
            frameCount++;
            cameraX += gameSpeed * dt;
            timeProgress = (cameraX % DAY_CYCLE_LENGTH) / DAY_CYCLE_LENGTH;

            // --- Weather Logic ---
            // Randomly toggle weather state periodically
            if (frameCount > weather.nextChange) {
                weather.active = !weather.active;
                // Next change in 10-30 seconds (assuming 60fps)
                weather.nextChange = frameCount + 600 + Math.random() * 1200;
            }

            // Smoothly adjust intensity
            if (weather.active && weather.intensity < 1) {
                weather.intensity += 0.005 * dt;
            } else if (!weather.active && weather.intensity > 0) {
                weather.intensity -= 0.005 * dt;
            }

            // Update Audio based on weather
            SoundSys.updateWeatherAudio(weather.intensity);

            // Spawn Raindrops
            if (weather.intensity > 0) {
                // Spawn count scales with intensity
                const spawnCount = Math.floor(weather.intensity * 5) + 1;
                for (let i = 0; i < spawnCount; i++) {
                    weather.raindrops.push({
                        x: Math.random() * canvas.width + canvas.width * 0.2, // Offset for angle
                        y: -20,
                        vx: -3 - Math.random() * 2, // Wind blowing left
                        vy: 10 + Math.random() * 5, // Fall speed
                        l: 10 + Math.random() * 20  // Length
                    });
                }
            }

            // Update Raindrops
            for (let i = weather.raindrops.length - 1; i >= 0; i--) {
                let r = weather.raindrops[i];
                r.x += r.vx * dt;
                r.y += r.vy * dt;

                // Collision with floor (simple visual approximation)
                if (r.y > canvas.height - 100) {
                    // Chance to splash
                    if (Math.random() > 0.8) {
                        createParticles(r.x, r.y, 1, 'rgba(200,200,255,0.5)');
                    }
                    weather.raindrops.splice(i, 1);
                } else if (r.x < -50) {
                    weather.raindrops.splice(i, 1);
                }
            }

            // Thunder Logic
            if (weather.intensity > 0.7) {
                // Random chance for thunder (~every 5-10 seconds at max intensity)
                if (Math.random() > 0.995) {
                    weather.flashOpacity = 0.8;
                    SoundSys.playThunder();
                }
            }
            // Fade flash
            if (weather.flashOpacity > 0) weather.flashOpacity -= 0.05 * dt;

            // Move Clouds
            weather.clouds.forEach(c => {
                c.x -= c.speed * dt;
                if (c.x + c.w < 0) {
                    c.x = canvas.width + Math.random() * 200;
                    c.y = Math.random() * canvas.height * 0.3;
                }
            });

            // --- Player Logic ---
            player.x += (player.vx + gameSpeed) * dt;
            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;

            if (player.isGrounded) {
                animTime += 0.25 * dt;
                if (Math.floor(animTime / 2.1) > lastStepTime) {
                    SoundSys.playStep();
                    lastStepTime = Math.floor(animTime / 2.1);
                }
            } else {
                animTime = 0.5;
                lastStepTime = 0;
            }

            player.isGrounded = false;
            for (let p of platforms) {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + 25
                ) {
                    if (player.vy >= 0) {
                        player.isGrounded = true;
                        player.vy = 0;
                        player.y = p.y - player.height;
                        if (Math.random() > 0.9) createParticles(player.x + player.width / 2, player.y + player.height, 2, '#777');
                        if (player.vy > 2) SoundSys.playLand();
                    }
                }
            }

            if (player.y > canvas.height) gameOver();

            const rightmostPlatform = platforms[platforms.length - 1];
            const rightmostX = rightmostPlatform.x + rightmostPlatform.w;

            if (rightmostX < cameraX + canvas.width * 1.5) {
                const gap = 100 + Math.random() * 150;
                const w = 400 + Math.random() * 600;
                let lastY = rightmostPlatform.y;
                let newY = lastY + (Math.random() * 250 - 125);
                newY = Math.max(canvas.height * 0.4, Math.min(canvas.height - 150, newY));

                platforms.push({ x: rightmostX + gap, y: newY, w: w, h: 1000 });
            }

            if (platforms[0].x + platforms[0].w < cameraX - 200) {
                platforms.shift();
            }

            backgroundBuildings.forEach(b => {
                const parallaxSpeed = gameSpeed * (0.1 + b.layer * 0.1);
                b.x -= parallaxSpeed * dt;
            });

            if (backgroundBuildings.length > 0 && backgroundBuildings[0].x + backgroundBuildings[0].w < -100) {
                backgroundBuildings.shift();
            }

            const bgRightmost = backgroundBuildings[backgroundBuildings.length - 1].x + backgroundBuildings[backgroundBuildings.length - 1].w;
            if (bgRightmost < canvas.width + 100) {
                backgroundBuildings.push(createBackgroundElement(bgRightmost + 10 + Math.random() * 80, cameraX));
            }

            // Bird updates
            birds.forEach(bird => {
                bird.x -= bird.speed * dt;
                bird.wingPhase += 0.08 * dt;
                if (bird.x < -20) {
                    bird.x = canvas.width + 20 + Math.random() * 100;
                    bird.y = 30 + Math.random() * canvas.height * 0.25;
                }
            });

            if (player.stamina < 100) {
                player.stamina += 0.15 * dt;
                updateStaminaUI();
            }

            score = Math.floor(cameraX / 10);
            scoreEl.innerText = score;

            updateParticles(dt);
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.04 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateStaminaUI() {
            staminaBar.style.width = player.stamina + '%';
        }

        // --- Rendering Helpers ---

        function interpolateColor(c1, c2, factor) {
            const r = Math.round(c1[0] + (c2[0] - c1[0]) * factor);
            const g = Math.round(c1[1] + (c2[1] - c1[1]) * factor);
            const b = Math.round(c1[2] + (c2[2] - c1[2]) * factor);
            return `rgb(${r},${g},${b})`;
        }

        function getSkyColor(progress) {
            const sunsetTop = [15, 23, 42];
            const sunsetBot = [202, 138, 4];
            const nightTop = [2, 6, 23];
            const nightBot = [15, 23, 42];
            const sunriseTop = [56, 189, 248];
            const sunriseBot = [253, 186, 116];

            if (progress < 0.25) {
                const t = progress / 0.25;
                return {
                    top: interpolateColor(sunsetTop, nightTop, t),
                    bot: interpolateColor(sunsetBot, nightBot, t),
                    alpha: 1 - t
                };
            } else if (progress < 0.75) {
                return {
                    top: `rgb(${nightTop.join(',')})`,
                    bot: `rgb(${nightBot.join(',')})`,
                    alpha: 0
                };
            } else {
                const t = (progress - 0.75) / 0.25;
                return {
                    top: interpolateColor(nightTop, sunriseTop, t),
                    bot: interpolateColor(nightBot, sunriseBot, t),
                    alpha: t
                };
            }
        }

        function drawCharacter(x, y, w, h) {
            const centerX = x + w / 2;
            const centerY = y + h / 2;
            const runCycle = animTime * 1.5;
            const isJumping = !player.isGrounded;
            const bounce = isJumping ? 0 : Math.abs(Math.cos(runCycle)) * 2;
            const bodyY = y + bounce;
            ctx.save();

            // === Motion afterimage trail ===
            if (gameSpeed > SPEED_base + 2 || Math.abs(player.vx) > 2) {
                for (let g = 3; g >= 1; g--) {
                    ctx.globalAlpha = 0.07 * g;
                    const trailX = x - g * 8;
                    drawCharacterBody(trailX, bodyY, w, h, centerX - g * 8, runCycle, isJumping);
                }
                ctx.globalAlpha = 1.0;
            }

            // === Main character ===
            drawCharacterBody(x, bodyY, w, h, centerX, runCycle, isJumping);
            ctx.restore();
        }

        function drawCharacterBody(x, bodyY, w, h, centerX, runCycle, isJumping) {
            // Scarf (behind)
            const scarfBaseX = centerX;
            const scarfBaseY = bodyY + 12;
            const flowX = -15 - (gameSpeed * 1.5) - (player.vx * 2);
            const flowY = -5 + (player.vy * 2) + Math.sin(animTime * 3) * 5;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(scarfBaseX - 2, scarfBaseY);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.4, scarfBaseY + flowY - 8, scarfBaseX + flowX, scarfBaseY + flowY);
            ctx.lineTo(scarfBaseX + flowX + 3, scarfBaseY + flowY + 10);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.5, scarfBaseY + flowY + 6, scarfBaseX + 2, scarfBaseY + 4);
            ctx.fill();
            // Second scarf tail
            ctx.beginPath();
            ctx.moveTo(scarfBaseX, scarfBaseY + 2);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.3, scarfBaseY + flowY + 5, scarfBaseX + flowX * 0.7, scarfBaseY + flowY + 12);
            ctx.lineTo(scarfBaseX + flowX * 0.7 + 2, scarfBaseY + flowY + 18);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.2, scarfBaseY + flowY + 10, scarfBaseX + 2, scarfBaseY + 6);
            ctx.fill();

            // Back leg
            const lLegAngle = isJumping ? 0.5 : Math.sin(runCycle + Math.PI) * 0.8;
            drawLimb(centerX, bodyY + h / 2 - 10, lLegAngle, '#64748b', 6, 14, 14);
            // Back shoe
            drawShoe(centerX, bodyY + h / 2 - 10, lLegAngle, 14, 14, '#334155');

            // Back arm
            const lArmAngle = isJumping ? -0.5 : Math.sin(runCycle) * 0.8;
            drawLimb(centerX, bodyY + 15, lArmAngle, '#64748b', 5, 12, 10);

            // Hoodie / Body
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.roundRect(centerX - w / 2 + 2, bodyY + 10, w - 4, h * 0.35, 4);
            ctx.fill();
            // Hoodie hood (behind head)
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(centerX, bodyY + 8, 11, Math.PI, 0);
            ctx.fill();
            // Hood edge line
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, bodyY + 8, 11, Math.PI * 1.1, -Math.PI * 0.1);
            ctx.stroke();
            // Pocket line
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.roundRect(centerX - 6, bodyY + 24, 12, 5, 2);
            ctx.stroke();
            // Zipper / center line
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(centerX, bodyY + 12);
            ctx.lineTo(centerX, bodyY + 10 + h * 0.35);
            ctx.stroke();

            // Belt
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(centerX - w / 2 + 4, bodyY + 10 + h * 0.35, w - 8, h * 0.12, 2);
            ctx.fill();
            // Belt buckle
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(centerX - 2, bodyY + 11 + h * 0.35, 4, h * 0.1);

            // Tech emblem glow
            ctx.fillStyle = '#0ea5e9';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(centerX, bodyY + 18, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Head
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(centerX, bodyY + 5, 9, 0, Math.PI * 2);
            ctx.fill();
            // Hair spikes
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(centerX - 7, bodyY + 1);
            ctx.lineTo(centerX - 3, bodyY - 6);
            ctx.lineTo(centerX, bodyY + 0);
            ctx.lineTo(centerX + 3, bodyY - 7);
            ctx.lineTo(centerX + 5, bodyY - 2);
            ctx.lineTo(centerX + 7, bodyY - 5);
            ctx.lineTo(centerX + 9, bodyY + 1);
            ctx.closePath();
            ctx.fill();

            // Eye (white)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(centerX + 4, bodyY + 4, 3.5, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Pupil
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(centerX + 5.5, bodyY + 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Eye highlight
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX + 5, bodyY + 3.2, 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Visor (cyberpunk goggles on forehead)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(centerX + 1, bodyY + 0, 8, 4, 2);
            ctx.fill();
            ctx.fillStyle = '#f43f5e';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 6;
            ctx.fillRect(centerX + 3, bodyY + 1, 5, 1.5);
            ctx.shadowBlur = 0;

            // Front leg
            const rLegAngle = isJumping ? -0.8 : Math.sin(runCycle) * 0.8;
            drawLimb(centerX, bodyY + h / 2 - 10, rLegAngle, '#cbd5e1', 6, 14, 14);
            drawShoe(centerX, bodyY + h / 2 - 10, rLegAngle, 14, 14, '#1e293b');

            // Front arm
            const rArmAngle = isJumping ? -2.5 : Math.sin(runCycle + Math.PI) * 0.8;
            drawLimb(centerX, bodyY + 15, rArmAngle, '#cbd5e1', 5, 12, 10);
        }

        function drawShoe(baseX, baseY, angle, len1, len2, color) {
            ctx.save();
            ctx.translate(baseX, baseY);
            ctx.rotate(angle);
            ctx.translate(0, len1);
            const jointBend = Math.max(0.1, angle * 1.5 + 0.5);
            ctx.rotate(jointBend);
            ctx.translate(0, len2);
            // Sneaker shape
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-4, -2, 10, 5, 2);
            ctx.fill();
            // Sole
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-3, 2, 8, 1.5);
            ctx.restore();
        }

        function drawLimb(x, y, angle, color, width, len1, len2) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, len1);
            ctx.stroke();
            const jointBend = Math.max(0.1, angle * 1.5 + 0.5);
            ctx.translate(0, len1);
            ctx.rotate(jointBend);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, len2);
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            const sky = getSkyColor(timeProgress);
            const biome = getBiome(cameraX);

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, sky.top);
            gradient.addColorStop(1, sky.bot);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun
            if (timeProgress < 0.35) {
                const sunY = canvas.height * 0.3 + (timeProgress * canvas.height * 2.0);
                const alpha = Math.max(0, 1 - timeProgress * 3);
                ctx.save();
                ctx.fillStyle = `rgba(255, 160, 50, ${alpha * 0.1})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const glow = ctx.createRadialGradient(canvas.width * 0.8, sunY, 40, canvas.width * 0.8, sunY, 400);
                glow.addColorStop(0, `rgba(255, 200, 100, ${alpha * 0.4})`);
                glow.addColorStop(1, `rgba(255, 100, 50, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, sunY, 400, 0, Math.PI * 2);
                ctx.fill();
                const sun = ctx.createRadialGradient(canvas.width * 0.8, sunY, 10, canvas.width * 0.8, sunY, 100);
                sun.addColorStop(0, `rgba(255, 255, 240, ${alpha})`);
                sun.addColorStop(0.2, `rgba(255, 220, 100, ${alpha})`);
                sun.addColorStop(0.6, `rgba(255, 140, 0, ${alpha * 0.5})`);
                sun.addColorStop(1, `rgba(255, 100, 0, 0)`);
                ctx.fillStyle = sun;
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, sunY, 100, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Moon
            if (timeProgress > 0.1) {
                const moonY = canvas.height * 1.2 - (timeProgress * canvas.height * 0.9);
                const moonX = canvas.width * 0.2 + (timeProgress * 100);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(moonX, moonY, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Stars
            if (timeProgress > 0.2 && timeProgress < 0.8) {
                const starOpacity = timeProgress > 0.3 && timeProgress < 0.7 ? 1 : 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity})`;
                stars.forEach(s => {
                    ctx.globalAlpha = Math.random() * s.alpha * starOpacity;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;
            }

            // === MOUNTAINS / HILLS ===
            if (mountainPoints.length > 1) {
                const mtBaseY = canvas.height * 0.55;
                // City = blue-gray mountains, jungle = green rolling hills
                const mtR = Math.round(30 + biome.blend * 10);
                const mtG = Math.round(41 + biome.blend * 60);
                const mtB = Math.round(59 - biome.blend * 20);
                ctx.fillStyle = `rgba(${mtR},${mtG},${mtB}, 0.25)`;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                mountainPoints.forEach((mp, i) => {
                    const hillH = mp.h * (biome.blend > 0.5 ? 0.7 : 1.0);
                    if (i === 0) ctx.lineTo(mp.x, mtBaseY - hillH);
                    else {
                        const prev = mountainPoints[i - 1];
                        const cpx = (prev.x + mp.x) / 2;
                        ctx.quadraticCurveTo(cpx, mtBaseY - (prev.h + hillH) / 2 - 10, mp.x, mtBaseY - hillH);
                    }
                });
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            }

            // === ATMOSPHERIC FOG ===
            const fogY = canvas.height * 0.5;
            const fogGrad = ctx.createLinearGradient(0, fogY - 30, 0, fogY + 50);
            const fogR = Math.round(15 + biome.blend * 10);
            const fogG = Math.round(23 + biome.blend * 30);
            const fogB = Math.round(42 - biome.blend * 10);
            fogGrad.addColorStop(0, `rgba(${fogR},${fogG},${fogB}, 0)`);
            fogGrad.addColorStop(0.5, `rgba(${fogR},${fogG},${fogB}, 0.15)`);
            fogGrad.addColorStop(1, `rgba(${fogR},${fogG},${fogB}, 0)`);
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, fogY - 30, canvas.width, 80);

            // === FLYING BIRDS ===
            ctx.strokeStyle = `rgba(30, 30, 30, 0.4)`;
            ctx.lineWidth = 1.5;
            birds.forEach(bird => {
                const wingY = Math.sin(bird.wingPhase) * bird.size * 0.6;
                ctx.beginPath();
                ctx.moveTo(bird.x - bird.size, bird.y + wingY);
                ctx.lineTo(bird.x, bird.y);
                ctx.lineTo(bird.x + bird.size, bird.y + wingY);
                ctx.stroke();
            });

            // Clouds (Weather)
            weather.clouds.forEach(c => {
                const stormDarkness = weather.intensity * 100;
                ctx.fillStyle = `rgba(${255 - stormDarkness}, ${255 - stormDarkness}, ${255 - stormDarkness}, 0.3)`;
                ctx.beginPath();
                ctx.roundRect(c.x, c.y, c.w, c.h, 20);
                ctx.fill();
            });

            // === BACKGROUND ELEMENTS (Buildings + Trees) ===
            backgroundBuildings.forEach(b => {
                if (b.elementType === 'tree') {
                    drawTree(b);
                } else {
                    drawBuilding(b);
                }
            });

            ctx.save();
            ctx.translate(-cameraX, 0);

            // === PLATFORMS (Biome-specific) ===
            platforms.forEach(p => {
                const pBiome = getBiome(p.x);
                if (pBiome.blend > 0.5) {
                    // JUNGLE: wooden planks
                    ctx.fillStyle = '#5c3d2e';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    // Plank lines
                    ctx.strokeStyle = '#4a3020';
                    ctx.lineWidth = 1;
                    for (let lx = 0; lx < p.w; lx += 35 + Math.sin(lx) * 10) {
                        ctx.beginPath();
                        ctx.moveTo(p.x + lx, p.y);
                        ctx.lineTo(p.x + lx, p.y + Math.min(30, p.h));
                        ctx.stroke();
                    }
                    // Mossy top edge
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(p.x, p.y, p.w, 3);
                    ctx.fillStyle = '#22c55e';
                    // Moss tufts
                    for (let mx = 0; mx < p.w; mx += 12 + Math.random() * 8) {
                        const mh = 3 + Math.random() * 5;
                        ctx.beginPath();
                        ctx.arc(p.x + mx, p.y, mh, Math.PI, 0);
                        ctx.fill();
                    }
                    // Vines hanging below
                    ctx.strokeStyle = '#16a34a';
                    ctx.lineWidth = 1.5;
                    for (let vx = 20; vx < p.w; vx += 60 + Math.random() * 40) {
                        const vLen = 15 + Math.random() * 25;
                        ctx.beginPath();
                        ctx.moveTo(p.x + vx, p.y + 4);
                        ctx.quadraticCurveTo(p.x + vx + 5, p.y + vLen * 0.6, p.x + vx - 3, p.y + vLen);
                        ctx.stroke();
                    }
                } else {
                    // CITY: concrete rooftops
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    // Top edge highlight
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y, p.w, 4);
                    // Floor lines (structural detail)
                    ctx.fillStyle = '#334155';
                    for (let lx = 50; lx < p.w; lx += 100) {
                        ctx.fillRect(p.x + lx, p.y + 10, 3, Math.min(p.h - 20, 40));
                    }
                    // Railing posts
                    ctx.fillStyle = '#64748b';
                    for (let rx = 0; rx < p.w; rx += 40) {
                        ctx.fillRect(p.x + rx, p.y - 8, 2, 8);
                    }
                    // Railing top bar
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y - 8, p.w, 1.5);
                    // Random pipes/vents
                    if (p.w > 200) {
                        ctx.fillStyle = '#334155';
                        ctx.fillRect(p.x + 30, p.y + 6, 8, 12);
                        ctx.fillRect(p.x + p.w - 50, p.y + 6, 10, 8);
                    }
                }
            });

            drawCharacter(player.x, player.y, player.width, player.height);

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // Rain (Foreground)
            if (weather.intensity > 0) {
                ctx.strokeStyle = `rgba(170, 200, 255, ${weather.intensity * 0.5})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                weather.raindrops.forEach(r => {
                    ctx.moveTo(r.x, r.y);
                    ctx.lineTo(r.x + r.vx * 2, r.y + r.l);
                });
                ctx.stroke();
            }

            // Vignette & Flash
            const vignetteAlpha = 0.3 + (timeProgress > 0.2 && timeProgress < 0.8 ? 0.3 : 0);
            const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height / 2, canvas.width / 2, canvas.height / 2, canvas.height);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, `rgba(0,0,0,${vignetteAlpha})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lightning Flash
            if (weather.flashOpacity > 0.01) {
                ctx.fillStyle = `rgba(255, 255, 255, ${weather.flashOpacity})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // === BUILDING RENDERER ===
        function drawBuilding(b) {
            const baseAlpha = 0.3 + b.layer * 0.2;
            // Building body with side-lit gradient for 3D depth
            const bGrad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y);
            bGrad.addColorStop(0, `rgba(10, 18, 35, ${baseAlpha + 0.1})`);
            bGrad.addColorStop(0.3, `rgba(15, 23, 42, ${baseAlpha})`);
            bGrad.addColorStop(0.7, `rgba(30, 41, 59, ${baseAlpha})`);
            bGrad.addColorStop(1, `rgba(20, 30, 50, ${baseAlpha + 0.05})`);
            ctx.fillStyle = bGrad;
            ctx.fillRect(b.x, b.y, b.w, b.h);

            // Horizontal floor lines
            ctx.strokeStyle = `rgba(50, 60, 80, ${baseAlpha * 0.5})`;
            ctx.lineWidth = 0.5;
            for (let fy = 25; fy < b.h; fy += 25) {
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + fy);
                ctx.lineTo(b.x + b.w, b.y + fy);
                ctx.stroke();
            }

            // Rooftop
            ctx.fillStyle = `rgba(15, 23, 42, ${baseAlpha + 0.1})`;
            if (b.roofType === 1) {
                ctx.fillRect(b.x + b.w / 2 - 2, b.y - 20, 4, 20);
            } else if (b.roofType === 2) {
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x + b.w, b.y);
                ctx.lineTo(b.x + b.w, b.y - 15);
                ctx.fill();
            }

            // Rooftop details
            if (b.rooftopDetails) {
                b.rooftopDetails.forEach(d => {
                    if (d.type === 'antenna') {
                        ctx.strokeStyle = `rgba(100, 116, 139, ${baseAlpha + 0.2})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(b.x + d.x, b.y);
                        ctx.lineTo(b.x + d.x, b.y - d.h);
                        ctx.stroke();
                        // Blinking red light
                        const blinkOn = (Math.sin(animTime * 2 + d.blink * 10) > 0);
                        if (blinkOn) {
                            ctx.fillStyle = '#ef4444';
                            ctx.shadowColor = '#ef4444';
                            ctx.shadowBlur = 6;
                            ctx.beginPath();
                            ctx.arc(b.x + d.x, b.y - d.h, 2, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;
                        }
                    } else if (d.type === 'ac') {
                        ctx.fillStyle = `rgba(71, 85, 105, ${baseAlpha + 0.3})`;
                        ctx.fillRect(b.x + d.x, b.y - 6, 12, 6);
                        ctx.strokeStyle = `rgba(100, 116, 139, ${baseAlpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(b.x + d.x, b.y - 6, 12, 6);
                    } else if (d.type === 'tank') {
                        ctx.fillStyle = `rgba(51, 65, 85, ${baseAlpha + 0.3})`;
                        ctx.fillRect(b.x + d.x, b.y - 18, 16, 18);
                        // Tank legs
                        ctx.fillRect(b.x + d.x + 2, b.y - 22, 2, 4);
                        ctx.fillRect(b.x + d.x + 12, b.y - 22, 2, 4);
                    } else if (d.type === 'dish') {
                        ctx.strokeStyle = `rgba(148, 163, 184, ${baseAlpha + 0.3})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(b.x + d.x, b.y - 4, 6, Math.PI, 0);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(b.x + d.x, b.y - 4);
                        ctx.lineTo(b.x + d.x, b.y);
                        ctx.stroke();
                    }
                });
            }

            // Balconies
            if (b.balconies) {
                b.balconies.forEach(bal => {
                    const bx = bal.side === 'left' ? b.x - 4 : b.x + b.w;
                    ctx.fillStyle = `rgba(51, 65, 85, ${baseAlpha + 0.2})`;
                    ctx.fillRect(bx, b.y + bal.y, bal.side === 'left' ? 5 : 4, 3);
                    ctx.strokeStyle = `rgba(100, 116, 139, ${baseAlpha})`;
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(bx, b.y + bal.y - 12, bal.side === 'left' ? 5 : 4, 15);
                });
            }

            // Windows
            const isNight = timeProgress > 0.25 && timeProgress < 0.75;
            const isStormy = weather.intensity > 0.5;
            if (b.windows) {
                b.windows.forEach(win => {
                    let lightOn = (isNight || isStormy) && win.lightSeed > 0.4;
                    if (lightOn) {
                        ctx.fillStyle = `rgba(253, 224, 71, ${0.4 + b.layer * 0.2})`;
                        ctx.shadowColor = '#facc15';
                        ctx.shadowBlur = 5;
                    } else {
                        ctx.fillStyle = `rgba(0,0,0,0.4)`;
                        ctx.shadowBlur = 0;
                    }
                    ctx.fillRect(b.x + win.x, b.y + win.y, win.w, win.h);
                    // Window frame
                    ctx.strokeStyle = `rgba(71, 85, 105, ${baseAlpha * 0.3})`;
                    ctx.lineWidth = 0.3;
                    ctx.strokeRect(b.x + win.x, b.y + win.y, win.w, win.h);
                    ctx.shadowBlur = 0;
                });
            }

            // Neon sign
            if (b.neonSign) {
                const ns = b.neonSign;
                ctx.fillStyle = ns.color;
                ctx.shadowColor = ns.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(b.x + ns.x, b.y + ns.y, ns.w, ns.h);
                ctx.shadowBlur = 0;
            }
        }

        // === TREE RENDERER ===
        function drawTree(t) {
            const baseAlpha = 0.3 + t.layer * 0.2;
            const cx = t.x + t.w / 2;
            // Trunk
            ctx.fillStyle = `rgba(101, 67, 33, ${baseAlpha + 0.2})`;
            ctx.fillRect(cx - t.trunkW / 2, t.y, t.trunkW, t.h);
            // Bark lines
            ctx.strokeStyle = `rgba(80, 50, 20, ${baseAlpha * 0.5})`;
            ctx.lineWidth = 0.5;
            for (let by = 5; by < t.h; by += 12 + Math.random() * 8) {
                ctx.beginPath();
                ctx.moveTo(cx - t.trunkW / 2 + 2, t.y + by);
                ctx.lineTo(cx + t.trunkW / 2 - 2, t.y + by + 3);
                ctx.stroke();
            }

            // Canopy
            const greens = [
                [22, 101, 52],  // dark
                [34, 139, 34],  // mid
                [74, 222, 128]  // light
            ];
            const gc = greens[t.leafShade];
            const canopyY = t.y - t.canopySize * 0.6;

            if (t.canopyType === 'round') {
                // Multiple overlapping circles for organic feel
                for (let i = 0; i < 3; i++) {
                    const offX = (i - 1) * t.canopySize * 0.35;
                    const offY = -i * 5;
                    const r = t.canopySize * (0.7 + i * 0.1);
                    const shade = Math.min(255, gc[1] + i * 15);
                    ctx.fillStyle = `rgba(${gc[0]}, ${shade}, ${gc[2]}, ${baseAlpha + 0.1})`;
                    ctx.beginPath();
                    ctx.arc(cx + offX, canopyY + offY, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                // Pine tree: stacked triangles
                for (let i = 0; i < 3; i++) {
                    const tier = t.canopySize * (1.2 - i * 0.25);
                    const tierY = canopyY + i * t.canopySize * 0.4;
                    const shade = Math.min(255, gc[1] + i * 20);
                    ctx.fillStyle = `rgba(${gc[0]}, ${shade}, ${gc[2]}, ${baseAlpha + 0.1})`;
                    ctx.beginPath();
                    ctx.moveTo(cx, tierY - tier * 0.6);
                    ctx.lineTo(cx - tier, tierY + tier * 0.4);
                    ctx.lineTo(cx + tier, tierY + tier * 0.4);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Vines
            if (t.vines) {
                ctx.strokeStyle = `rgba(22, 163, 74, ${baseAlpha + 0.15})`;
                ctx.lineWidth = 1;
                t.vines.forEach(v => {
                    const vx = cx + v.xOff;
                    const vy = canopyY + t.canopySize * 0.3;
                    const sway = Math.sin(animTime * 0.5 + v.sway) * 4;
                    ctx.beginPath();
                    ctx.moveTo(vx, vy);
                    ctx.quadraticCurveTo(vx + sway, vy + v.len * 0.5, vx + sway * 0.5, vy + v.len);
                    ctx.stroke();
                });
            }
        }

        function loop(timestamp) {
            if (gameState === 'PLAYING') {
                // Delta-time: dt = 1.0 at 60fps, scales proportionally
                if (lastTime === 0) lastTime = timestamp;
                const elapsed = timestamp - lastTime;
                lastTime = timestamp;
                // Clamp dt to avoid spiral-of-death on tab switch (max ~3 frames)
                const dt = Math.min(elapsed / (1000 / 60), 3);
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }
        }

        // === PAUSE SYSTEM ===
        const pauseOverlay = document.createElement('div');
        pauseOverlay.id = 'pause-overlay';
        pauseOverlay.className = 'overlay hidden';
        pauseOverlay.innerHTML = `
            <h2 class="text-4xl sm:text-6xl font-black text-white mb-4 uppercase tracking-tight">Paused</h2>
            <p class="text-slate-400 text-sm uppercase tracking-widest mb-8">Press P or tap Resume to continue</p>
            <button id="resume-btn" class="btn-start">Resume</button>
        `;
        document.getElementById('game-container').appendChild(pauseOverlay);

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.classList.remove('hidden');
                document.getElementById('pause-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="6,4 20,12 6,20"/></svg>';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseOverlay.classList.add('hidden');
                document.getElementById('pause-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
                lastTime = 0; // Reset delta so no time-jump
                requestAnimationFrame(loop);
            }
        }

        document.getElementById('pause-btn').addEventListener('click', e => {
            e.stopPropagation();
            togglePause();
        });
        document.getElementById('pause-btn').addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            togglePause();
        });
        pauseOverlay.querySelector('#resume-btn').addEventListener('click', togglePause);
        pauseOverlay.querySelector('#resume-btn').addEventListener('touchend', e => {
            e.preventDefault();
            togglePause();
        });

        function gameOver() {
            gameState = 'GAMEOVER';
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = score;
            if (SoundSys.initialized && SoundSys.rainGain) {
                SoundSys.rainGain.gain.exponentialRampToValueAtTime(0.001, SoundSys.ctx.currentTime + 1);
            }
        }

        function jump() {
            if (gameState !== 'PLAYING') return;
            if (player.isGrounded) {
                player.vy = JUMP_FORCE;
                createParticles(player.x + player.width / 2, player.y + player.height, 5, '#fff');
                SoundSys.playJump();
            }
        }

        function dash() {
            if (gameState !== 'PLAYING') return;
            if (player.stamina >= 30) {
                player.stamina -= 30;
                player.x += 100; // Blink forward
                createParticles(player.x, player.y + player.height / 2, 10, '#6366f1');
                updateStaminaUI();
            }
        }

        // ── Keyboard Input ──
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
            if (e.code === 'ShiftLeft' || e.code === 'ArrowRight') { e.preventDefault(); dash(); }
            if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); togglePause(); }
        });

        // ── Mobile Touch Input ──
        const touchJumpBtn = document.getElementById('touch-jump');
        const touchDashBtn = document.getElementById('touch-dash');

        // On-screen button handlers (multi-touch safe)
        touchJumpBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            jump();
        }, { passive: false });

        touchDashBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            dash();
        }, { passive: false });

        // Fallback: tap anywhere on canvas (left half = jump, right half = dash)
        canvas.addEventListener('touchstart', e => {
            // Don't trigger if touching a button or control
            if (e.target.closest('.pause-btn, .touch-btn, .btn-start, .overlay')) return;
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) jump();
            else dash();
        }, { passive: false });

        // Prevent default touch behaviors on the game container
        document.getElementById('game-container').addEventListener('touchmove', e => {
            e.preventDefault();
        }, { passive: false });

        // ── UI Buttons ──
        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
        });

        // Also handle touch for start button explicitly
        document.getElementById('start-btn').addEventListener('touchend', e => {
            e.preventDefault();
            startScreen.classList.add('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('touchend', e => {
            e.preventDefault();
            gameOverScreen.classList.add('hidden');
            initGame();
        });

    </script>
</body>

</html>
