<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horizon Runner: Urban Parkour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* Cinematic UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: skewX(-5deg);
            pointer-events: auto;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pause-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.75rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            pointer-events: auto;
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        .pause-btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: white;
            color: black;
            padding: 1rem 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .key-hint {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.7rem;
            margin: 0 0.2rem;
        }

        /* ── Mobile Touch Controls ── */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1rem 1.5rem 1.5rem;
            justify-content: space-between;
            z-index: 40;
            pointer-events: none;
        }

        .touch-btn {
            pointer-events: auto;
            width: clamp(80px, 22vw, 130px);
            height: clamp(60px, 14vh, 90px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: clamp(0.6rem, 2.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.93);
        }

        .touch-btn .icon {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
        }

        /* Portrait Warning */
        .portrait-warning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: 'Inter', sans-serif;
        }

        .portrait-warning .rotate-icon {
            font-size: 3rem;
            animation: rotateHint 2s ease-in-out infinite;
        }

        @keyframes rotateHint {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        /* ── Responsive: show touch controls on touch devices ── */
        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: flex;
            }

            .key-hint-row {
                display: none !important;
            }
        }

        /* ── Responsive: small screens ── */
        @media (max-width: 640px) {
            .ui-layer {
                padding: 0.75rem;
            }

            .hud-panel {
                padding: 0.5rem 0.75rem;
                border-radius: 0.6rem;
                transform: skewX(-3deg);
            }
        }

        /* ── Portrait orientation on mobile ── */
        @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
            .portrait-warning {
                display: flex;
            }

            #game-container {
                filter: blur(6px);
            }
        }
    </style>
</head>

<body>

    <div id="game-container">

        <!-- HUD -->
        <div class="ui-layer">
            <div class="flex justify-between w-full items-start">
                <div class="flex items-start gap-2">
                    <div class="hud-panel">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Distance</div>
                        <div class="text-3xl font-black tabular-nums tracking-tighter"><span id="score-el">0</span><span
                                class="text-sm text-slate-500 ml-1">m</span></div>
                    </div>
                    <div class="hud-panel" id="lives-panel">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Lives</div>
                        <div id="hearts-el" class="text-2xl mt-0.5" style="transform: skewX(5deg);">❤️❤️❤️</div>
                    </div>
                </div>
                <div class="flex items-start gap-2">
                    <div class="hud-panel text-right">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Stamina</div>
                        <div class="w-32 h-2 bg-slate-700 rounded-full mt-2 overflow-hidden">
                            <div id="stamina-bar" class="h-full bg-emerald-400 w-full"></div>
                        </div>
                    </div>
                    <button id="pause-btn" class="pause-btn" title="Pause (P)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <rect x="6" y="4" width="4" height="16" rx="1" />
                            <rect x="14" y="4" width="4" height="16" rx="1" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Controls Hint (desktop-only keyboard hints) -->
            <div
                class="key-hint-row text-center text-slate-500 text-xs font-medium uppercase tracking-widest opacity-50 md:hidden">
                Tap Left to Jump • Tap Right to Dash
            </div>
        </div>

        <!-- Mobile On-Screen Touch Buttons -->
        <div class="touch-controls" id="touch-controls">
            <button class="touch-btn" id="touch-jump">
                <span class="icon">⬆</span>
                JUMP
            </button>
            <button class="touch-btn" id="touch-dash">
                <span class="icon">⚡</span>
                DASH
            </button>
        </div>

        <!-- Portrait Rotation Warning -->
        <div class="portrait-warning" id="portrait-warning">
            <div class="rotate-icon">📱</div>
            <div class="text-lg font-bold uppercase tracking-widest">Rotate Your Device</div>
            <div class="text-sm text-slate-400">This game is best played in landscape mode</div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1
                class="text-4xl sm:text-6xl md:text-8xl font-black text-white mb-2 tracking-tighter uppercase italic drop-shadow-2xl">
                Horizon</h1>
            <h2 class="text-base sm:text-xl text-slate-400 uppercase tracking-[0.5em] font-light mb-8 sm:mb-12">Urban
                Parkour</h2>

            <button id="start-btn" class="btn-start">
                Begin Run
            </button>

            <div
                class="key-hint-row mt-6 sm:mt-8 text-slate-400 text-xs uppercase tracking-widest font-medium flex gap-6">
                <span><span class="key-hint">SPACE</span> Jump</span>
                <span><span class="key-hint">SHIFT</span> Dash</span>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="text-3xl sm:text-5xl font-black text-white mb-4 uppercase tracking-tight">Critical Failure</h2>
            <div class="text-center mb-6 sm:mb-10">
                <div class="text-xs text-slate-400 uppercase tracking-widest mb-1">Total Distance</div>
                <div class="text-4xl sm:text-6xl font-black text-white"><span id="final-score">0</span>m</div>
            </div>
            <button id="restart-btn" class="btn-start">
                Retry
            </button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreEl = document.getElementById('score-el');
        const finalScoreEl = document.getElementById('final-score');
        const staminaBar = document.getElementById('stamina-bar');

        // Game Constants
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const SPEED_base = 6;
        const DASH_SPEED = 10;
        const DAY_CYCLE_LENGTH = 100000;

        // Game State
        let gameState = 'MENU';
        let score = 0;
        let cameraX = 0;
        let gameSpeed = SPEED_base;
        let animTime = 0;
        let timeProgress = 0;
        let lastStepTime = 0;
        let frameCount = 0;
        let lastTime = 0;
        let lives = 3;
        let invincibleTimer = 0; // brief invincibility after losing a life
        let transitionCreatures = []; // butterflies/parrots during transition
        let biomeFlashAlpha = 0; // transition flash effect

        // Player
        const player = {
            x: 100,
            y: 0,
            width: 34,
            height: 60,
            vx: 0,
            vy: 0,
            isGrounded: false,
            stamina: 100,
            color: '#fff',
            trail: []
        };

        // World
        let platforms = [];
        let particles = [];
        let backgroundBuildings = [];
        let stars = [];
        let birds = [];
        let mountainPoints = [];
        let nightAircraft = []; // planes flying at night

        // Biome System (city → jungle, looping)
        const BIOME_CYCLE = 40000; // pixels per full biome cycle (~4000m score)
        function getBiome(distance) {
            const pos = ((distance % BIOME_CYCLE) + BIOME_CYCLE) % BIOME_CYCLE;
            if (pos < 15000) return { type: 'city', blend: 0 };      // 0-1500m
            if (pos < 20000) return { type: 'transition', blend: (pos - 15000) / 5000 }; // 1500-2000m
            if (pos < 30000) return { type: 'jungle', blend: 1 };    // 2000-3000m
            return { type: 'transition', blend: 1 - (pos - 30000) / 10000 }; // 3000-4000m
        }

        function initBirds() {
            birds = [];
            for (let i = 0; i < 8; i++) {
                birds.push({
                    x: Math.random() * canvas.width,
                    y: 15 + Math.random() * canvas.height * 0.15,
                    speed: 0.4 + Math.random() * 0.6,
                    wingPhase: Math.random() * Math.PI * 2,
                    size: 4 + Math.random() * 5,
                    bobPhase: Math.random() * Math.PI * 2
                });
            }
        }

        function initMountains() {
            mountainPoints = [];
            const segments = 20;
            for (let i = 0; i <= segments; i++) {
                mountainPoints.push({
                    x: (i / segments) * canvas.width,
                    h: 40 + Math.random() * 80
                });
            }
        }

        // Weather System
        const weather = {
            active: false,
            intensity: 0, // 0 to 1
            flashOpacity: 0,
            nextChange: 600, // Frames until weather change logic
            raindrops: [],
            clouds: []
        };

        // --- AUDIO SYSTEM ---
        const SoundSys = {
            ctx: null,
            noiseBuffer: null,
            rainGain: null,
            bgmOsc1: null,
            bgmGain: null,
            initialized: false,
            isMuted: false,

            init: function () {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // Create Noise Buffer
                const bufferSize = this.ctx.sampleRate * 2;
                this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                // Rain Sound Setup
                const rainSrc = this.ctx.createBufferSource();
                rainSrc.buffer = this.noiseBuffer;
                rainSrc.loop = true;
                const rainFilter = this.ctx.createBiquadFilter();
                rainFilter.type = 'lowpass';
                rainFilter.frequency.value = 400;
                this.rainGain = this.ctx.createGain();
                this.rainGain.gain.value = 0;

                rainSrc.connect(rainFilter);
                rainFilter.connect(this.rainGain);
                this.rainGain.connect(this.ctx.destination);
                rainSrc.start();

                // Ambient BGM (Cyberpunk drone)
                this.bgmGain = this.ctx.createGain();
                this.bgmGain.gain.value = this.isMuted ? 0 : 0.05;

                this.bgmOsc1 = this.ctx.createOscillator();
                this.bgmOsc1.type = 'sawtooth';
                this.bgmOsc1.frequency.value = 55; // Low A

                const lfo = this.ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.5; // slow throb
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 10;
                lfo.connect(lfoGain);
                lfoGain.connect(this.bgmOsc1.frequency);

                const bgmFilter = this.ctx.createBiquadFilter();
                bgmFilter.type = 'lowpass';
                bgmFilter.frequency.value = 300;

                this.bgmOsc1.connect(bgmFilter);
                bgmFilter.connect(this.bgmGain);
                this.bgmGain.connect(this.ctx.destination);

                this.bgmOsc1.start();
                lfo.start();

                this.initialized = true;
                if (this.isMuted) this.ctx.suspend();
            },

            toggleMute: function () {
                this.isMuted = !this.isMuted;
                if (!this.initialized && !this.isMuted) {
                    this.init();
                } else if (this.initialized) {
                    if (this.isMuted) {
                        this.ctx.suspend();
                    } else {
                        this.ctx.resume();
                    }
                }
                return this.isMuted;
            },

            updateWeatherAudio: function (intensity) {
                if (!this.initialized || this.isMuted) return;
                const targetVol = intensity * 0.4;
                this.rainGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.5);
            },

            playThunder: function () {
                if (!this.initialized || this.isMuted) return;
                const osc = this.ctx.createBufferSource();
                osc.buffer = this.noiseBuffer;

                // Low rumble thunder
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(100, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(300, this.ctx.currentTime + 0.2);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 2.0);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(1.2, this.ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 2.5);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 2.5);
            },

            playStep: function () {
                if (!this.initialized || this.isMuted) return;
                // Layered footstep: noise transient + low thud
                const t = this.ctx.currentTime;

                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'bandpass';
                nFilter.frequency.value = 1200;
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.15, t);
                nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                noise.connect(nFilter).connect(nGain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 0.05);

                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
                const oscGain = this.ctx.createGain();
                oscGain.gain.setValueAtTime(0.3, t);
                oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(oscGain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.1);
            },

            playJump: function () {
                if (!this.initialized || this.isMuted) return;
                const t = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                osc.type = 'square'; // more retro/punchy
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(400, t + 0.15);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(500, t);
                filter.frequency.linearRampToValueAtTime(2000, t + 0.1);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);

                osc.connect(filter).connect(gain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.2);

                // Jump whoosh
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'lowpass';
                nFilter.frequency.setValueAtTime(1000, t);
                nFilter.frequency.linearRampToValueAtTime(200, t + 0.2);
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.1, t);
                nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                noise.connect(nFilter).connect(nGain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 0.2);
            },

            playLand: function () {
                if (!this.initialized || this.isMuted) return;
                const t = this.ctx.currentTime;

                // Hard thud
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.connect(gain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.15);

                // Scuff
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'lowpass';
                nFilter.frequency.value = 800;
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.2, t);
                nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                noise.connect(nFilter).connect(nGain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 0.15);
            }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            initClouds();
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => {
            setTimeout(resize, 150);
        });

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.6,
                    size: Math.random() * 2,
                    alpha: Math.random()
                });
            }
        }

        function initClouds() {
            weather.clouds = [];
            for (let i = 0; i < 8; i++) {
                const w = 100 + Math.random() * 200;
                const h = 40 + Math.random() * 40;
                // Generate puffy circle data for each cloud
                const puffs = [];
                const puffCount = 4 + Math.floor(Math.random() * 4);
                for (let p = 0; p < puffCount; p++) {
                    puffs.push({
                        xOff: (p / (puffCount - 1)) * w * 0.8 + w * 0.1 - w / 2,
                        yOff: (Math.random() - 0.5) * h * 0.4,
                        r: h * 0.35 + Math.random() * h * 0.3
                    });
                }
                weather.clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.3,
                    w, h,
                    speed: 0.2 + Math.random() * 0.3,
                    puffs
                });
            }
        }
        resize();

        // --- Generation ---

        function initGame() {
            SoundSys.init();
            if (SoundSys.ctx.state === 'suspended') SoundSys.ctx.resume();

            player.x = 100;
            player.y = canvas.height - 200;
            player.vx = 0;
            player.vy = 0;
            player.stamina = 100;
            score = 0;
            cameraX = 0;
            gameSpeed = SPEED_base;
            animTime = 0;
            timeProgress = 0;
            lastStepTime = 0;
            frameCount = 0;
            lastTime = 0;
            lives = 3;
            invincibleTimer = 0;
            biomeFlashAlpha = 0;
            transitionCreatures = [];
            nightAircraft = [];

            platforms = [];
            particles = [];
            backgroundBuildings = [];
            birds = [];

            // Reset weather
            weather.active = false;
            weather.intensity = 0;
            weather.flashOpacity = 0;
            weather.raindrops = [];
            initClouds();
            initBirds();
            initMountains();

            platforms.push(createPlatform(0, canvas.height - 150, 1500));

            for (let i = 0; i < 18; i++) {
                backgroundBuildings.push(createBackgroundElement(i * 120 - 200, 0));
            }

            updateLivesUI();
            gameState = 'PLAYING';
            scoreEl.innerText = '0';
            updateStaminaUI();
            requestAnimationFrame(loop);
        }

        function updateLivesUI() {
            const heartsEl = document.getElementById('hearts-el');
            let html = '';
            for (let i = 0; i < 3; i++) {
                if (i < lives) html += '<span style="filter: drop-shadow(0 0 4px #ef4444);">❤️</span>';
                else html += '<span style="opacity:0.2;filter:grayscale(1);">❤️</span>';
            }
            heartsEl.innerHTML = html;
        }

        // Create platform with pre-seeded decoration positions (fixes glitch)
        function createPlatform(x, y, w) {
            const mossTufts = [];
            for (let mx = 0; mx < w; mx += 12 + Math.random() * 8) {
                mossTufts.push({ x: mx, h: 3 + Math.random() * 5 });
            }
            const vinePositions = [];
            for (let vx = 20; vx < w; vx += 60 + Math.random() * 40) {
                vinePositions.push({ x: vx, len: 15 + Math.random() * 25, cx: 5, cy: -3 });
            }
            return { x, y, w, h: 1000, mossTufts, vinePositions };
        }

        // Creates either a building (city) or tree (jungle) based on biome
        function createBackgroundElement(xOffset, distanceHint) {
            const biome = getBiome(distanceHint);
            if (biome.blend > 0.5) {
                return createTree(xOffset);
            }
            return createBuilding(xOffset);
        }

        function createBuilding(xOffset) {
            const h = 150 + Math.random() * 400; // Taller buildings
            const w = 70 + Math.random() * 130; // Wider
            const layer = Math.floor(Math.random() * 3);
            const roofType = Math.floor(Math.random() * 3);
            const windows = [];
            if (layer > 0) {
                const rows = Math.floor(h / 25);
                const cols = Math.floor(w / 18);
                const style = Math.random();
                for (let r = 1; r < rows - 1; r++) {
                    for (let c = 1; c < cols - 1; c++) {
                        if ((style > 0.5 && Math.random() > 0.3) || (style <= 0.5 && (r + c) % 2 === 0)) {
                            // Occasional wide or tall windows if space permits
                            const wide = Math.random() > 0.8 && c < cols - 2;
                            const tall = !wide && Math.random() > 0.8 && r < rows - 2;
                            windows.push({
                                x: c * 18,
                                y: r * 25,
                                w: wide ? 24 : 10,
                                h: tall ? 36 : 16,
                                lightSeed: Math.random(),
                                colorTheme: Math.random() // for different light colors
                            });
                            if (wide) c++; // skip next column
                        }
                    }
                }
            }
            // Rooftop details
            const rooftopDetails = [];
            // Antennas
            if (Math.random() > 0.3) {
                rooftopDetails.push({ type: 'antenna', x: w * 0.2 + Math.random() * w * 0.6, h: 20 + Math.random() * 40, blink: Math.random() });
            }
            // AC units
            const acCount = Math.floor(Math.random() * 4);
            for (let i = 0; i < acCount; i++) {
                rooftopDetails.push({ type: 'ac', x: 8 + Math.random() * (w - 24) });
            }
            // Water tank
            if (Math.random() > 0.5 && h > 200) {
                rooftopDetails.push({ type: 'tank', x: 10 + Math.random() * (w - 30) });
            }
            // Satellite dish
            if (Math.random() > 0.6) {
                rooftopDetails.push({ type: 'dish', x: w * 0.1 + Math.random() * w * 0.8 });
            }
            // Billboard
            if (Math.random() > 0.8 && w > 80 && layer > 0) {
                rooftopDetails.push({
                    type: 'billboard',
                    x: 10 + Math.random() * (w - 70),
                    color: ['#3b82f6', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6'][Math.floor(Math.random() * 5)]
                });
            }
            // Neon sign
            let neonSign = null;
            if (layer >= 1 && Math.random() > 0.5 && h > 200) {
                const neonColors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#22c55e', '#f59e0b'];
                neonSign = {
                    x: 5 + Math.random() * (w - 30),
                    y: 30 + Math.random() * 40,
                    w: 15 + Math.random() * 20,
                    h: 8 + Math.random() * 10,
                    color: neonColors[Math.floor(Math.random() * neonColors.length)],
                    style: Math.floor(Math.random() * 3) // 0: rect, 1: text-like lines, 2: vertical
                };
            }
            // Balconies
            const balconies = [];
            if (layer >= 1 && Math.random() > 0.5) {
                const bCount = 2 + Math.floor(Math.random() * 4);
                for (let i = 0; i < bCount; i++) {
                    balconies.push({ y: 40 + i * (h / (bCount + 1)), side: Math.random() > 0.5 ? 'left' : 'right' });
                }
            }
            return {
                x: xOffset, y: canvas.height - h + 80, w, h,
                layer, roofType, windows, rooftopDetails, neonSign, balconies,
                elementType: 'building'
            };
        }

        function createTree(xOffset) {
            const layer = Math.floor(Math.random() * 3);
            const trunkH = 120 + Math.random() * 200; // Taller trees
            const trunkW = 12 + Math.random() * 22; // Thicker trunks

            // 4 canopy types: round, pine, tall, umbrella
            const canopyTypes = ['round', 'pine', 'tall', 'umbrella'];
            const canopyType = canopyTypes[Math.floor(Math.random() * canopyTypes.length)];
            const canopySize = 50 + Math.random() * 80;
            const leafShade = Math.floor(Math.random() * 4); // Added a new shade

            // Branches
            const branches = [];
            const branchCount = 3 + Math.floor(Math.random() * 4);
            for (let i = 0; i < branchCount; i++) {
                branches.push({
                    yFrac: 0.2 + Math.random() * 0.6,
                    side: Math.random() > 0.5 ? 1 : -1,
                    len: 20 + Math.random() * 40,
                    angle: 0.2 + Math.random() * 0.6,
                    width: 2 + Math.random() * 4
                });
            }
            // Leaf clusters on branches
            const leafClusters = [];
            branches.forEach(br => {
                if (Math.random() > 0.2) {
                    leafClusters.push({
                        yFrac: br.yFrac,
                        side: br.side,
                        len: br.len,
                        angle: br.angle,
                        size: 15 + Math.random() * 25,
                        shade: Math.floor(Math.random() * 4)
                    });
                }
            });
            // Roots
            const roots = [];
            if (Math.random() > 0.2) {
                const rootCount = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < rootCount; i++) {
                    roots.push({
                        side: (i % 2 === 0) ? -1 : 1,
                        len: 15 + Math.random() * 30,
                        curve: Math.random() * 12
                    });
                }
            }
            // Vines
            const vines = [];
            if (Math.random() > 0.2) {
                const vCount = 3 + Math.floor(Math.random() * 5);
                for (let i = 0; i < vCount; i++) {
                    vines.push({
                        xOff: -canopySize * 0.8 + Math.random() * canopySize * 1.6,
                        len: 40 + Math.random() * 80,
                        sway: Math.random() * Math.PI * 2,
                        leaflets: Math.random() > 0.3
                    });
                }
            }
            // Trunk texture seeds
            const barkLines = [];
            for (let by = 5; by < trunkH; by += 8 + Math.random() * 6) {
                barkLines.push({ y: by, curve: (Math.random() - 0.5) * 6 });
            }

            // Moss on trunk
            const mosses = [];
            for (let m = 0; m < 3; m++) {
                mosses.push({
                    y: Math.random() * trunkH,
                    size: 4 + Math.random() * 8,
                    side: Math.random() > 0.5 ? 1 : -1
                });
            }

            return {
                x: xOffset,
                y: canvas.height - trunkH + 80,
                w: Math.max(canopySize * 2, trunkW + 40),
                h: trunkH,
                layer, trunkW, canopyType, canopySize, leafShade,
                branches, leafClusters, roots, vines, barkLines, mosses,
                elementType: 'tree'
            };
        }

        // --- Physics & Logic ---

        function update(dt) {
            frameCount++;
            cameraX += gameSpeed * dt;
            timeProgress = (cameraX % DAY_CYCLE_LENGTH) / DAY_CYCLE_LENGTH;

            // --- Weather Logic ---
            // Randomly toggle weather state periodically
            if (frameCount > weather.nextChange) {
                weather.active = !weather.active;
                // Next change in 10-30 seconds (assuming 60fps)
                weather.nextChange = frameCount + 600 + Math.random() * 1200;
            }

            // Smoothly adjust intensity
            if (weather.active && weather.intensity < 1) {
                weather.intensity += 0.005 * dt;
            } else if (!weather.active && weather.intensity > 0) {
                weather.intensity -= 0.005 * dt;
            }

            // Update Audio based on weather
            SoundSys.updateWeatherAudio(weather.intensity);

            // Spawn Raindrops
            if (weather.intensity > 0) {
                // Spawn count scales with intensity
                const spawnCount = Math.floor(weather.intensity * 5) + 1;
                for (let i = 0; i < spawnCount; i++) {
                    weather.raindrops.push({
                        x: Math.random() * canvas.width + canvas.width * 0.2, // Offset for angle
                        y: -20,
                        vx: -3 - Math.random() * 2, // Wind blowing left
                        vy: 10 + Math.random() * 5, // Fall speed
                        l: 10 + Math.random() * 20  // Length
                    });
                }
            }

            // Update Raindrops
            for (let i = weather.raindrops.length - 1; i >= 0; i--) {
                let r = weather.raindrops[i];
                r.x += r.vx * dt;
                r.y += r.vy * dt;

                // Collision with floor (simple visual approximation)
                if (r.y > canvas.height - 100) {
                    // Chance to splash
                    if (Math.random() > 0.8) {
                        createParticles(r.x, r.y, 1, 'rgba(200,200,255,0.5)');
                    }
                    weather.raindrops.splice(i, 1);
                } else if (r.x < -50) {
                    weather.raindrops.splice(i, 1);
                }
            }

            // Thunder Logic
            if (weather.intensity > 0.7) {
                // Random chance for thunder (~every 5-10 seconds at max intensity)
                if (Math.random() > 0.995) {
                    weather.flashOpacity = 0.8;
                    SoundSys.playThunder();
                }
            }
            // Fade flash
            if (weather.flashOpacity > 0) weather.flashOpacity -= 0.05 * dt;

            // Move Clouds
            weather.clouds.forEach(c => {
                c.x -= c.speed * dt;
                if (c.x + c.w < 0) {
                    c.x = canvas.width + Math.random() * 200;
                    c.y = Math.random() * canvas.height * 0.3;
                }
            });

            // --- Player Logic ---
            player.x += (player.vx + gameSpeed) * dt;
            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;

            if (player.isGrounded) {
                animTime += 0.25 * dt;
                if (Math.floor(animTime / 2.1) > lastStepTime) {
                    SoundSys.playStep();
                    lastStepTime = Math.floor(animTime / 2.1);
                }
            } else {
                animTime = 0.5;
                lastStepTime = 0;
            }

            player.isGrounded = false;
            for (let p of platforms) {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + 25
                ) {
                    if (player.vy >= 0) {
                        player.isGrounded = true;
                        player.vy = 0;
                        player.y = p.y - player.height;
                        if (Math.random() > 0.9) createParticles(player.x + player.width / 2, player.y + player.height, 2, '#777');
                        if (player.vy > 2) SoundSys.playLand();
                    }
                }
            }

            if (player.y > canvas.height) loseLife();

            // Invincibility countdown
            if (invincibleTimer > 0) invincibleTimer -= dt;

            const rightmostPlatform = platforms[platforms.length - 1];
            const rightmostX = rightmostPlatform.x + rightmostPlatform.w;

            if (rightmostX < cameraX + canvas.width * 1.5) {
                const gap = 100 + Math.random() * 150;
                const w = 400 + Math.random() * 600;
                let lastY = rightmostPlatform.y;
                let newY = lastY + (Math.random() * 250 - 125);
                newY = Math.max(canvas.height * 0.4, Math.min(canvas.height - 150, newY));

                platforms.push(createPlatform(rightmostX + gap, newY, w));
            }

            if (platforms[0].x + platforms[0].w < cameraX - 200) {
                platforms.shift();
            }

            backgroundBuildings.forEach(b => {
                const parallaxSpeed = gameSpeed * (0.1 + b.layer * 0.1);
                b.x -= parallaxSpeed * dt;
            });

            if (backgroundBuildings.length > 0 && backgroundBuildings[0].x + backgroundBuildings[0].w < -100) {
                backgroundBuildings.shift();
            }

            const bgRightmost = backgroundBuildings[backgroundBuildings.length - 1].x + backgroundBuildings[backgroundBuildings.length - 1].w;
            if (bgRightmost < canvas.width + 100) {
                backgroundBuildings.push(createBackgroundElement(bgRightmost + 10 + Math.random() * 80, cameraX));
            }

            // Bird updates
            birds.forEach(bird => {
                bird.x -= bird.speed * dt;
                bird.wingPhase += 0.1 * dt;
                bird.bobPhase = (bird.bobPhase || 0) + 0.02 * dt;
                if (bird.x < -30) {
                    bird.x = canvas.width + 30 + Math.random() * 150;
                    bird.y = 15 + Math.random() * canvas.height * 0.15;
                }
            });

            // Night aircraft
            if (timeProgress > 0.25 && timeProgress < 0.8) {
                if (Math.random() > 0.998 && nightAircraft.length < 2) {
                    nightAircraft.push({
                        x: -80,
                        y: 20 + Math.random() * canvas.height * 0.2,
                        speed: 0.8 + Math.random() * 0.5,
                        size: 3 + Math.random() * 2,
                        blinkPhase: Math.random() * Math.PI * 2,
                        smokeTrail: [] // smoke particles
                    });
                }
            }
            for (let i = nightAircraft.length - 1; i >= 0; i--) {
                const ac = nightAircraft[i];
                ac.x += ac.speed * dt;
                ac.blinkPhase += 0.15 * dt;
                // Smoke trail
                if (ac.smokeTrail && Math.random() > 0.6) {
                    ac.smokeTrail.push({
                        x: ac.x - ac.size * 3.5,
                        y: ac.y + (Math.random() - 0.5) * 2,
                        life: 1.0,
                        r: 1.5 + Math.random() * 1.5
                    });
                }
                if (ac.smokeTrail) {
                    for (let s = ac.smokeTrail.length - 1; s >= 0; s--) {
                        ac.smokeTrail[s].life -= 0.015 * dt;
                        ac.smokeTrail[s].r += 0.04 * dt;
                        ac.smokeTrail[s].y -= 0.02 * dt;
                        if (ac.smokeTrail[s].life <= 0) ac.smokeTrail.splice(s, 1);
                    }
                }
                if (ac.x > canvas.width + 100) nightAircraft.splice(i, 1);
            }

            // Transition creature spawning (butterflies only)
            const biomeNow = getBiome(cameraX);
            if (biomeNow.type === 'transition') {
                if (Math.random() > 0.92) {
                    transitionCreatures.push({
                        x: canvas.width + 20,
                        y: 50 + Math.random() * canvas.height * 0.4,
                        vx: -(1.5 + Math.random() * 2),
                        vy: (Math.random() - 0.5) * 0.5,
                        type: 'butterfly',
                        phase: Math.random() * Math.PI * 2,
                        size: 4 + Math.random() * 5,
                        color: ['#c084fc', '#fb923c', '#38bdf8', '#fbbf24', '#f472b6'][Math.floor(Math.random() * 5)]
                    });
                }
            }
            // Update transition creatures
            for (let i = transitionCreatures.length - 1; i >= 0; i--) {
                const tc = transitionCreatures[i];
                tc.x += tc.vx * dt;
                tc.y += tc.vy * dt + Math.sin(tc.phase) * 0.3;
                tc.phase += 0.12 * dt;
                if (tc.x < -30) transitionCreatures.splice(i, 1);
            }

            // Biome transition flash effect
            if (biomeNow.type === 'transition') {
                if (biomeFlashAlpha < 0.15) biomeFlashAlpha += 0.003 * dt;
            } else {
                if (biomeFlashAlpha > 0) biomeFlashAlpha -= 0.005 * dt;
            }

            if (player.stamina < 100) {
                player.stamina += 0.15 * dt;
                updateStaminaUI();
            }

            score = Math.floor(cameraX / 10);
            scoreEl.innerText = score;

            updateParticles(dt);
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.04 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateStaminaUI() {
            staminaBar.style.width = player.stamina + '%';
        }

        // --- Rendering Helpers ---

        function interpolateColor(c1, c2, factor) {
            const r = Math.round(c1[0] + (c2[0] - c1[0]) * factor);
            const g = Math.round(c1[1] + (c2[1] - c1[1]) * factor);
            const b = Math.round(c1[2] + (c2[2] - c1[2]) * factor);
            return `rgb(${r},${g},${b})`;
        }

        function getSkyColor(progress) {
            const sunsetTop = [15, 23, 42];
            const sunsetMid = [153, 27, 27];
            const sunsetBot = [245, 158, 11];

            const nightTop = [2, 6, 23];
            const nightMid = [15, 23, 42];
            const nightBot = [30, 41, 59];

            const sunriseTop = [14, 165, 233];
            const sunriseMid = [236, 72, 153];
            const sunriseBot = [253, 186, 116];

            if (progress < 0.25) {
                const t = progress / 0.25;
                return {
                    top: interpolateColor(sunsetTop, nightTop, t),
                    mid: interpolateColor(sunsetMid, nightMid, t),
                    bot: interpolateColor(sunsetBot, nightBot, t),
                    alpha: 1 - t
                };
            } else if (progress < 0.75) {
                return {
                    top: `rgb(${nightTop.join(',')})`,
                    mid: `rgb(${nightMid.join(',')})`,
                    bot: `rgb(${nightBot.join(',')})`,
                    alpha: 0
                };
            } else {
                const t = (progress - 0.75) / 0.25;
                return {
                    top: interpolateColor(nightTop, sunriseTop, t),
                    mid: interpolateColor(nightMid, sunriseMid, t),
                    bot: interpolateColor(nightBot, sunriseBot, t),
                    alpha: t
                };
            }
        }

        function drawCharacter(x, y, w, h) {
            const centerX = x + w / 2;
            const centerY = y + h / 2;
            const runCycle = animTime * 1.5;
            const isJumping = !player.isGrounded;
            const bounce = isJumping ? 0 : Math.abs(Math.cos(runCycle)) * 2;
            const bodyY = y + bounce;
            ctx.save();

            // === Motion afterimage trail ===
            if (gameSpeed > SPEED_base + 2 || Math.abs(player.vx) > 2) {
                for (let g = 3; g >= 1; g--) {
                    ctx.globalAlpha = 0.07 * g;
                    const trailX = x - g * 8;
                    drawCharacterBody(trailX, bodyY, w, h, centerX - g * 8, runCycle, isJumping);
                }
                ctx.globalAlpha = 1.0;
            }

            // === Main character ===
            drawCharacterBody(x, bodyY, w, h, centerX, runCycle, isJumping);
            ctx.restore();
        }

        function drawCharacterBody(x, bodyY, w, h, centerX, runCycle, isJumping) {
            // Shadow under character if grounded
            if (!isJumping) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(centerX, bodyY + h - 5, 20 + Math.abs(Math.sin(runCycle)) * 8, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Scarf (behind)
            const scarfBaseX = centerX;
            const scarfBaseY = bodyY + 12;
            const flowX = -15 - (gameSpeed * 1.5) - (player.vx * 2);
            const flowY = -5 + (player.vy * 2) + Math.sin(animTime * 4) * 6;

            // Scarf glow
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.moveTo(scarfBaseX - 2, scarfBaseY);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.4, scarfBaseY + flowY - 8, scarfBaseX + flowX, scarfBaseY + flowY);
            ctx.lineTo(scarfBaseX + flowX + 3, scarfBaseY + flowY + 10);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.5, scarfBaseY + flowY + 6, scarfBaseX + 2, scarfBaseY + 4);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Second scarf tail
            ctx.fillStyle = '#be123c';
            ctx.beginPath();
            ctx.moveTo(scarfBaseX, scarfBaseY + 2);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.3, scarfBaseY + flowY + 5, scarfBaseX + flowX * 0.7, scarfBaseY + flowY + 12);
            ctx.lineTo(scarfBaseX + flowX * 0.7 + 2, scarfBaseY + flowY + 18);
            ctx.quadraticCurveTo(scarfBaseX + flowX * 0.2, scarfBaseY + flowY + 10, scarfBaseX + 2, scarfBaseY + 6);
            ctx.fill();

            // Back leg
            const lLegAngle = isJumping ? 0.5 : Math.sin(runCycle + Math.PI) * 0.8;
            drawLimb(centerX, bodyY + h / 2 - 10, lLegAngle, '#475569', 6, 15, 15);
            // Back shoe
            drawShoe(centerX, bodyY + h / 2 - 10, lLegAngle, 15, 15, '#1e293b');

            // Back arm
            const lArmAngle = isJumping ? -0.5 : Math.sin(runCycle) * 0.8;
            drawLimb(centerX, bodyY + 15, lArmAngle, '#475569', 5, 13, 11);

            // Backpack ( cyberpunk style )
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(centerX - w / 2 - 6, bodyY + 12, 8, 20, 3);
            ctx.fill();
            // Backpack glow
            ctx.fillStyle = '#0ea5e9';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 5;
            ctx.fillRect(centerX - w / 2 - 8, bodyY + 16, 3, 8);
            ctx.shadowBlur = 0;

            // Hoodie / Body Base
            const bodyGrad = ctx.createLinearGradient(centerX - w / 2, bodyY, centerX + w / 2, bodyY + h * 0.4);
            bodyGrad.addColorStop(0, '#f1f5f9');
            bodyGrad.addColorStop(1, '#94a3b8');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(centerX - w / 2 + 2, bodyY + 10, w - 2, h * 0.38, 5);
            ctx.fill();

            // Jacket design lines
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX - 4, bodyY + 10);
            ctx.lineTo(centerX - 8, bodyY + 30);
            ctx.stroke();

            // Hoodie hood (behind head)
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(centerX, bodyY + 8, 12, Math.PI, 0);
            ctx.fill();

            // Hoodie drawstrings
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(centerX + 6, bodyY + 16);
            ctx.quadraticCurveTo(centerX + 8, bodyY + 22, centerX + 6 + Math.sin(animTime * 5) * 2, bodyY + 26);
            ctx.stroke();

            // Belt
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(centerX - w / 2 + 3, bodyY + 10 + h * 0.35, w - 4, h * 0.12, 2);
            ctx.fill();

            // Belt pouches
            ctx.fillStyle = '#334155';
            ctx.fillRect(centerX - 10, bodyY + 12 + h * 0.35, 6, 8);
            ctx.fillRect(centerX + 4, bodyY + 12 + h * 0.35, 8, 8);

            // Tech emblem glow
            ctx.fillStyle = '#0ea5e9';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(centerX + 2, bodyY + 22, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX + 2, bodyY + 22, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Head
            ctx.fillStyle = '#fed7aa'; // Natural skin tone
            ctx.beginPath();
            ctx.arc(centerX, bodyY + 4, 9, 0, Math.PI * 2);
            ctx.fill();

            // Hair spikes
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(centerX - 8, bodyY + 1);
            ctx.lineTo(centerX - 4, bodyY - 8);
            ctx.lineTo(centerX, bodyY - 1);
            ctx.lineTo(centerX + 3, bodyY - 9);
            ctx.lineTo(centerX + 6, bodyY - 3);
            ctx.lineTo(centerX + 9, bodyY - 6);
            ctx.lineTo(centerX + 10, bodyY + 2);
            ctx.closePath();
            ctx.fill();

            // Eye (white)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(centerX + 4, bodyY + 4, 3.5, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Pupil
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(centerX + 5.5, bodyY + 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Eye highlight
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX + 5, bodyY + 3.2, 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Visor (cyberpunk goggles on forehead)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(centerX - 2, bodyY - 3, 10, 5, 2);
            ctx.fill();
            ctx.fillStyle = '#0ea5e9';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 8;
            ctx.fillRect(centerX + 1, bodyY - 2, 6, 2);
            ctx.shadowBlur = 0;

            // Front leg
            const rLegAngle = isJumping ? -0.8 : Math.sin(runCycle) * 0.8;
            drawLimb(centerX, bodyY + h / 2 - 10, rLegAngle, '#94a3b8', 6, 15, 15);
            // Front shoe
            drawShoe(centerX, bodyY + h / 2 - 10, rLegAngle, 15, 15, '#0f172a');

            // Front arm
            const rArmAngle = isJumping ? -2.5 : Math.sin(runCycle + Math.PI) * 0.8;
            drawLimb(centerX, bodyY + 15, rArmAngle, '#94a3b8', 5, 13, 11);
        }

        function drawShoe(baseX, baseY, angle, len1, len2, color) {
            ctx.save();
            ctx.translate(baseX, baseY);
            ctx.rotate(angle);
            ctx.translate(0, len1);
            const jointBend = Math.max(0.1, angle * 1.5 + 0.5);
            ctx.rotate(jointBend);
            ctx.translate(0, len2);

            // High-top Sneaker shape
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-5, -4, 12, 8, 3);
            ctx.fill();

            // Sneaker accents
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(1, -2, 4, 3);

            // Sole
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.roundRect(-4, 3, 11, 2.5, 1);
            ctx.fill();

            ctx.restore();
        }

        function drawLimb(x, y, angle, color, width, len1, len2) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Upper limb
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, len1);
            ctx.stroke();

            // Joint
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(0, len1, width * 0.4, 0, Math.PI * 2);
            ctx.fill();

            const jointBend = Math.max(0.1, angle * 1.5 + 0.5);
            ctx.translate(0, len1);
            ctx.rotate(jointBend);

            // Lower limb
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, len2);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            const sky = getSkyColor(timeProgress);
            const biome = getBiome(cameraX);

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, sky.top);
            gradient.addColorStop(0.5, sky.mid);
            gradient.addColorStop(1, sky.bot);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun
            if (timeProgress < 0.35 || timeProgress > 0.65) {
                let sunProgress = timeProgress < 0.35 ? timeProgress : 1.0 - (timeProgress - 0.65) * 1.5;
                let sunAlpha = Math.max(0, 1 - sunProgress * 2.5);
                const sunY = canvas.height * 0.3 + (sunProgress * canvas.height * 1.5);
                const sunX = timeProgress < 0.35 ? canvas.width * 0.8 : canvas.width * 0.2 + (timeProgress - 0.65) * canvas.width * 0.5;

                ctx.save();
                ctx.fillStyle = `rgba(255, 120, 50, ${sunAlpha * 0.15})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Outer huge glow
                const megaGlow = ctx.createRadialGradient(sunX, sunY, 100, sunX, sunY, 600);
                megaGlow.addColorStop(0, `rgba(255, 100, 50, ${sunAlpha * 0.2})`);
                megaGlow.addColorStop(1, `rgba(255, 50, 0, 0)`);
                ctx.fillStyle = megaGlow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 600, 0, Math.PI * 2);
                ctx.fill();

                // Inner glow
                const glow = ctx.createRadialGradient(sunX, sunY, 40, sunX, sunY, 200);
                glow.addColorStop(0, `rgba(255, 230, 150, ${sunAlpha * 0.6})`);
                glow.addColorStop(1, `rgba(255, 100, 50, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 200, 0, Math.PI * 2);
                ctx.fill();

                // Core
                const sun = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 80);
                sun.addColorStop(0, `rgba(255, 255, 255, ${sunAlpha})`);
                sun.addColorStop(0.4, `rgba(255, 240, 150, ${sunAlpha})`);
                sun.addColorStop(1, `rgba(255, 150, 0, 0)`);
                ctx.fillStyle = sun;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Moon
            if (timeProgress > 0.15 && timeProgress < 0.85) {
                const moonP = (timeProgress - 0.15) / 0.7; // 0 to 1 over the night
                const moonY = canvas.height * 0.15 + Math.abs(0.5 - moonP) * canvas.height * 0.3;

                // Moon starts on the left (0.2) and moves to the right (0.8)
                const moonX = canvas.width * 0.2 + (moonP * canvas.width * 0.6);

                // Moon glow
                const mGlow = ctx.createRadialGradient(moonX, moonY, 35, moonX, moonY, 200);
                mGlow.addColorStop(0, 'rgba(200, 220, 255, 0.4)');
                mGlow.addColorStop(1, 'rgba(200, 220, 255, 0)');
                ctx.fillStyle = mGlow;
                ctx.beginPath();
                ctx.arc(moonX, moonY, 200, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(240, 248, 255, 0.95)';
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(moonX, moonY, 35, 0, Math.PI * 2);
                ctx.fill();

                // Moon craters
                ctx.fillStyle = 'rgba(148, 163, 184, 0.3)';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(moonX - 10, moonY - 10, 8, 0, Math.PI * 2);
                ctx.arc(moonX + 12, moonY + 5, 5, 0, Math.PI * 2);
                ctx.arc(moonX - 5, moonY + 15, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Stars
            if (timeProgress > 0.2 && timeProgress < 0.8) {
                const starOpacity = timeProgress > 0.3 && timeProgress < 0.7 ? 1 : (timeProgress <= 0.3 ? (timeProgress - 0.2) / 0.1 : (0.8 - timeProgress) / 0.1);
                ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity})`;
                stars.forEach(s => {
                    const twinkle = 0.5 + Math.sin(animTime * 5 + s.x) * 0.5;
                    ctx.globalAlpha = (s.alpha * starOpacity) * (0.5 + twinkle * 0.5);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * (1 + twinkle * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                });

                // Occasional shooting star
                if (Math.random() > 0.99) {
                    const sx = Math.random() * canvas.width;
                    const sy = Math.random() * canvas.height * 0.4;
                    const len = 30 + Math.random() * 80;
                    ctx.globalAlpha = starOpacity;
                    const sgrad = ctx.createLinearGradient(sx, sy, sx - len, sy + len * 0.5);
                    sgrad.addColorStop(0, `rgba(255,255,255,1)`);
                    sgrad.addColorStop(1, `rgba(255,255,255,0)`);
                    ctx.strokeStyle = sgrad;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx - len, sy + len * 0.5);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
            }

            // === MOUNTAINS / HILLS ===
            if (mountainPoints.length > 1) {
                const mtBaseY = canvas.height * 0.55;
                // City = blue-gray mountains, jungle = green rolling hills
                const mtR = Math.round(30 + biome.blend * 10);
                const mtG = Math.round(41 + biome.blend * 60);
                const mtB = Math.round(59 - biome.blend * 20);
                ctx.fillStyle = `rgba(${mtR},${mtG},${mtB}, 0.25)`;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                mountainPoints.forEach((mp, i) => {
                    const hillH = mp.h * (biome.blend > 0.5 ? 0.7 : 1.0);
                    if (i === 0) ctx.lineTo(mp.x, mtBaseY - hillH);
                    else {
                        const prev = mountainPoints[i - 1];
                        const cpx = (prev.x + mp.x) / 2;
                        ctx.quadraticCurveTo(cpx, mtBaseY - (prev.h + hillH) / 2 - 10, mp.x, mtBaseY - hillH);
                    }
                });
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            }

            // === ATMOSPHERIC FOG ===
            const fogY = canvas.height * 0.5;
            const fogGrad = ctx.createLinearGradient(0, fogY - 30, 0, fogY + 50);
            const fogR = Math.round(15 + biome.blend * 10);
            const fogG = Math.round(23 + biome.blend * 30);
            const fogB = Math.round(42 - biome.blend * 10);
            fogGrad.addColorStop(0, `rgba(${fogR},${fogG},${fogB}, 0)`);
            fogGrad.addColorStop(0.5, `rgba(${fogR},${fogG},${fogB}, 0.15)`);
            fogGrad.addColorStop(1, `rgba(${fogR},${fogG},${fogB}, 0)`);
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, fogY - 30, canvas.width, 80);

            // === FLYING BIRDS (proper silhouettes) ===
            birds.forEach(bird => {
                const wing = Math.sin(bird.wingPhase) * 0.6;
                const bob = Math.sin(bird.bobPhase || 0) * 1.5;
                const bx = bird.x;
                const by = bird.y + bob;
                const s = bird.size;
                ctx.fillStyle = `rgba(20, 20, 30, 0.5)`;
                ctx.beginPath();
                // Body
                ctx.ellipse(bx, by, s * 0.8, s * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
                // Left wing
                ctx.beginPath();
                ctx.moveTo(bx - s * 0.2, by);
                ctx.quadraticCurveTo(bx - s * 1.2, by - s * wing * 1.2, bx - s * 1.5, by - s * wing);
                ctx.quadraticCurveTo(bx - s * 0.8, by - s * 0.1, bx - s * 0.2, by);
                ctx.fill();
                // Right wing
                ctx.beginPath();
                ctx.moveTo(bx + s * 0.2, by);
                ctx.quadraticCurveTo(bx + s * 1.2, by - s * wing * 1.2, bx + s * 1.5, by - s * wing);
                ctx.quadraticCurveTo(bx + s * 0.8, by - s * 0.1, bx + s * 0.2, by);
                ctx.fill();
                // Tail
                ctx.beginPath();
                ctx.moveTo(bx - s * 0.6, by);
                ctx.lineTo(bx - s * 1.0, by + s * 0.15);
                ctx.lineTo(bx - s * 1.0, by - s * 0.1);
                ctx.closePath();
                ctx.fill();
            });

            // === NIGHT AIRCRAFT (improved design + smoke) ===
            if (timeProgress > 0.25 && timeProgress < 0.8) {
                nightAircraft.forEach(ac => {
                    const ax = ac.x;
                    const ay = ac.y;
                    const sz = ac.size;

                    // Smoke trail behind aircraft
                    if (ac.smokeTrail) {
                        ac.smokeTrail.forEach(sp => {
                            ctx.fillStyle = `rgba(180, 190, 200, ${sp.life * 0.25})`;
                            ctx.beginPath();
                            ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }

                    // Fuselage (elongated, sleek)
                    ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(ax + sz * 4, ay);
                    ctx.quadraticCurveTo(ax + sz * 3, ay - sz * 0.5, ax - sz * 3.5, ay - sz * 0.15);
                    ctx.quadraticCurveTo(ax - sz * 3.5, ay + sz * 0.15, ax + sz * 4, ay);
                    ctx.fill();

                    // Main swept wings
                    ctx.fillStyle = 'rgba(100, 116, 139, 0.45)';
                    ctx.beginPath();
                    ctx.moveTo(ax + sz * 0.5, ay);
                    ctx.lineTo(ax - sz * 0.5, ay - sz * 2.5);
                    ctx.lineTo(ax - sz * 1.5, ay - sz * 2.2);
                    ctx.lineTo(ax - sz * 0.5, ay);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ax + sz * 0.5, ay);
                    ctx.lineTo(ax - sz * 0.5, ay + sz * 2.5);
                    ctx.lineTo(ax - sz * 1.5, ay + sz * 2.2);
                    ctx.lineTo(ax - sz * 0.5, ay);
                    ctx.closePath();
                    ctx.fill();

                    // Horizontal stabilizers (small rear wings)
                    ctx.fillStyle = 'rgba(100, 116, 139, 0.4)';
                    ctx.beginPath();
                    ctx.moveTo(ax - sz * 2.5, ay);
                    ctx.lineTo(ax - sz * 3, ay - sz * 1);
                    ctx.lineTo(ax - sz * 3.5, ay - sz * 0.8);
                    ctx.lineTo(ax - sz * 3, ay);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ax - sz * 2.5, ay);
                    ctx.lineTo(ax - sz * 3, ay + sz * 1);
                    ctx.lineTo(ax - sz * 3.5, ay + sz * 0.8);
                    ctx.lineTo(ax - sz * 3, ay);
                    ctx.closePath();
                    ctx.fill();

                    // Vertical tail fin
                    ctx.fillStyle = 'rgba(120, 130, 150, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(ax - sz * 2.8, ay);
                    ctx.lineTo(ax - sz * 3.5, ay - sz * 1.2);
                    ctx.lineTo(ax - sz * 3.2, ay - sz * 1.3);
                    ctx.lineTo(ax - sz * 2.2, ay);
                    ctx.closePath();
                    ctx.fill();

                    // Engine nacelles under wings
                    ctx.fillStyle = 'rgba(80, 90, 100, 0.5)';
                    ctx.beginPath();
                    ctx.ellipse(ax, ay - sz * 1.2, sz * 0.7, sz * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(ax, ay + sz * 1.2, sz * 0.7, sz * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Cockpit window
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.beginPath();
                    ctx.ellipse(ax + sz * 3, ay, sz * 0.6, sz * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Blinking nav light (nose)
                    const blinkOn = Math.sin(ac.blinkPhase) > 0;
                    if (blinkOn) {
                        ctx.fillStyle = '#ef4444';
                        ctx.shadowColor = '#ef4444';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(ax + sz * 4, ay, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    // Steady white tail light
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(ax - sz * 3.5, ay, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Wing tip lights (green starboard, red port)
                    ctx.fillStyle = '#22c55e';
                    ctx.shadowColor = '#22c55e';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(ax - sz * 0.5, ay - sz * 2.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(ax - sz * 0.5, ay + sz * 2.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }

            // Clouds (Weather) - Natural cloud shape
            weather.clouds.forEach(c => {
                const stormDarkness = weather.intensity * 100;
                const baseR = Math.max(0, 255 - stormDarkness);
                const cx = c.x + c.w / 2;
                const cy = c.y + c.h / 2;
                if (c.puffs) {
                    // Draw all puffs as a single merged shape
                    ctx.fillStyle = `rgba(${baseR}, ${baseR}, ${Math.min(255, baseR + 10)}, 0.25)`;
                    ctx.beginPath();
                    c.puffs.forEach(pf => {
                        ctx.moveTo(cx + pf.xOff + pf.r, cy + pf.yOff);
                        ctx.arc(cx + pf.xOff, cy + pf.yOff, pf.r, 0, Math.PI * 2);
                    });
                    ctx.fill();
                    // Subtle flat bottom shadow
                    ctx.fillStyle = `rgba(${Math.max(0, baseR - 60)}, ${Math.max(0, baseR - 70)}, ${Math.max(0, baseR - 50)}, 0.08)`;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + c.h * 0.2, c.w * 0.4, c.h * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = `rgba(${baseR}, ${baseR}, ${baseR}, 0.25)`;
                    ctx.beginPath();
                    ctx.roundRect(c.x, c.y, c.w, c.h, 20);
                    ctx.fill();
                }
            });

            // === TRANSITION CREATURES (butterflies only) ===
            transitionCreatures.forEach(tc => {
                ctx.save();
                ctx.translate(tc.x, tc.y);
                const wingAngle = Math.sin(tc.phase * 3) * 0.7;
                ctx.fillStyle = tc.color;
                // Left wing
                ctx.save();
                ctx.rotate(-wingAngle);
                ctx.beginPath();
                ctx.ellipse(-tc.size * 0.6, 0, tc.size, tc.size * 0.6, -0.3, 0, Math.PI * 2);
                ctx.globalAlpha = 0.7;
                ctx.fill();
                ctx.restore();
                // Right wing
                ctx.save();
                ctx.rotate(wingAngle);
                ctx.beginPath();
                ctx.ellipse(tc.size * 0.6, 0, tc.size, tc.size * 0.6, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                // Body
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.ellipse(0, 0, 1.5, tc.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                // Antennae
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(0, -tc.size * 0.4);
                ctx.quadraticCurveTo(-3, -tc.size, -4, -tc.size * 1.1);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -tc.size * 0.4);
                ctx.quadraticCurveTo(3, -tc.size, 4, -tc.size * 1.1);
                ctx.stroke();
                ctx.restore();
            });

            // === BIOME TRANSITION EFFECT ===
            if (biomeFlashAlpha > 0.001) {
                const biomeNowDraw = getBiome(cameraX);
                const flashR = biomeNowDraw.blend > 0.5 ? 34 : 100;
                const flashG = biomeNowDraw.blend > 0.5 ? 139 : 116;
                const flashB = biomeNowDraw.blend > 0.5 ? 34 : 139;
                ctx.fillStyle = `rgba(${flashR}, ${flashG}, ${flashB}, ${biomeFlashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // === BACKGROUND ELEMENTS (Buildings + Trees) ===
            backgroundBuildings.forEach(b => {
                if (b.elementType === 'tree') {
                    drawTree(b);
                } else {
                    drawBuilding(b);
                }
            });

            ctx.save();
            ctx.translate(-cameraX, 0);

            // === PLATFORMS (Biome-specific) ===
            platforms.forEach(p => {
                const pBiome = getBiome(p.x);
                if (pBiome.blend > 0.5) {
                    // JUNGLE: wooden planks
                    const woodGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + Math.min(35, p.h));
                    woodGrad.addColorStop(0, '#6d4c2e');
                    woodGrad.addColorStop(0.5, '#5c3d2e');
                    woodGrad.addColorStop(1, '#4a3020');
                    ctx.fillStyle = woodGrad;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    // Plank lines (deterministic)
                    ctx.strokeStyle = '#4a3020';
                    ctx.lineWidth = 1;
                    for (let lx = 0; lx < p.w; lx += 35 + Math.sin(lx) * 10) {
                        ctx.beginPath();
                        ctx.moveTo(p.x + lx, p.y);
                        ctx.lineTo(p.x + lx, p.y + Math.min(30, p.h));
                        ctx.stroke();
                    }
                    // Mossy top edge
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(p.x, p.y, p.w, 3);
                    // Moss tufts (pre-seeded, no glitch)
                    ctx.fillStyle = '#22c55e';
                    if (p.mossTufts) {
                        p.mossTufts.forEach(mt => {
                            ctx.beginPath();
                            ctx.arc(p.x + mt.x, p.y, mt.h, Math.PI, 0);
                            ctx.fill();
                        });
                    }
                    // Vines hanging below (pre-seeded)
                    ctx.strokeStyle = '#16a34a';
                    ctx.lineWidth = 1.5;
                    if (p.vinePositions) {
                        p.vinePositions.forEach(vp => {
                            ctx.beginPath();
                            ctx.moveTo(p.x + vp.x, p.y + 4);
                            ctx.quadraticCurveTo(p.x + vp.x + vp.cx, p.y + vp.len * 0.6, p.x + vp.x + vp.cy, p.y + vp.len);
                            ctx.stroke();
                        });
                    }
                } else {
                    // CITY: concrete rooftops
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y, p.w, 4);
                    ctx.fillStyle = '#334155';
                    for (let lx = 50; lx < p.w; lx += 100) {
                        ctx.fillRect(p.x + lx, p.y + 10, 3, Math.min(p.h - 20, 40));
                    }
                    ctx.fillStyle = '#64748b';
                    for (let rx = 0; rx < p.w; rx += 40) {
                        ctx.fillRect(p.x + rx, p.y - 8, 2, 8);
                    }
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y - 8, p.w, 1.5);
                    if (p.w > 200) {
                        ctx.fillStyle = '#334155';
                        ctx.fillRect(p.x + 30, p.y + 6, 8, 12);
                        ctx.fillRect(p.x + p.w - 50, p.y + 6, 10, 8);
                    }
                }
            });

            // Invincibility flash on character
            if (invincibleTimer > 0 && Math.sin(animTime * 20) > 0) {
                ctx.globalAlpha = 0.4;
            }
            drawCharacter(player.x, player.y, player.width, player.height);
            ctx.globalAlpha = 1.0;

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // Rain (Foreground) - Enhanced with variable thickness and mist
            if (weather.intensity > 0) {
                // Main rain streaks
