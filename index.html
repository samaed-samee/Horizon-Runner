<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horizon Runner: Urban Parkour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* Cinematic UI */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: skewX(-5deg);
            pointer-events: auto;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pause-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.75rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            pointer-events: auto;
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        .pause-btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: white;
            color: black;
            padding: 1rem 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .key-hint {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.7rem;
            margin: 0 0.2rem;
        }

        /* ── Enhanced Home Screen ── */
        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 15px 2px var(--glow-color), inset 0 0 15px rgba(255, 255, 255, 0.03);
            }

            50% {
                box-shadow: 0 0 30px 8px var(--glow-color), inset 0 0 20px rgba(255, 255, 255, 0.08);
            }
        }

        @keyframes btnShimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 200%;
            }
        }

        @keyframes floatY {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .start-screen-enhanced {
            background: radial-gradient(ellipse at 50% 30%, rgba(15, 23, 42, 0.8) 0%, rgba(0, 0, 0, 0.95) 70%);
            backdrop-filter: blur(10px);
        }

        .title-main {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #22d3ee, #a855f7, #ec4899, #22d3ee);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite, fadeSlideDown 0.8s ease-out both;
            filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.4)) drop-shadow(0 0 60px rgba(34, 211, 238, 0.2));
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeSlideDown 0.8s ease-out 0.15s both;
            margin-bottom: 1.75rem;
        }

        .subtitle-row .line {
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.5), transparent);
        }

        .subtitle-row .label {
            color: rgba(203, 213, 225, 0.8);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        .choose-label {
            color: rgba(148, 163, 184, 0.6);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 600;
            margin-bottom: 0.75rem;
            animation: fadeSlideUp 0.6s ease-out 0.3s both;
        }

        .char-select {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .char-card {
            --glow-color: rgba(100, 116, 139, 0.3);
            width: 140px;
            height: 190px;
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(100, 116, 139, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            opacity: 0.5;
            padding-top: 0.5rem;
        }

        .char-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            background: radial-gradient(ellipse at 50% 90%, var(--glow-color), transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .char-card:hover {
            transform: translateY(-6px) scale(1.04);
            opacity: 0.8;
            border-color: rgba(148, 163, 184, 0.3);
        }

        .char-card:hover::before {
            opacity: 0.5;
        }

        .char-card.selected {
            opacity: 1;
            border-color: transparent;
            animation: pulseGlow 2.5s ease-in-out infinite;
            transform: translateY(-4px);
        }

        .char-card.selected::before {
            opacity: 1;
        }

        .char-card.card-default {
            --glow-color: rgba(34, 211, 238, 0.3);
        }

        .char-card.card-default.selected {
            --glow-color: rgba(34, 211, 238, 0.45);
            border-color: #22d3ee;
        }

        .char-card.card-batman {
            --glow-color: rgba(234, 179, 8, 0.3);
        }

        .char-card.card-batman.selected {
            --glow-color: rgba(234, 179, 8, 0.45);
            border-color: #eab308;
        }

        .char-card.card-superman {
            --glow-color: rgba(239, 68, 68, 0.3);
        }

        .char-card.card-superman.selected {
            --glow-color: rgba(239, 68, 68, 0.45);
            border-color: #ef4444;
        }

        .char-card:nth-child(1) {
            animation: fadeSlideUp 0.6s ease-out 0.35s both;
        }

        .char-card:nth-child(2) {
            animation: fadeSlideUp 0.6s ease-out 0.5s both;
        }

        .char-card:nth-child(3) {
            animation: fadeSlideUp 0.6s ease-out 0.65s both;
        }

        .char-card.selected {
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        .char-preview {
            width: 80px;
            height: 110px;
            image-rendering: auto;
            position: relative;
            z-index: 1;
            animation: floatY 3s ease-in-out infinite;
        }

        .char-card:nth-child(2) .char-preview {
            animation-delay: 0.4s;
        }

        .char-card:nth-child(3) .char-preview {
            animation-delay: 0.8s;
        }

        .char-name {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(226, 232, 240, 0.85);
            position: relative;
            z-index: 1;
        }

        .char-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: white;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .char-card.selected .char-badge {
            opacity: 1;
            transform: scale(1);
        }

        .btn-start-enhanced {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
            background-size: 200% 200%;
            color: white;
            padding: 1rem 3.5rem;
            font-weight: 800;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 4px 25px rgba(139, 92, 246, 0.4), 0 0 60px rgba(139, 92, 246, 0.15);
            animation: fadeSlideUp 0.6s ease-out 0.8s both;
        }

        .btn-start-enhanced::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: btnShimmer 3s ease-in-out infinite 1.5s;
        }

        .btn-start-enhanced:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 35px rgba(139, 92, 246, 0.6), 0 0 80px rgba(139, 92, 246, 0.25);
            background-position: 100% 0;
        }

        .btn-start-enhanced:active {
            transform: scale(0.97);
        }

        .key-hints {
            animation: fadeSlideUp 0.5s ease-out 1s both;
        }

        /* Make start screen scrollable as a safety net */
        .start-screen-enhanced {
            overflow-y: auto;
            overflow-x: hidden;
        }

        @media (max-width: 640px) {
            .char-select {
                gap: 0.75rem;
            }

            .char-card {
                width: 105px;
                height: 150px;
                border-radius: 0.75rem;
            }

            .char-preview {
                width: 60px;
                height: 85px;
            }

            .char-name {
                font-size: 0.65rem;
            }

            .btn-start-enhanced {
                padding: 0.8rem 2.5rem;
                font-size: 0.95rem;
            }
        }

        /* Landscape mobile — very short viewport height */
        @media (max-height: 500px) {
            .title-main {
                font-size: clamp(1.8rem, 6vw, 2.8rem);
                margin-bottom: 0.2rem;
            }

            .subtitle-row {
                margin-bottom: 0.5rem;
                gap: 0.5rem;
            }

            .subtitle-row .label {
                font-size: 0.6rem;
            }

            .choose-label {
                margin-bottom: 0.35rem;
                font-size: 0.55rem;
            }

            .char-select {
                gap: 0.6rem;
                margin-bottom: 0.75rem;
            }

            .char-card {
                width: 95px;
                height: 120px;
                border-radius: 0.6rem;
                padding-top: 0.25rem;
                gap: 0.2rem;
            }

            .char-preview {
                width: 55px;
                height: 72px;
            }

            .char-name {
                font-size: 0.6rem;
            }

            .char-badge {
                width: 16px;
                height: 16px;
                font-size: 0.5rem;
                top: 4px;
                right: 4px;
            }

            .btn-start-enhanced {
                padding: 0.6rem 2rem;
                font-size: 0.85rem;
                letter-spacing: 0.15em;
            }

            .key-hints {
                margin-top: 0.5rem !important;
            }
        }

        /* Very compact screens (small phones in landscape) */
        @media (max-height: 380px) {
            .title-main {
                font-size: 1.5rem;
            }

            .subtitle-row {
                margin-bottom: 0.3rem;
            }

            .choose-label {
                margin-bottom: 0.25rem;
            }

            .char-select {
                margin-bottom: 0.5rem;
            }

            .char-card {
                width: 85px;
                height: 105px;
            }

            .char-preview {
                width: 48px;
                height: 65px;
            }

            .btn-start-enhanced {
                padding: 0.5rem 1.5rem;
                font-size: 0.8rem;
            }
        }

        /* ── Mobile Touch Controls ── */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1rem 1.5rem 1.5rem;
            justify-content: space-between;
            z-index: 40;
            pointer-events: none;
        }

        .touch-btn {
            pointer-events: auto;
            width: clamp(80px, 22vw, 130px);
            height: clamp(60px, 14vh, 90px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: clamp(0.6rem, 2.5vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.93);
        }

        .touch-btn .icon {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
        }

        /* Portrait Warning */
        .portrait-warning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: 'Inter', sans-serif;
        }

        .portrait-warning .rotate-icon {
            font-size: 3rem;
            animation: rotateHint 2s ease-in-out infinite;
        }

        @keyframes rotateHint {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        /* ── Responsive: show touch controls on touch devices ── */
        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: flex;
            }

            .key-hint-row {
                display: none !important;
            }
        }

        /* ── Responsive: small screens ── */
        @media (max-width: 640px) {
            .ui-layer {
                padding: 0.75rem;
            }

            .hud-panel {
                padding: 0.5rem 0.75rem;
                border-radius: 0.6rem;
                transform: skewX(-3deg);
            }
        }

        /* ── Portrait orientation on mobile ── */
        @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
            .portrait-warning {
                display: flex;
            }

            #game-container {
                filter: blur(6px);
            }
        }
    </style>
</head>

<body>

    <div id="game-container">

        <!-- HUD -->
        <div class="ui-layer">
            <div class="flex justify-between w-full items-start">
                <div class="flex items-start gap-2">
                    <div class="hud-panel">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Distance</div>
                        <div class="text-3xl font-black tabular-nums tracking-tighter"><span id="score-el">0</span><span
                                class="text-sm text-slate-500 ml-1">m</span></div>
                    </div>
                    <div class="hud-panel" id="lives-panel">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Lives</div>
                        <div id="hearts-el" class="text-2xl mt-0.5" style="transform: skewX(5deg);">❤️❤️❤️</div>
                    </div>
                </div>
                <div class="flex items-start gap-2">
                    <div class="hud-panel text-right">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Stamina</div>
                        <div class="w-32 h-2 bg-slate-700 rounded-full mt-2 overflow-hidden">
                            <div id="stamina-bar" class="h-full bg-emerald-400 w-full"></div>
                        </div>
                    </div>
                    <button id="pause-btn" class="pause-btn" title="Pause (P)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <rect x="6" y="4" width="4" height="16" rx="1" />
                            <rect x="14" y="4" width="4" height="16" rx="1" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Controls Hint (desktop-only keyboard hints) -->
            <div
                class="key-hint-row text-center text-slate-500 text-xs font-medium uppercase tracking-widest opacity-50 md:hidden">
                Tap Left to Jump • Tap Right to Dash
            </div>
        </div>

        <!-- Mobile On-Screen Touch Buttons -->
        <div class="touch-controls" id="touch-controls">
            <button class="touch-btn" id="touch-jump">
                <span class="icon">⬆</span>
                JUMP
            </button>
            <button class="touch-btn" id="touch-dash">
                <span class="icon">⚡</span>
                DASH
            </button>
        </div>

        <!-- Portrait Rotation Warning -->
        <div class="portrait-warning" id="portrait-warning">
            <div class="rotate-icon">📱</div>
            <div class="text-lg font-bold uppercase tracking-widest">Rotate Your Device</div>
            <div class="text-sm text-slate-400">This game is best played in landscape mode</div>
        </div>

        <div id="start-screen" class="overlay start-screen-enhanced flex flex-col items-center justify-center p-4">
            <h1 class="title-main">Horizon Runner</h1>
            <div class="subtitle-row">
                <span class="line"></span>
                <span class="label">Urban Parkour</span>
                <span class="line"></span>
            </div>

            <div class="choose-label">Choose Your Runner</div>

            <div class="char-select">
                <div class="char-card card-default selected" id="card-default" data-skin="default">
                    <canvas class="char-preview" id="preview-default" width="80" height="110"></canvas>
                    <div class="char-name">Office</div>
                    <div class="char-badge">✓</div>
                </div>
                <div class="char-card card-batman" id="card-batman" data-skin="batman">
                    <canvas class="char-preview" id="preview-batman" width="80" height="110"></canvas>
                    <div class="char-name">Batman</div>
                    <div class="char-badge">✓</div>
                </div>
                <div class="char-card card-superman" id="card-superman" data-skin="superman">
                    <canvas class="char-preview" id="preview-superman" width="80" height="110"></canvas>
                    <div class="char-name">Superman</div>
                    <div class="char-badge">✓</div>
                </div>
            </div>

            <button id="start-btn" class="btn-start-enhanced">Start Run</button>

            <div
                class="key-hint-row key-hints mt-6 sm:mt-8 text-slate-400 text-xs uppercase tracking-widest font-medium flex gap-6">
                <span><span class="key-hint">SPACE</span> Jump</span>
                <span><span class="key-hint">SHIFT</span> Dash</span>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="text-3xl sm:text-5xl font-black text-white mb-4 uppercase tracking-tight">Critical Failure</h2>
            <div class="text-center mb-6 sm:mb-10">
                <div class="text-xs text-slate-400 uppercase tracking-widest mb-1">Total Distance</div>
                <div class="text-4xl sm:text-6xl font-black text-white"><span id="final-score">0</span>m</div>
            </div>
            <button id="restart-btn" class="btn-start">
                Retry
            </button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreEl = document.getElementById('score-el');
        const finalScoreEl = document.getElementById('final-score');
        const staminaBar = document.getElementById('stamina-bar');

        // Game Constants
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const SPEED_base = 6;
        const DASH_SPEED = 10;
        const DAY_CYCLE_LENGTH = 100000;

        // Game State
        let gameState = 'MENU';
        let score = 0;
        let cameraX = 0;
        let gameSpeed = SPEED_base;
        let animTime = 0;
        let timeProgress = 0;
        let lastStepTime = 0;
        let frameCount = 0;
        let lastTime = 0;
        let lives = 3;
        let invincibleTimer = 0; // brief invincibility after losing a life
        let transitionCreatures = []; // butterflies/parrots during transition
        let biomeFlashAlpha = 0; // transition flash effect

        // Player
        const player = {
            x: 100,
            y: 0,
            width: 25,
            height: 70,
            vx: 0,
            vy: 0,
            isGrounded: false,
            stamina: 100,
            color: '#fff',
            trail: []
        };

        // World
        let platforms = [];
        let particles = [];
        let backgroundBuildings = [];
        let stars = [];
        let birds = [];
        let mountainPoints = [];
        let nightAircraft = []; // planes flying at night

        // Biome System (city → jungle, looping)
        const BIOME_CYCLE = 40000; // pixels per full biome cycle (~4000m score)
        function getBiome(distance) {
            const pos = ((distance % BIOME_CYCLE) + BIOME_CYCLE) % BIOME_CYCLE;
            if (pos < 15000) return { type: 'city', blend: 0 };      // 0-1500m
            if (pos < 20000) return { type: 'transition', blend: (pos - 15000) / 5000 }; // 1500-2000m
            if (pos < 30000) return { type: 'jungle', blend: 1 };    // 2000-3000m
            return { type: 'transition', blend: 1 - (pos - 30000) / 10000 }; // 3000-4000m
        }

        function initBirds() {
            birds = [];
            for (let i = 0; i < 8; i++) {
                birds.push({
                    x: Math.random() * canvas.width,
                    y: 15 + Math.random() * canvas.height * 0.15,
                    speed: 0.4 + Math.random() * 0.6,
                    wingPhase: Math.random() * Math.PI * 2,
                    size: 4 + Math.random() * 5,
                    bobPhase: Math.random() * Math.PI * 2
                });
            }
        }

        function initMountains() {
            mountainPoints = [];
            const segments = 20;
            for (let i = 0; i <= segments; i++) {
                mountainPoints.push({
                    x: (i / segments) * canvas.width,
                    h: 40 + Math.random() * 80
                });
            }
        }

        // Weather System
        const weather = {
            active: false,
            intensity: 0, // 0 to 1
            flashOpacity: 0,
            nextChange: 600, // Frames until weather change logic
            raindrops: [],
            clouds: []
        };

        // --- AUDIO SYSTEM ---
        const SoundSys = {
            ctx: null,
            noiseBuffer: null,
            rainGain: null,
            bgmOsc1: null,
            bgmGain: null,
            initialized: false,
            isMuted: false,

            init: function () {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // Create Noise Buffer
                const bufferSize = this.ctx.sampleRate * 2;
                this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                // Rain Sound Setup
                const rainSrc = this.ctx.createBufferSource();
                rainSrc.buffer = this.noiseBuffer;
                rainSrc.loop = true;
                const rainFilter = this.ctx.createBiquadFilter();
                rainFilter.type = 'lowpass';
                rainFilter.frequency.value = 400;
                this.rainGain = this.ctx.createGain();
                this.rainGain.gain.value = 0;

                rainSrc.connect(rainFilter);
                rainFilter.connect(this.rainGain);
                this.rainGain.connect(this.ctx.destination);
                rainSrc.start();

                // Ambient BGM (Cyberpunk drone)
                this.bgmGain = this.ctx.createGain();
                this.bgmGain.gain.value = this.isMuted ? 0 : 0.05;

                this.bgmOsc1 = this.ctx.createOscillator();
                this.bgmOsc1.type = 'sawtooth';
                this.bgmOsc1.frequency.value = 55; // Low A

                const lfo = this.ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.5; // slow throb
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 10;
                lfo.connect(lfoGain);
                lfoGain.connect(this.bgmOsc1.frequency);

                const bgmFilter = this.ctx.createBiquadFilter();
                bgmFilter.type = 'lowpass';
                bgmFilter.frequency.value = 300;

                this.bgmOsc1.connect(bgmFilter);
                bgmFilter.connect(this.bgmGain);
                this.bgmGain.connect(this.ctx.destination);

                this.bgmOsc1.start();
                lfo.start();

                this.initialized = true;
                if (this.isMuted) this.ctx.suspend();
            },

            toggleMute: function () {
                this.isMuted = !this.isMuted;
                if (!this.initialized && !this.isMuted) {
                    this.init();
                } else if (this.initialized) {
                    if (this.isMuted) {
                        this.ctx.suspend();
                    } else {
                        this.ctx.resume();
                    }
                }
                return this.isMuted;
            },

            updateWeatherAudio: function (intensity) {
                if (!this.initialized || this.isMuted) return;
                const targetVol = intensity * 0.4;
                this.rainGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.5);
            },

            playThunder: function () {
                if (!this.initialized || this.isMuted) return;
                const osc = this.ctx.createBufferSource();
                osc.buffer = this.noiseBuffer;

                // Low rumble thunder
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(100, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(300, this.ctx.currentTime + 0.2);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 2.0);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(1.2, this.ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 2.5);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 2.5);
            },

            playStep: function () {
                if (!this.initialized || this.isMuted) return;
                // Layered footstep: noise transient + low thud
                const t = this.ctx.currentTime;

                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'bandpass';
                nFilter.frequency.value = 1200;
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.15, t);
                nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                noise.connect(nFilter).connect(nGain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 0.05);

                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
                const oscGain = this.ctx.createGain();
                oscGain.gain.setValueAtTime(0.3, t);
                oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(oscGain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.1);
            },

            playJump: function () {
                if (!this.initialized || this.isMuted) return;
                const t = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                osc.type = 'square'; // more retro/punchy
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(400, t + 0.15);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(500, t);
                filter.frequency.linearRampToValueAtTime(2000, t + 0.1);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);

                osc.connect(filter).connect(gain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.2);

                // Jump whoosh
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'lowpass';
                nFilter.frequency.setValueAtTime(1000, t);
                nFilter.frequency.linearRampToValueAtTime(200, t + 0.2);
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.1, t);
                nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                noise.connect(nFilter).connect(nGain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 0.2);
            },

            playLand: function () {
                if (!this.initialized || this.isMuted) return;
                const t = this.ctx.currentTime;

                // Hard thud
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.connect(gain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.15);

                // Scuff
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.noiseBuffer;
                const nFilter = this.ctx.createBiquadFilter();
                nFilter.type = 'lowpass';
                nFilter.frequency.value = 800;
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.2, t);
                nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                noise.connect(nFilter).connect(nGain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 0.15);
            }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            initClouds();
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => {
            setTimeout(resize, 150);
        });

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.6,
                    size: Math.random() * 2,
                    alpha: Math.random()
                });
            }
        }

        function initClouds() {
            weather.clouds = [];
            for (let i = 0; i < 8; i++) {
                const w = 100 + Math.random() * 200;
                const h = 40 + Math.random() * 40;
                // Generate puffy circle data for each cloud
                const puffs = [];
                const puffCount = 4 + Math.floor(Math.random() * 4);
                for (let p = 0; p < puffCount; p++) {
                    puffs.push({
                        xOff: (p / (puffCount - 1)) * w * 0.8 + w * 0.1 - w / 2,
                        yOff: (Math.random() - 0.5) * h * 0.4,
                        r: h * 0.35 + Math.random() * h * 0.3
                    });
                }
                weather.clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.3,
                    w, h,
                    speed: 0.2 + Math.random() * 0.3,
                    puffs
                });
            }
        }
        resize();

        // --- Generation ---

        function initGame() {
            SoundSys.init();
            if (SoundSys.ctx.state === 'suspended') SoundSys.ctx.resume();

            player.x = 100;
            player.y = canvas.height - 200;
            player.vx = 0;
            player.vy = 0;
            player.stamina = 100;
            score = 0;
            cameraX = 0;
            gameSpeed = SPEED_base;
            animTime = 0;
            timeProgress = 0;
            lastStepTime = 0;
            frameCount = 0;
            lastTime = 0;
            lives = 3;
            invincibleTimer = 0;
            biomeFlashAlpha = 0;
            transitionCreatures = [];
            nightAircraft = [];

            platforms = [];
            particles = [];
            backgroundBuildings = [];
            birds = [];

            // Reset weather
            weather.active = false;
            weather.intensity = 0;
            weather.flashOpacity = 0;
            weather.raindrops = [];
            initClouds();
            initBirds();
            initMountains();

            platforms.push(createPlatform(0, canvas.height - 150, 1500));

            for (let i = 0; i < 18; i++) {
                backgroundBuildings.push(createBackgroundElement(i * 120 - 200, 0));
            }

            updateLivesUI();
            gameState = 'PLAYING';
            scoreEl.innerText = '0';
            updateStaminaUI();
            requestAnimationFrame(loop);
        }

        function updateLivesUI() {
            const heartsEl = document.getElementById('hearts-el');
            let html = '';
            for (let i = 0; i < 3; i++) {
                if (i < lives) html += '<span style="filter: drop-shadow(0 0 4px #ef4444);">❤️</span>';
                else html += '<span style="opacity:0.2;filter:grayscale(1);">❤️</span>';
            }
            heartsEl.innerHTML = html;
        }

        // Create platform with pre-seeded decoration positions (fixes glitch)
        function createPlatform(x, y, w) {
            const mossTufts = [];
            for (let mx = 0; mx < w; mx += 12 + Math.random() * 8) {
                mossTufts.push({ x: mx, h: 3 + Math.random() * 5 });
            }
            const vinePositions = [];
            for (let vx = 20; vx < w; vx += 60 + Math.random() * 40) {
                vinePositions.push({ x: vx, len: 15 + Math.random() * 25, cx: 5, cy: -3 });
            }
            return { x, y, w, h: 1000, mossTufts, vinePositions };
        }

        // Creates either a building (city) or tree (jungle) based on biome
        function createBackgroundElement(xOffset, distanceHint) {
            const biome = getBiome(distanceHint);
            if (biome.blend > 0.5) {
                return createTree(xOffset);
            }
            return createBuilding(xOffset);
        }

        function createBuilding(xOffset) {
            const h = 150 + Math.random() * 400; // Taller buildings
            const w = 70 + Math.random() * 130; // Wider
            const layer = Math.floor(Math.random() * 3);
            const roofType = Math.floor(Math.random() * 3);
            const windows = [];
            if (layer > 0) {
                const rows = Math.floor(h / 25);
                const cols = Math.floor(w / 18);
                const style = Math.random();
                for (let r = 1; r < rows - 1; r++) {
                    for (let c = 1; c < cols - 1; c++) {
                        if ((style > 0.5 && Math.random() > 0.3) || (style <= 0.5 && (r + c) % 2 === 0)) {
                            // Occasional wide or tall windows if space permits
                            const wide = Math.random() > 0.8 && c < cols - 2;
                            const tall = !wide && Math.random() > 0.8 && r < rows - 2;
                            windows.push({
                                x: c * 18,
                                y: r * 25,
                                w: wide ? 24 : 10,
                                h: tall ? 36 : 16,
                                lightSeed: Math.random(),
                                colorTheme: Math.random() // for different light colors
                            });
                            if (wide) c++; // skip next column
                        }
                    }
                }
            }
            // Rooftop details
            const rooftopDetails = [];
            // Antennas
            if (Math.random() > 0.3) {
                rooftopDetails.push({ type: 'antenna', x: w * 0.2 + Math.random() * w * 0.6, h: 20 + Math.random() * 40, blink: Math.random() });
            }
            // AC units
            const acCount = Math.floor(Math.random() * 4);
            for (let i = 0; i < acCount; i++) {
                rooftopDetails.push({ type: 'ac', x: 8 + Math.random() * (w - 24) });
            }
            // Water tank
            if (Math.random() > 0.5 && h > 200) {
                rooftopDetails.push({ type: 'tank', x: 10 + Math.random() * (w - 30) });
            }
            // Satellite dish
            if (Math.random() > 0.6) {
                rooftopDetails.push({ type: 'dish', x: w * 0.1 + Math.random() * w * 0.8 });
            }
            // Billboard
            if (Math.random() > 0.8 && w > 80 && layer > 0) {
                rooftopDetails.push({
                    type: 'billboard',
                    x: 10 + Math.random() * (w - 70),
                    color: ['#3b82f6', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6'][Math.floor(Math.random() * 5)]
                });
            }
            // Neon sign
            let neonSign = null;
            if (layer >= 1 && Math.random() > 0.5 && h > 200) {
                const neonColors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#22c55e', '#f59e0b'];
                neonSign = {
                    x: 5 + Math.random() * (w - 30),
                    y: 30 + Math.random() * 40,
                    w: 15 + Math.random() * 20,
                    h: 8 + Math.random() * 10,
                    color: neonColors[Math.floor(Math.random() * neonColors.length)],
                    style: Math.floor(Math.random() * 3) // 0: rect, 1: text-like lines, 2: vertical
                };
            }
            // Balconies
            const balconies = [];
            if (layer >= 1 && Math.random() > 0.5) {
                const bCount = 2 + Math.floor(Math.random() * 4);
                for (let i = 0; i < bCount; i++) {
                    balconies.push({ y: 40 + i * (h / (bCount + 1)), side: Math.random() > 0.5 ? 'left' : 'right' });
                }
            }
            return {
                x: xOffset, y: canvas.height - h + 80, w, h,
                layer, roofType, windows, rooftopDetails, neonSign, balconies,
                elementType: 'building'
            };
        }

        function createTree(xOffset) {
            const layer = Math.floor(Math.random() * 3);
            const trunkH = 120 + Math.random() * 200; // Taller trees
            const trunkW = 12 + Math.random() * 22; // Thicker trunks

            // 4 canopy types: round, pine, tall, umbrella
            const canopyTypes = ['round', 'pine', 'tall', 'umbrella'];
            const canopyType = canopyTypes[Math.floor(Math.random() * canopyTypes.length)];
            const canopySize = 50 + Math.random() * 80;
            const leafShade = Math.floor(Math.random() * 4); // Added a new shade

            // Branches
            const branches = [];
            const branchCount = 3 + Math.floor(Math.random() * 4);
            for (let i = 0; i < branchCount; i++) {
                branches.push({
                    yFrac: 0.2 + Math.random() * 0.6,
                    side: Math.random() > 0.5 ? 1 : -1,
                    len: 20 + Math.random() * 40,
                    angle: 0.2 + Math.random() * 0.6,
                    width: 2 + Math.random() * 4
                });
            }
            // Leaf clusters on branches
            const leafClusters = [];
            branches.forEach(br => {
                if (Math.random() > 0.2) {
                    leafClusters.push({
                        yFrac: br.yFrac,
                        side: br.side,
                        len: br.len,
                        angle: br.angle,
                        size: 15 + Math.random() * 25,
                        shade: Math.floor(Math.random() * 4)
                    });
                }
            });
            // Roots
            const roots = [];
            if (Math.random() > 0.2) {
                const rootCount = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < rootCount; i++) {
                    roots.push({
                        side: (i % 2 === 0) ? -1 : 1,
                        len: 15 + Math.random() * 30,
                        curve: Math.random() * 12
                    });
                }
            }
            // Vines
            const vines = [];
            if (Math.random() > 0.2) {
                const vCount = 3 + Math.floor(Math.random() * 5);
                for (let i = 0; i < vCount; i++) {
                    vines.push({
                        xOff: -canopySize * 0.8 + Math.random() * canopySize * 1.6,
                        len: 40 + Math.random() * 80,
                        sway: Math.random() * Math.PI * 2,
                        leaflets: Math.random() > 0.3
                    });
                }
            }
            // Trunk texture seeds
            const barkLines = [];
            for (let by = 5; by < trunkH; by += 8 + Math.random() * 6) {
                barkLines.push({ y: by, curve: (Math.random() - 0.5) * 6 });
            }

            // Moss on trunk
            const mosses = [];
            for (let m = 0; m < 3; m++) {
                mosses.push({
                    y: Math.random() * trunkH,
                    size: 4 + Math.random() * 8,
                    side: Math.random() > 0.5 ? 1 : -1
                });
            }

            return {
                x: xOffset,
                y: canvas.height - trunkH + 80,
                w: Math.max(canopySize * 2, trunkW + 40),
                h: trunkH,
                layer, trunkW, canopyType, canopySize, leafShade,
                branches, leafClusters, roots, vines, barkLines, mosses,
                elementType: 'tree'
            };
        }

        // --- Physics & Logic ---

        function update(dt) {
            frameCount++;
            cameraX += gameSpeed * dt;
            timeProgress = (cameraX % DAY_CYCLE_LENGTH) / DAY_CYCLE_LENGTH;

            // --- Weather Logic ---
            // Randomly toggle weather state periodically
            if (frameCount > weather.nextChange) {
                weather.active = !weather.active;
                // Next change in 10-30 seconds (assuming 60fps)
                weather.nextChange = frameCount + 600 + Math.random() * 1200;
            }

            // Smoothly adjust intensity
            if (weather.active && weather.intensity < 1) {
                weather.intensity += 0.005 * dt;
            } else if (!weather.active && weather.intensity > 0) {
                weather.intensity -= 0.005 * dt;
            }

            // Update Audio based on weather
            SoundSys.updateWeatherAudio(weather.intensity);

            // Spawn Raindrops
            if (weather.intensity > 0) {
                // Spawn count scales with intensity
                const spawnCount = Math.floor(weather.intensity * 5) + 1;
                for (let i = 0; i < spawnCount; i++) {
                    weather.raindrops.push({
                        x: Math.random() * canvas.width + canvas.width * 0.2, // Offset for angle
                        y: -20,
                        vx: -3 - Math.random() * 2, // Wind blowing left
                        vy: 10 + Math.random() * 5, // Fall speed
                        l: 10 + Math.random() * 20  // Length
                    });
                }
            }

            // Update Raindrops
            for (let i = weather.raindrops.length - 1; i >= 0; i--) {
                let r = weather.raindrops[i];
                r.x += r.vx * dt;
                r.y += r.vy * dt;

                // Collision with floor (simple visual approximation)
                if (r.y > canvas.height - 100) {
                    // Chance to splash
                    if (Math.random() > 0.8) {
                        createParticles(r.x, r.y, 1, 'rgba(200,200,255,0.5)');
                    }
                    weather.raindrops.splice(i, 1);
                } else if (r.x < -50) {
                    weather.raindrops.splice(i, 1);
                }
            }

            // Thunder Logic
            if (weather.intensity > 0.7) {
                // Random chance for thunder (~every 5-10 seconds at max intensity)
                if (Math.random() > 0.995) {
                    weather.flashOpacity = 0.8;
                    SoundSys.playThunder();
                }
            }
            // Fade flash
            if (weather.flashOpacity > 0) weather.flashOpacity -= 0.05 * dt;

            // Move Clouds
            weather.clouds.forEach(c => {
                c.x -= c.speed * dt;
                if (c.x + c.w < 0) {
                    c.x = canvas.width + Math.random() * 200;
                    c.y = Math.random() * canvas.height * 0.3;
                }
            });

            // --- Player Logic ---
            player.x += (player.vx + gameSpeed) * dt;
            player.vy += GRAVITY * dt;
            const prevFootY = player.y + player.height; // foot position BEFORE move
            player.y += player.vy * dt;
            const currFootY = player.y + player.height; // foot position AFTER move

            if (player.isGrounded) {
                animTime += 0.25 * dt;
                if (Math.floor(animTime / 2.1) > lastStepTime) {
                    SoundSys.playStep();
                    lastStepTime = Math.floor(animTime / 2.1);
                }
            } else {
                animTime = 0.5;
                lastStepTime = 0;
            }

            player.isGrounded = false;
            for (let p of platforms) {
                // Swept collision: check if feet crossed through platform top this frame
                const onPlatformX = player.x + player.width > p.x && player.x < p.x + p.w;
                const feetCrossedTop = prevFootY <= p.y + 8 && currFootY >= p.y - 4;
                const feetOnSurface = currFootY >= p.y && currFootY <= p.y + 30;

                if (onPlatformX && (feetCrossedTop || feetOnSurface)) {
                    if (player.vy >= 0) {
                        const landVy = player.vy; // save before zeroing
                        player.isGrounded = true;
                        player.vy = 0;
                        player.y = p.y - player.height;
                        if (Math.random() > 0.9) createParticles(player.x + player.width / 2, player.y + player.height, 2, '#777');
                        if (landVy > 2) SoundSys.playLand();
                    }
                }
            }

            if (player.y > canvas.height) loseLife();

            // Invincibility countdown
            if (invincibleTimer > 0) invincibleTimer -= dt;

            const rightmostPlatform = platforms[platforms.length - 1];
            const rightmostX = rightmostPlatform.x + rightmostPlatform.w;

            if (rightmostX < cameraX + canvas.width * 1.5) {
                const gap = 100 + Math.random() * 150;
                const w = 400 + Math.random() * 600;
                let lastY = rightmostPlatform.y;
                let newY = lastY + (Math.random() * 250 - 125);
                newY = Math.max(canvas.height * 0.4, Math.min(canvas.height - 150, newY));

                platforms.push(createPlatform(rightmostX + gap, newY, w));
            }

            if (platforms[0].x + platforms[0].w < cameraX - 200) {
                platforms.shift();
            }

            backgroundBuildings.forEach(b => {
                const parallaxSpeed = gameSpeed * (0.1 + b.layer * 0.1);
                b.x -= parallaxSpeed * dt;
            });

            if (backgroundBuildings.length > 0 && backgroundBuildings[0].x + backgroundBuildings[0].w < -100) {
                backgroundBuildings.shift();
            }

            const bgRightmost = backgroundBuildings[backgroundBuildings.length - 1].x + backgroundBuildings[backgroundBuildings.length - 1].w;
            if (bgRightmost < canvas.width + 100) {
                backgroundBuildings.push(createBackgroundElement(bgRightmost + 10 + Math.random() * 80, cameraX));
            }

            // Bird updates
            birds.forEach(bird => {
                bird.x -= bird.speed * dt;
                bird.wingPhase += 0.1 * dt;
                bird.bobPhase = (bird.bobPhase || 0) + 0.02 * dt;
                if (bird.x < -30) {
                    bird.x = canvas.width + 30 + Math.random() * 150;
                    bird.y = 15 + Math.random() * canvas.height * 0.15;
                }
            });

            // Night aircraft
            if (timeProgress > 0.25 && timeProgress < 0.8) {
                if (Math.random() > 0.998 && nightAircraft.length < 2) {
                    nightAircraft.push({
                        x: -80,
                        y: 20 + Math.random() * canvas.height * 0.2,
                        speed: 0.8 + Math.random() * 0.5,
                        size: 3 + Math.random() * 2,
                        blinkPhase: Math.random() * Math.PI * 2,
                        smokeTrail: [] // smoke particles
                    });
                }
            }
            for (let i = nightAircraft.length - 1; i >= 0; i--) {
                const ac = nightAircraft[i];
                ac.x += ac.speed * dt;
                ac.blinkPhase += 0.15 * dt;
                // Smoke trail
                if (ac.smokeTrail && Math.random() > 0.6) {
                    ac.smokeTrail.push({
                        x: ac.x - ac.size * 3.5,
                        y: ac.y + (Math.random() - 0.5) * 2,
                        life: 1.0,
                        r: 1.5 + Math.random() * 1.5
                    });
                }
                if (ac.smokeTrail) {
                    for (let s = ac.smokeTrail.length - 1; s >= 0; s--) {
                        ac.smokeTrail[s].life -= 0.015 * dt;
                        ac.smokeTrail[s].r += 0.04 * dt;
                        ac.smokeTrail[s].y -= 0.02 * dt;
                        if (ac.smokeTrail[s].life <= 0) ac.smokeTrail.splice(s, 1);
                    }
                }
                if (ac.x > canvas.width + 100) nightAircraft.splice(i, 1);
            }

            // Transition creature spawning (butterflies only)
            const biomeNow = getBiome(cameraX);
            if (biomeNow.type === 'transition') {
                if (Math.random() > 0.92) {
                    transitionCreatures.push({
                        x: canvas.width + 20,
                        y: 50 + Math.random() * canvas.height * 0.4,
                        vx: -(1.5 + Math.random() * 2),
                        vy: (Math.random() - 0.5) * 0.5,
                        type: 'butterfly',
                        phase: Math.random() * Math.PI * 2,
                        size: 4 + Math.random() * 5,
                        color: ['#c084fc', '#fb923c', '#38bdf8', '#fbbf24', '#f472b6'][Math.floor(Math.random() * 5)]
                    });
                }
            }
            // Update transition creatures
            for (let i = transitionCreatures.length - 1; i >= 0; i--) {
                const tc = transitionCreatures[i];
                tc.x += tc.vx * dt;
                tc.y += tc.vy * dt + Math.sin(tc.phase) * 0.3;
                tc.phase += 0.12 * dt;
                if (tc.x < -30) transitionCreatures.splice(i, 1);
            }

            // Biome transition flash effect
            if (biomeNow.type === 'transition') {
                if (biomeFlashAlpha < 0.15) biomeFlashAlpha += 0.003 * dt;
            } else {
                if (biomeFlashAlpha > 0) biomeFlashAlpha -= 0.005 * dt;
            }

            if (player.stamina < 100) {
                player.stamina += 0.15 * dt;
                updateStaminaUI();
            }

            score = Math.floor(cameraX / 10);
            scoreEl.innerText = score;

            updateParticles(dt);
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.04 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateStaminaUI() {
            staminaBar.style.width = player.stamina + '%';
        }

        // --- Rendering Helpers ---

        function interpolateColor(c1, c2, factor) {
            const r = Math.round(c1[0] + (c2[0] - c1[0]) * factor);
            const g = Math.round(c1[1] + (c2[1] - c1[1]) * factor);
            const b = Math.round(c1[2] + (c2[2] - c1[2]) * factor);
            return `rgb(${r},${g},${b})`;
        }

        function getSkyColor(progress) {
            const sunsetTop = [15, 23, 42];
            const sunsetMid = [153, 27, 27];
            const sunsetBot = [245, 158, 11];

            const nightTop = [2, 6, 23];
            const nightMid = [15, 23, 42];
            const nightBot = [30, 41, 59];

            const sunriseTop = [14, 165, 233];
            const sunriseMid = [236, 72, 153];
            const sunriseBot = [253, 186, 116];

            if (progress < 0.25) {
                const t = progress / 0.25;
                return {
                    top: interpolateColor(sunsetTop, nightTop, t),
                    mid: interpolateColor(sunsetMid, nightMid, t),
                    bot: interpolateColor(sunsetBot, nightBot, t),
                    alpha: 1 - t
                };
            } else if (progress < 0.75) {
                return {
                    top: `rgb(${nightTop.join(',')})`,
                    mid: `rgb(${nightMid.join(',')})`,
                    bot: `rgb(${nightBot.join(',')})`,
                    alpha: 0
                };
            } else {
                const t = (progress - 0.75) / 0.25;
                return {
                    top: interpolateColor(nightTop, sunriseTop, t),
                    mid: interpolateColor(nightMid, sunriseMid, t),
                    bot: interpolateColor(nightBot, sunriseBot, t),
                    alpha: t
                };
            }
        }

        function drawCharacter(x, y, w, h) {
            const centerX = x + w / 2;
            const centerY = y + h / 2;
            // Slowed down run cycle from 1.5 to 1.15
            const runCycle = animTime * 1.15;
            const isJumping = !player.isGrounded;
            const bounce = isJumping ? 0 : Math.abs(Math.cos(runCycle)) * 2;
            const bodyY = y + bounce;
            ctx.save();

            // === Motion afterimage trail ===
            if (gameSpeed > SPEED_base + 2 || Math.abs(player.vx) > 2) {
                for (let g = 3; g >= 1; g--) {
                    ctx.globalAlpha = 0.07 * g;
                    const trailX = x - g * 8;
                    drawCharacterBody(trailX, bodyY, w, h, centerX - g * 8, runCycle, isJumping);
                }
                ctx.globalAlpha = 1.0;
            }

            // === Main character ===
            drawCharacterBody(x, bodyY, w, h, centerX, runCycle, isJumping);
            ctx.restore();
        }

        function drawCharacterBody(x, bodyY, w, h, centerX, runCycle, isJumping) {
            // Shadow under character if grounded
            if (!isJumping) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(centerX, bodyY + h - 2, 18 + Math.abs(Math.sin(runCycle)) * 6, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const hipsX = centerX;
            const hipsY = bodyY + 38;

            let leanAngle, lThighAngle, rThighAngle, lKneeBend, rKneeBend, lShoulderAngle, rShoulderAngle, lElbowBend, rElbowBend;

            if (isJumping) {
                const vyNorm = Math.min(1, Math.max(-1, player.vy / 10)); // -1 (going up) to 1 (falling)

                // Parkour jump poses (e.g. Kong vault / stride leap)
                leanAngle = 0.4 - vyNorm * 0.3; // Lean forward on jump launch, straighten on fall

                // Left leg (back) tucks up/forward
                lThighAngle = -1.0 + vyNorm * 0.4;
                lKneeBend = 1.8 - vyNorm * 0.5;

                // Right leg (front) straightens and trails behind, then braces for impact
                rThighAngle = 0.8 - vyNorm * 1.2;
                rKneeBend = Math.max(0.1, 0.2 + vyNorm * 0.4);

                // Arms parkour style (swung high up on launch, windmill down on fall)
                lShoulderAngle = -2.5 + vyNorm * 2.5;
                lElbowBend = -0.5 - Math.max(0, vyNorm * 0.3);

                rShoulderAngle = -1.8 + vyNorm * 2.5;
                rElbowBend = -1.2;

            } else {
                leanAngle = 0.3 + Math.sin(runCycle * 2) * 0.03;

                // --- Realistic Run Animation Angles ---
                const sprintMult = 1.3;

                // Legs: max forward at 0/2PI, max backward at PI
                lThighAngle = -Math.cos(runCycle + Math.PI) * sprintMult;
                rThighAngle = -Math.cos(runCycle) * sprintMult;

                // Knee is practically straight while pushing against the ground (sin is positive -> negative bend -> capped at 0.05)
                // Knee tucks up high during the air-recovery phase (sin is negative -> positive bend -> max 2.2)
                lKneeBend = Math.max(0.05, Math.min(2.2, 0.4 - Math.sin(runCycle + Math.PI) * 2.0));
                rKneeBend = Math.max(0.05, Math.min(2.2, 0.4 - Math.sin(runCycle) * 2.0));

                // Arms swing opposite to legs
                const armMult = 1.4;
                lShoulderAngle = -Math.cos(runCycle) * armMult;
                rShoulderAngle = -Math.cos(runCycle + Math.PI) * armMult;

                // Elbows bend tightest (~90 deg) when arm is swung forward (cos is near 1)
                // and straighten out more when swung back
                lElbowBend = Math.max(-2.0, Math.min(-0.2, -1.0 - Math.cos(runCycle) * 1.0));
                rElbowBend = Math.max(-2.0, Math.min(-0.2, -1.0 - Math.cos(runCycle + Math.PI) * 1.0));
            }

            ctx.save();
            ctx.translate(hipsX, hipsY);

            // Arm Colors
            let backArmSleeveColor, backArmSkinColor, frontArmSleeveColor, frontArmSkinColor;
            if (player.skin === 'default') {
                backArmSleeveColor = '#cbd5e1'; backArmSkinColor = '#fed7aa';
                frontArmSleeveColor = '#f8fafc'; frontArmSkinColor = '#ffedd5';
            } else if (player.skin === 'batman') {
                backArmSleeveColor = '#4b5563'; backArmSkinColor = '#111827'; // Gray sleeve, black glove
                frontArmSleeveColor = '#374151'; frontArmSkinColor = '#030712';
            } else if (player.skin === 'superman') {
                backArmSleeveColor = '#1e40af'; backArmSkinColor = '#fed7aa'; // Blue sleeve, bare hand
                frontArmSleeveColor = '#1d4ed8'; frontArmSkinColor = '#ffedd5';
            }

            // Leg Colors
            let backLegTopColor, backLegBotColor, frontLegTopColor, frontLegBotColor;
            if (player.skin === 'default') {
                backLegTopColor = '#1e293b'; backLegBotColor = '#0f172a';
                frontLegTopColor = '#0f172a'; frontLegBotColor = '#020617';
            } else if (player.skin === 'batman') {
                backLegTopColor = '#4b5563'; backLegBotColor = '#111827'; // Gray thigh, black boot
                frontLegTopColor = '#374151'; frontLegBotColor = '#030712';
            } else if (player.skin === 'superman') {
                backLegTopColor = '#1e40af'; backLegBotColor = '#b91c1c'; // Blue thigh, red boot
                frontLegTopColor = '#1d4ed8'; frontLegBotColor = '#991b1b';
            }

            // Back Arm (Left)
            ctx.save();
            ctx.rotate(leanAngle);
            ctx.translate(0, -24); // move to shoulder
            ctx.rotate(-leanAngle); // un-lean so arm hangs straight down at angle 0
            drawArm(0, 0, lShoulderAngle, lElbowBend, backArmSleeveColor, backArmSkinColor, false, player.skin);
            ctx.restore();

            // Back Leg (Left)
            drawLeg(0, 0, lThighAngle, lKneeBend, backLegTopColor, backLegBotColor, player.skin);

            // Cape (Behind torso, drawn first)
            if (player.skin === 'batman' || player.skin === 'superman') {
                ctx.fillStyle = player.skin === 'batman' ? '#111827' : '#dc2626';
                ctx.beginPath();
                ctx.moveTo(-2, -26); // Left shoulder
                ctx.lineTo(6, -26);  // Right shoulder

                // Advanced sweeping cape physics
                // Base swing controlled by jumping or running. 
                const baseSwing = isJumping ? 1.0 - (player.vy / 15) : Math.sin(runCycle * 1.5) * 1.0 + 0.8;

                // Secondary flutters for the fabric ripples (using animTime for independence from runCycle)
                const flutter1 = Math.sin(animTime * 12) * 5;
                const flutter2 = Math.cos(animTime * 15) * 3;

                if (player.skin === 'batman') {
                    // Scalloped bat-cape (Swinging backwards -> negative X)
                    ctx.quadraticCurveTo(-10 - baseSwing * 15, -5 + flutter1, -15 - baseSwing * 20, 15 + flutter2); // Right edge
                    // Scallop bottom
                    ctx.quadraticCurveTo(-8 - baseSwing * 20, 10, -5 - baseSwing * 22, 22 + flutter1);
                    ctx.quadraticCurveTo(2 - baseSwing * 22, 12, 8 - baseSwing * 25, 23 + flutter2);
                    ctx.quadraticCurveTo(14 - baseSwing * 25, 12, 18 - baseSwing * 30, 20 + flutter1);
                    // Left edge
                    ctx.quadraticCurveTo(10 - baseSwing * 15, 0, -2, -26);
                } else {
                    // Straight/flowing superman cape (Swinging backwards -> negative X)
                    ctx.quadraticCurveTo(-15 - baseSwing * 10, -5, -12 - baseSwing * 20 + flutter1, 22 + flutter2); // Bottom right tip
                    ctx.quadraticCurveTo(5 - baseSwing * 10 + flutter2, 24, 18 - baseSwing * 30 + flutter1, 26 + flutter1); // Bottom left tip
                    ctx.quadraticCurveTo(5, 0, -2, -26); // Left edge back to shoulder
                }
                ctx.fill();
            }

            // Torso (Context is at hips, rotated by lean)
            ctx.save();
            ctx.rotate(leanAngle);

            if (player.skin === 'default') {
                // ... Office Worker Torso ...
                // Shirt Base
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.moveTo(-3, -26);
                ctx.lineTo(5, -26);
                ctx.lineTo(7, -22); // Shoulder
                ctx.lineTo(5, 0);   // Waist front
                ctx.lineTo(-4, 0);  // Waist back
                ctx.lineTo(-6, -22); // Shoulder back
                ctx.closePath();
                ctx.fill();

                // Shirt folds / shading
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(3, -22);
                ctx.lineTo(1, -5);
                ctx.stroke();

                // Collar
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath();
                ctx.moveTo(-2, -26);
                ctx.lineTo(4, -26);
                ctx.lineTo(1, -21);
                ctx.closePath();
                ctx.fill();

                // Red Tie
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.moveTo(-1, -24);
                ctx.lineTo(3, -24);
                const tieSwing = isJumping ? 1.0 - (player.vy / 15) : Math.sin(runCycle * 2) * 1.0 + 0.8;
                ctx.lineTo(1 + tieSwing * 5, -8);
                ctx.lineTo(-2 + tieSwing * 5, -8);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#b91c1c'; // dark tip
                ctx.beginPath();
                ctx.moveTo(-2 + tieSwing * 5, -8);
                ctx.lineTo(1 + tieSwing * 5, -8);
                ctx.lineTo(-0.5 + tieSwing * 8, -2);
                ctx.closePath();
                ctx.fill();

                // Belt & Tucked Shirt Line
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-5, -2, 11, 3);
                ctx.fillStyle = '#cbd5e1'; // Buckle
                ctx.fillRect(0, -2, 3, 3);
            } else {
                // Superhero Torso
                const suitColor = player.skin === 'batman' ? '#374151' : '#1d4ed8'; // Dark gray or Blue
                const beltColor = '#eab308'; // Yellow belt

                // Suit Base
                ctx.fillStyle = suitColor;
                ctx.beginPath();
                ctx.moveTo(-3, -26);
                ctx.lineTo(5, -26);
                ctx.lineTo(7, -22);
                ctx.lineTo(5, 0);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-6, -22);
                ctx.closePath();
                ctx.fill();

                // Chest Logo Placeholder
                ctx.fillStyle = player.skin === 'batman' ? '#000' : '#dc2626';
                ctx.beginPath();
                if (player.skin === 'batman') {
                    // Bat logo (simplified ellipse)
                    ctx.ellipse(1, -16, 4, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // S logo (simplified diamond)
                    ctx.moveTo(1, -19);
                    ctx.lineTo(5, -16);
                    ctx.lineTo(1, -12);
                    ctx.lineTo(-3, -16);
                    ctx.fill();
                    ctx.fillStyle = '#eab308'; // yellow center
                    ctx.beginPath();
                    ctx.moveTo(1, -17);
                    ctx.lineTo(3, -16);
                    ctx.lineTo(1, -14);
                    ctx.lineTo(-1, -16);
                    ctx.fill();
                }

                // Belt
                ctx.fillStyle = beltColor;
                ctx.fillRect(-5, -2, 11, 3);

                // Trunks
                const trunksColor = player.skin === 'batman' ? '#111827' : '#dc2626';
                ctx.fillStyle = trunksColor;
                ctx.fillRect(-4, 1, 9, 3);
            }

            // Head (attached to neck)
            ctx.save();
            ctx.translate(1, -30); // 1 pixel forward for better posture
            // unrotate head slightly so he looks forward
            ctx.rotate(-leanAngle * 0.7);

            // Skin (Face base)
            ctx.fillStyle = '#fed7aa';
            ctx.beginPath();
            ctx.arc(0, -4, 8, 0, Math.PI * 2);
            ctx.fill();

            // Jaw line & Chin
            ctx.beginPath();
            ctx.moveTo(-8, -4);
            ctx.lineTo(-5, 5);
            ctx.lineTo(2, 6); // Chin point
            ctx.lineTo(8, -4);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#fdb172'; // Slightly darker skin tone for shadow
            ctx.beginPath();
            ctx.moveTo(7, -3);
            ctx.lineTo(10, -1);
            ctx.lineTo(7, 2);
            ctx.fill();

            if (player.skin === 'default') {
                // Office Hair (Dynamic flutter)
                const hairBase = isJumping ? -3 + (player.vy / 10) * 2 : -1.5;
                const hairS1 = hairBase + (isJumping ? 0 : Math.sin(runCycle * 4) * 2.5);
                const hairS2 = hairBase + (isJumping ? 0 : Math.cos(runCycle * 3) * 1.5);

                ctx.fillStyle = '#452b17';
                ctx.beginPath();
                ctx.moveTo(-9, -2);
                ctx.quadraticCurveTo(-11 + hairS1, -12 + hairS2, 0, -14);
                ctx.quadraticCurveTo(8, -13, 9, -5);
                ctx.quadraticCurveTo(5, -10, -2, -8);
                ctx.quadraticCurveTo(-7, -8, -9, -2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-8, -4);
                ctx.quadraticCurveTo(-12 + hairS1 * 1.5, 0 + hairS2, -10 + hairS1, 3);
                ctx.lineTo(-6, 2);
                ctx.fill();

                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(3, -4.5, 2.5, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
                // Pupil
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(4, -4.5, 1, 0, Math.PI * 2);
                ctx.fill();

                // Glasses
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.roundRect(1, -6.5, 5, 4, 1);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(1, -4.5);
                ctx.lineTo(-4, -4.5);
                ctx.stroke();

                // Eyebrow
                ctx.strokeStyle = '#352212';
                ctx.lineWidth = 1.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(1, -7.5);
                ctx.lineTo(5, -8);
                ctx.stroke();
            } else if (player.skin === 'batman') {
                // Detailed Batman Cowl - covers entire head except lower jaw/mouth
                ctx.fillStyle = '#111827';
                ctx.beginPath();

                // Start from back jaw area and go up the back of head
                ctx.moveTo(-8, 5);   // back jaw guard
                ctx.lineTo(-9, -2);  // back of head, mid

                // Arc over the entire top of the head (back to front)
                ctx.arc(0, -4, 9, Math.PI, 0, false); // full top half arc

                // Down the front cheek
                ctx.lineTo(9, 2);
                ctx.lineTo(8, 5);    // front cheekbone

                // Face opening cutout (jaw/mouth area) - trace inward
                ctx.lineTo(3, 3);    // cut toward jaw
                ctx.lineTo(3, 0);    // jaw opening edge
                ctx.lineTo(0, 0);    // mouth opening base
                ctx.lineTo(-4, 2);   // nose bridge
                ctx.closePath();
                ctx.fill();

                // Pointy bat ears on top of cowl
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.moveTo(-5, -12);  // Left ear base outer
                ctx.lineTo(-7, -20);  // Left ear tip
                ctx.lineTo(-2, -12);  // Left ear base inner
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(2, -12);   // Right ear base inner
                ctx.lineTo(5, -20);   // Right ear tip
                ctx.moveTo(2, -12);
                ctx.lineTo(5, -20);
                ctx.lineTo(7, -12);   // Right ear base outer
                ctx.closePath();
                ctx.fill();

                // Angled White Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(-1, -6);
                ctx.lineTo(3, -7);
                ctx.lineTo(4.5, -5);
                ctx.lineTo(-1, -4.5);
                ctx.fill();
            } else if (player.skin === 'superman') {
                // Superman Hair (Black, tight with a spit curl)
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(0, -4, 8.5, Math.PI, Math.PI * 2); // top cap
                ctx.lineTo(9, -2);
                ctx.lineTo(5, -8);
                // Spit curl
                ctx.quadraticCurveTo(8, -4, 4, -4);
                ctx.quadraticCurveTo(7, -6, -2, -8);
                ctx.lineTo(-9, -2);
                ctx.fill();

                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(3, -4.5, 2.5, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
                // Pupil (Blue)
                ctx.fillStyle = '#1d4ed8';
                ctx.beginPath();
                ctx.arc(4, -4.5, 1, 0, Math.PI * 2);
                ctx.fill();

                // Eyebrow
                ctx.strokeStyle = '#020617';
                ctx.lineWidth = 1.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(1, -7.5);
                ctx.lineTo(5, -8);
                ctx.stroke();
            }
