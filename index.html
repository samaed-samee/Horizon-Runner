            ctx.restore(); // Head
            ctx.restore(); // Torso 

            // Front Leg (Right)
            drawLeg(0, 0, rThighAngle, rKneeBend, frontLegTopColor, frontLegBotColor, player.skin);

            // Front Arm (Right)
            ctx.save();
            ctx.rotate(leanAngle);
            ctx.translate(0, -24);
            ctx.rotate(-leanAngle);
            drawArm(0, 0, rShoulderAngle, rElbowBend, frontArmSleeveColor, frontArmSkinColor, true, player.skin);
            ctx.restore();

            ctx.restore(); // Hips
        }

        // Draws a realistic leg segment (Pants -> Calf -> Shoe)
        function drawLeg(x, y, thighAngle, kneeAngle, colorTop, colorBot, skinType) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(thighAngle);

            // Thigh (Pants)
            ctx.fillStyle = colorTop;
            ctx.beginPath();
            ctx.moveTo(-5, 0); // front hip
            ctx.lineTo(4, 0); // back hip
            ctx.lineTo(3, 17); // back knee
            ctx.lineTo(-4, 17); // front knee
            ctx.fill();

            // Knee joint overlap
            ctx.beginPath();
            ctx.arc(-0.5, 16.5, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.translate(0, 17);
            ctx.rotate(kneeAngle);

            // Calf (Pants/Boots)
            ctx.fillStyle = colorBot;
            ctx.beginPath();
            ctx.moveTo(-3, -1);
            ctx.lineTo(3, -1);
            ctx.lineTo(2, 16); // ankle
            ctx.lineTo(-2, 16); // ankle
            ctx.fill();

            // Shoe / Boot
            ctx.translate(0, 16);
            if (skinType === 'batman' || skinType === 'superman') {
                ctx.fillStyle = colorBot; // Same color as calf/boot top
                ctx.beginPath();
                ctx.moveTo(-3, 0);
                // Superhero boot shape
                ctx.lineTo(8, 0);
                ctx.quadraticCurveTo(8, 5, 5, 5);
                ctx.lineTo(-4, 5);
                ctx.lineTo(-4, 0);
                ctx.fill();
            } else {
                ctx.fillStyle = colorBot === '#020617' ? '#0f172a' : '#000000'; // shiny black
                ctx.beginPath();
                ctx.moveTo(-3, 0);
                ctx.lineTo(7, 0); // pointing toe forwards
                ctx.quadraticCurveTo(9, 4, 7, 5); // toe bend
                ctx.lineTo(-4, 5); // heel
                ctx.lineTo(-4, 0); // heel top
                ctx.fill();
                // Shoe highlight
                if (colorBot === '#020617') {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.fillRect(0, 1, 4, 1);
                }
            }

            ctx.restore();
        }

        // Draws a realistic arm segment (Sleeve -> Forearm -> Hand)
        function drawArm(x, y, shoulderAngle, elbowAngle, shirtColor, skinColor, isFront, skinType) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(shoulderAngle);

            // Upper arm (Sleeve)
            ctx.fillStyle = shirtColor;
            ctx.beginPath();
            ctx.moveTo(-3, 0);
            ctx.lineTo(3, 0);
            ctx.lineTo(2, 14);
            ctx.lineTo(-2, 14);
            ctx.fill();

            // Shoulder curve
            ctx.beginPath();
            ctx.arc(0, 0, 3, Math.PI, 0);
            ctx.fill();

            // Elbow joint
            ctx.beginPath();
            ctx.arc(0, 13.5, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.translate(0, 14);
            ctx.rotate(elbowAngle);

            // Forearm (Sleeve folded or glove)
            const forearmColor = (skinType === 'batman') ? skinColor : shirtColor; // Batman gloves extend to forearm
            ctx.fillStyle = forearmColor;

            ctx.beginPath();
            ctx.moveTo(-2, -1);
            ctx.lineTo(2, -1);
            ctx.lineTo(1.5, 11); // Wrist
            ctx.lineTo(-1.5, 11);
            ctx.fill();

            if (skinType === 'batman' && isFront) {
                // Batman gauntlet spikes (on the back of forearm)
                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.moveTo(-1.5, 3); ctx.lineTo(-4, 2); ctx.lineTo(-1.5, 5);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-1.5, 6); ctx.lineTo(-4, 5); ctx.lineTo(-1.5, 8);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-1.5, 9); ctx.lineTo(-4, 8); ctx.lineTo(-1.5, 11);
                ctx.fill();
            }

            if (skinType === 'default') {
                // Cuff detail
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-1.5, 9);
                ctx.lineTo(1.5, 9);
                ctx.stroke();
            }

            // Hand (Clenched slightly)
            ctx.translate(0, 11);
            // Counter-rotate hand slightly so it doesn't look broken
            ctx.rotate(-elbowAngle * 0.3);
            ctx.fillStyle = skinColor;
            ctx.beginPath();
            ctx.arc(0, 2, 2.5, 0, Math.PI * 2);
            ctx.fill();
            // Thumb
            ctx.beginPath();
            ctx.ellipse(-1.5, 1, 1.5, 2, 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            const sky = getSkyColor(timeProgress);
            const biome = getBiome(cameraX);

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, sky.top);
            gradient.addColorStop(0.5, sky.mid);
            gradient.addColorStop(1, sky.bot);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun
            if (timeProgress < 0.35 || timeProgress > 0.65) {
                let sunProgress = timeProgress < 0.35 ? timeProgress : 1.0 - (timeProgress - 0.65) * 1.5;
                let sunAlpha = Math.max(0, 1 - sunProgress * 2.5);
                const sunY = canvas.height * 0.3 + (sunProgress * canvas.height * 1.5);
                const sunX = timeProgress < 0.35 ? canvas.width * 0.8 : canvas.width * 0.2 + (timeProgress - 0.65) * canvas.width * 0.5;

                ctx.save();
                ctx.fillStyle = `rgba(255, 120, 50, ${sunAlpha * 0.15})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Outer huge glow
                const megaGlow = ctx.createRadialGradient(sunX, sunY, 100, sunX, sunY, 600);
                megaGlow.addColorStop(0, `rgba(255, 100, 50, ${sunAlpha * 0.2})`);
                megaGlow.addColorStop(1, `rgba(255, 50, 0, 0)`);
                ctx.fillStyle = megaGlow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 600, 0, Math.PI * 2);
                ctx.fill();

                // Inner glow
                const glow = ctx.createRadialGradient(sunX, sunY, 40, sunX, sunY, 200);
                glow.addColorStop(0, `rgba(255, 230, 150, ${sunAlpha * 0.6})`);
                glow.addColorStop(1, `rgba(255, 100, 50, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 200, 0, Math.PI * 2);
                ctx.fill();

                // Core
                const sun = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 80);
                sun.addColorStop(0, `rgba(255, 255, 255, ${sunAlpha})`);
                sun.addColorStop(0.4, `rgba(255, 240, 150, ${sunAlpha})`);
                sun.addColorStop(1, `rgba(255, 150, 0, 0)`);
                ctx.fillStyle = sun;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Moon
            if (timeProgress > 0.15 && timeProgress < 0.85) {
                const moonP = (timeProgress - 0.15) / 0.7; // 0 to 1 over the night
                const moonY = canvas.height * 0.15 + Math.abs(0.5 - moonP) * canvas.height * 0.3;

                // Moon starts on the left (0.2) and moves to the right (0.8)
                const moonX = canvas.width * 0.2 + (moonP * canvas.width * 0.6);

                // Moon glow
                const mGlow = ctx.createRadialGradient(moonX, moonY, 35, moonX, moonY, 200);
                mGlow.addColorStop(0, 'rgba(200, 220, 255, 0.4)');
                mGlow.addColorStop(1, 'rgba(200, 220, 255, 0)');
                ctx.fillStyle = mGlow;
                ctx.beginPath();
                ctx.arc(moonX, moonY, 200, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(240, 248, 255, 0.95)';
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(moonX, moonY, 35, 0, Math.PI * 2);
                ctx.fill();

                // Moon craters
                ctx.fillStyle = 'rgba(148, 163, 184, 0.3)';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(moonX - 10, moonY - 10, 8, 0, Math.PI * 2);
                ctx.arc(moonX + 12, moonY + 5, 5, 0, Math.PI * 2);
                ctx.arc(moonX - 5, moonY + 15, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Stars
            if (timeProgress > 0.2 && timeProgress < 0.8) {
                const starOpacity = timeProgress > 0.3 && timeProgress < 0.7 ? 1 : (timeProgress <= 0.3 ? (timeProgress - 0.2) / 0.1 : (0.8 - timeProgress) / 0.1);
                ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity})`;
                stars.forEach(s => {
                    const twinkle = 0.5 + Math.sin(animTime * 5 + s.x) * 0.5;
                    ctx.globalAlpha = (s.alpha * starOpacity) * (0.5 + twinkle * 0.5);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * (1 + twinkle * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                });

                // Occasional shooting star
                if (Math.random() > 0.99) {
                    const sx = Math.random() * canvas.width;
                    const sy = Math.random() * canvas.height * 0.4;
                    const len = 30 + Math.random() * 80;
                    ctx.globalAlpha = starOpacity;
                    const sgrad = ctx.createLinearGradient(sx, sy, sx - len, sy + len * 0.5);
                    sgrad.addColorStop(0, `rgba(255,255,255,1)`);
                    sgrad.addColorStop(1, `rgba(255,255,255,0)`);
                    ctx.strokeStyle = sgrad;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx - len, sy + len * 0.5);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
            }

            // === MOUNTAINS / HILLS ===
            if (mountainPoints.length > 1) {
                const mtBaseY = canvas.height * 0.55;
                // City = blue-gray mountains, jungle = green rolling hills
                const mtR = Math.round(30 + biome.blend * 10);
                const mtG = Math.round(41 + biome.blend * 60);
                const mtB = Math.round(59 - biome.blend * 20);
                ctx.fillStyle = `rgba(${mtR},${mtG},${mtB}, 0.25)`;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                mountainPoints.forEach((mp, i) => {
                    const hillH = mp.h * (biome.blend > 0.5 ? 0.7 : 1.0);
                    if (i === 0) ctx.lineTo(mp.x, mtBaseY - hillH);
                    else {
                        const prev = mountainPoints[i - 1];
                        const cpx = (prev.x + mp.x) / 2;
                        ctx.quadraticCurveTo(cpx, mtBaseY - (prev.h + hillH) / 2 - 10, mp.x, mtBaseY - hillH);
                    }
                });
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            }

            // === ATMOSPHERIC FOG ===
            const fogY = canvas.height * 0.5;
            const fogGrad = ctx.createLinearGradient(0, fogY - 30, 0, fogY + 50);
            const fogR = Math.round(15 + biome.blend * 10);
            const fogG = Math.round(23 + biome.blend * 30);
            const fogB = Math.round(42 - biome.blend * 10);
            fogGrad.addColorStop(0, `rgba(${fogR},${fogG},${fogB}, 0)`);
            fogGrad.addColorStop(0.5, `rgba(${fogR},${fogG},${fogB}, 0.15)`);
            fogGrad.addColorStop(1, `rgba(${fogR},${fogG},${fogB}, 0)`);
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, fogY - 30, canvas.width, 80);

            // === FLYING BIRDS (proper silhouettes) ===
            birds.forEach(bird => {
                const wing = Math.sin(bird.wingPhase) * 0.6;
                const bob = Math.sin(bird.bobPhase || 0) * 1.5;
                const bx = bird.x;
                const by = bird.y + bob;
                const s = bird.size;
                ctx.fillStyle = `rgba(20, 20, 30, 0.5)`;
                ctx.beginPath();
                // Body
                ctx.ellipse(bx, by, s * 0.8, s * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
                // Left wing
                ctx.beginPath();
                ctx.moveTo(bx - s * 0.2, by);
                ctx.quadraticCurveTo(bx - s * 1.2, by - s * wing * 1.2, bx - s * 1.5, by - s * wing);
                ctx.quadraticCurveTo(bx - s * 0.8, by - s * 0.1, bx - s * 0.2, by);
                ctx.fill();
                // Right wing
                ctx.beginPath();
                ctx.moveTo(bx + s * 0.2, by);
                ctx.quadraticCurveTo(bx + s * 1.2, by - s * wing * 1.2, bx + s * 1.5, by - s * wing);
                ctx.quadraticCurveTo(bx + s * 0.8, by - s * 0.1, bx + s * 0.2, by);
                ctx.fill();
                // Tail
                ctx.beginPath();
                ctx.moveTo(bx - s * 0.6, by);
                ctx.lineTo(bx - s * 1.0, by + s * 0.15);
                ctx.lineTo(bx - s * 1.0, by - s * 0.1);
                ctx.closePath();
                ctx.fill();
            });

            // === NIGHT AIRCRAFT (improved design + smoke) ===
            if (timeProgress > 0.25 && timeProgress < 0.8) {
                nightAircraft.forEach(ac => {
                    const ax = ac.x;
                    const ay = ac.y;
                    const sz = ac.size;

                    // Smoke trail behind aircraft
                    if (ac.smokeTrail) {
                        ac.smokeTrail.forEach(sp => {
                            ctx.fillStyle = `rgba(180, 190, 200, ${sp.life * 0.25})`;
                            ctx.beginPath();
                            ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }

                    // Fuselage (elongated, sleek)
                    ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(ax + sz * 4, ay);
                    ctx.quadraticCurveTo(ax + sz * 3, ay - sz * 0.5, ax - sz * 3.5, ay - sz * 0.15);
                    ctx.quadraticCurveTo(ax - sz * 3.5, ay + sz * 0.15, ax + sz * 4, ay);
                    ctx.fill();

                    // Main swept wings
                    ctx.fillStyle = 'rgba(100, 116, 139, 0.45)';
                    ctx.beginPath();
                    ctx.moveTo(ax + sz * 0.5, ay);
                    ctx.lineTo(ax - sz * 0.5, ay - sz * 2.5);
                    ctx.lineTo(ax - sz * 1.5, ay - sz * 2.2);
                    ctx.lineTo(ax - sz * 0.5, ay);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ax + sz * 0.5, ay);
                    ctx.lineTo(ax - sz * 0.5, ay + sz * 2.5);
                    ctx.lineTo(ax - sz * 1.5, ay + sz * 2.2);
                    ctx.lineTo(ax - sz * 0.5, ay);
                    ctx.closePath();
                    ctx.fill();

                    // Horizontal stabilizers (small rear wings)
                    ctx.fillStyle = 'rgba(100, 116, 139, 0.4)';
                    ctx.beginPath();
                    ctx.moveTo(ax - sz * 2.5, ay);
                    ctx.lineTo(ax - sz * 3, ay - sz * 1);
                    ctx.lineTo(ax - sz * 3.5, ay - sz * 0.8);
                    ctx.lineTo(ax - sz * 3, ay);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ax - sz * 2.5, ay);
                    ctx.lineTo(ax - sz * 3, ay + sz * 1);
                    ctx.lineTo(ax - sz * 3.5, ay + sz * 0.8);
                    ctx.lineTo(ax - sz * 3, ay);
                    ctx.closePath();
                    ctx.fill();

                    // Vertical tail fin
                    ctx.fillStyle = 'rgba(120, 130, 150, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(ax - sz * 2.8, ay);
                    ctx.lineTo(ax - sz * 3.5, ay - sz * 1.2);
                    ctx.lineTo(ax - sz * 3.2, ay - sz * 1.3);
                    ctx.lineTo(ax - sz * 2.2, ay);
                    ctx.closePath();
                    ctx.fill();

                    // Engine nacelles under wings
                    ctx.fillStyle = 'rgba(80, 90, 100, 0.5)';
                    ctx.beginPath();
                    ctx.ellipse(ax, ay - sz * 1.2, sz * 0.7, sz * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(ax, ay + sz * 1.2, sz * 0.7, sz * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Cockpit window
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.beginPath();
                    ctx.ellipse(ax + sz * 3, ay, sz * 0.6, sz * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Blinking nav light (nose)
                    const blinkOn = Math.sin(ac.blinkPhase) > 0;
                    if (blinkOn) {
                        ctx.fillStyle = '#ef4444';
                        ctx.shadowColor = '#ef4444';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(ax + sz * 4, ay, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    // Steady white tail light
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(ax - sz * 3.5, ay, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Wing tip lights (green starboard, red port)
                    ctx.fillStyle = '#22c55e';
                    ctx.shadowColor = '#22c55e';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(ax - sz * 0.5, ay - sz * 2.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(ax - sz * 0.5, ay + sz * 2.5, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }

            // Clouds (Weather) - Natural cloud shape
            weather.clouds.forEach(c => {
                const stormDarkness = weather.intensity * 100;
                const baseR = Math.max(0, 255 - stormDarkness);
                const cx = c.x + c.w / 2;
                const cy = c.y + c.h / 2;
                if (c.puffs) {
                    // Draw all puffs as a single merged shape
                    ctx.fillStyle = `rgba(${baseR}, ${baseR}, ${Math.min(255, baseR + 10)}, 0.25)`;
                    ctx.beginPath();
                    c.puffs.forEach(pf => {
                        ctx.moveTo(cx + pf.xOff + pf.r, cy + pf.yOff);
                        ctx.arc(cx + pf.xOff, cy + pf.yOff, pf.r, 0, Math.PI * 2);
                    });
                    ctx.fill();
                    // Subtle flat bottom shadow
                    ctx.fillStyle = `rgba(${Math.max(0, baseR - 60)}, ${Math.max(0, baseR - 70)}, ${Math.max(0, baseR - 50)}, 0.08)`;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + c.h * 0.2, c.w * 0.4, c.h * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = `rgba(${baseR}, ${baseR}, ${baseR}, 0.25)`;
                    ctx.beginPath();
                    ctx.roundRect(c.x, c.y, c.w, c.h, 20);
                    ctx.fill();
                }
            });

            // === TRANSITION CREATURES (butterflies only) ===
            transitionCreatures.forEach(tc => {
                ctx.save();
                ctx.translate(tc.x, tc.y);
                const wingAngle = Math.sin(tc.phase * 3) * 0.7;
                ctx.fillStyle = tc.color;
                // Left wing
                ctx.save();
                ctx.rotate(-wingAngle);
                ctx.beginPath();
                ctx.ellipse(-tc.size * 0.6, 0, tc.size, tc.size * 0.6, -0.3, 0, Math.PI * 2);
                ctx.globalAlpha = 0.7;
                ctx.fill();
                ctx.restore();
                // Right wing
                ctx.save();
                ctx.rotate(wingAngle);
                ctx.beginPath();
                ctx.ellipse(tc.size * 0.6, 0, tc.size, tc.size * 0.6, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                // Body
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.ellipse(0, 0, 1.5, tc.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                // Antennae
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(0, -tc.size * 0.4);
                ctx.quadraticCurveTo(-3, -tc.size, -4, -tc.size * 1.1);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -tc.size * 0.4);
                ctx.quadraticCurveTo(3, -tc.size, 4, -tc.size * 1.1);
                ctx.stroke();
                ctx.restore();
            });

            // === BIOME TRANSITION EFFECT ===
            if (biomeFlashAlpha > 0.001) {
                const biomeNowDraw = getBiome(cameraX);
                const flashR = biomeNowDraw.blend > 0.5 ? 34 : 100;
                const flashG = biomeNowDraw.blend > 0.5 ? 139 : 116;
                const flashB = biomeNowDraw.blend > 0.5 ? 34 : 139;
                ctx.fillStyle = `rgba(${flashR}, ${flashG}, ${flashB}, ${biomeFlashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // === BACKGROUND ELEMENTS (Buildings + Trees) ===
            backgroundBuildings.forEach(b => {
                if (b.elementType === 'tree') {
                    drawTree(b);
                } else {
                    drawBuilding(b);
                }
            });

            ctx.save();
            ctx.translate(-cameraX, 0);

            // === PLATFORMS (Biome-specific) ===
            platforms.forEach(p => {
                const pBiome = getBiome(p.x);
                if (pBiome.blend > 0.5) {
                    // JUNGLE: wooden planks
                    const woodGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + Math.min(35, p.h));
                    woodGrad.addColorStop(0, '#6d4c2e');
                    woodGrad.addColorStop(0.5, '#5c3d2e');
                    woodGrad.addColorStop(1, '#4a3020');
                    ctx.fillStyle = woodGrad;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    // Plank lines (deterministic)
                    ctx.strokeStyle = '#4a3020';
                    ctx.lineWidth = 1;
                    for (let lx = 0; lx < p.w; lx += 35 + Math.sin(lx) * 10) {
                        ctx.beginPath();
                        ctx.moveTo(p.x + lx, p.y);
                        ctx.lineTo(p.x + lx, p.y + Math.min(30, p.h));
                        ctx.stroke();
                    }
                    // Mossy top edge
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(p.x, p.y, p.w, 3);
                    // Moss tufts (pre-seeded, no glitch)
                    ctx.fillStyle = '#22c55e';
                    if (p.mossTufts) {
                        p.mossTufts.forEach(mt => {
                            ctx.beginPath();
                            ctx.arc(p.x + mt.x, p.y, mt.h, Math.PI, 0);
                            ctx.fill();
                        });
                    }
                    // Vines hanging below (pre-seeded)
                    ctx.strokeStyle = '#16a34a';
                    ctx.lineWidth = 1.5;
                    if (p.vinePositions) {
                        p.vinePositions.forEach(vp => {
                            ctx.beginPath();
                            ctx.moveTo(p.x + vp.x, p.y + 4);
                            ctx.quadraticCurveTo(p.x + vp.x + vp.cx, p.y + vp.len * 0.6, p.x + vp.x + vp.cy, p.y + vp.len);
                            ctx.stroke();
                        });
                    }
                } else {
                    // CITY: concrete rooftops
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y, p.w, 4);
                    ctx.fillStyle = '#334155';
                    for (let lx = 50; lx < p.w; lx += 100) {
                        ctx.fillRect(p.x + lx, p.y + 10, 3, Math.min(p.h - 20, 40));
                    }
                    ctx.fillStyle = '#64748b';
                    for (let rx = 0; rx < p.w; rx += 40) {
                        ctx.fillRect(p.x + rx, p.y - 8, 2, 8);
                    }
                    ctx.fillStyle = '#475569';
                    ctx.fillRect(p.x, p.y - 8, p.w, 1.5);
                    if (p.w > 200) {
                        ctx.fillStyle = '#334155';
                        ctx.fillRect(p.x + 30, p.y + 6, 8, 12);
                        ctx.fillRect(p.x + p.w - 50, p.y + 6, 10, 8);
                    }
                }
            });

            // Invincibility flash on character
            if (invincibleTimer > 0 && Math.sin(animTime * 20) > 0) {
                ctx.globalAlpha = 0.4;
            }
            drawCharacter(player.x, player.y, player.width, player.height);
            ctx.globalAlpha = 1.0;

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();

            // Rain (Foreground) - Enhanced with variable thickness and mist
            if (weather.intensity > 0) {
                // Main rain streaks
                weather.raindrops.forEach(r => {
                    const thickness = 0.5 + r.l * 0.05;
                    const alpha = weather.intensity * (0.3 + (r.l / 30) * 0.3);
                    ctx.strokeStyle = `rgba(170, 200, 255, ${alpha})`;
                    ctx.lineWidth = thickness;
                    ctx.beginPath();
                    ctx.moveTo(r.x, r.y);
                    ctx.lineTo(r.x + r.vx * 2, r.y + r.l);
                    ctx.stroke();
                });
                // Rain mist layer near ground
                if (weather.intensity > 0.3) {
                    const mistAlpha = (weather.intensity - 0.3) * 0.15;
                    const mistGrad = ctx.createLinearGradient(0, canvas.height - 120, 0, canvas.height);
                    mistGrad.addColorStop(0, `rgba(170, 200, 255, 0)`);
                    mistGrad.addColorStop(1, `rgba(170, 200, 255, ${mistAlpha})`);
                    ctx.fillStyle = mistGrad;
                    ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
                }
            }

            // Vignette & Flash
            const vignetteAlpha = 0.3 + (timeProgress > 0.2 && timeProgress < 0.8 ? 0.3 : 0);
            const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height / 2, canvas.width / 2, canvas.height / 2, canvas.height);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, `rgba(0,0,0,${vignetteAlpha})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lightning Flash
            if (weather.flashOpacity > 0.01) {
                ctx.fillStyle = `rgba(255, 255, 255, ${weather.flashOpacity})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // === BUILDING RENDERER ===
        function drawBuilding(b) {
            const baseAlpha = 0.3 + b.layer * 0.2;
            // Building body with side-lit gradient for 3D depth
            const bGrad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y);
            bGrad.addColorStop(0, `rgba(10, 18, 35, ${baseAlpha + 0.15})`);
            bGrad.addColorStop(0.25, `rgba(15, 23, 42, ${baseAlpha + 0.05})`);
            bGrad.addColorStop(0.75, `rgba(25, 35, 55, ${baseAlpha})`);
            bGrad.addColorStop(1, `rgba(20, 30, 50, ${baseAlpha + 0.1})`);
            ctx.fillStyle = bGrad;
            ctx.fillRect(b.x, b.y, b.w, b.h);

            // Edge highlight for 3D effect
            ctx.fillStyle = `rgba(100, 116, 139, ${baseAlpha * 0.3})`;
            ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h);

            // Horizontal floor lines with subtle depth
            ctx.strokeStyle = `rgba(50, 60, 80, ${baseAlpha * 0.4})`;
            ctx.lineWidth = 1;
            for (let fy = 25; fy < b.h; fy += 25) {
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + fy);
                ctx.lineTo(b.x + b.w, b.y + fy);
                ctx.stroke();
                // highlights under line
                ctx.fillStyle = `rgba(0, 0, 0, ${baseAlpha * 0.3})`;
                ctx.fillRect(b.x, b.y + fy, b.w, 2);
            }

            // Rooftop
            ctx.fillStyle = `rgba(15, 23, 42, ${baseAlpha + 0.1})`;
            if (b.roofType === 1) {
                ctx.fillRect(b.x + b.w / 2 - 4, b.y - 20, 8, 20);
            } else if (b.roofType === 2) {
                ctx.beginPath();
                ctx.moveTo(b.x - 5, b.y);
                ctx.lineTo(b.x + b.w + 5, b.y);
                ctx.lineTo(b.x + b.w / 2, b.y - 20);
                ctx.fill();
            }

            // Rooftop details
            if (b.rooftopDetails) {
                b.rooftopDetails.forEach(d => {
                    if (d.type === 'antenna') {
                        ctx.strokeStyle = `rgba(100, 116, 139, ${baseAlpha + 0.2})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(b.x + d.x, b.y);
                        ctx.lineTo(b.x + d.x, b.y - d.h);
                        ctx.stroke();
                        // Blinking red light
                        const blinkOn = (Math.sin(animTime * 3 + d.blink * 10) > 0);
                        if (blinkOn) {
                            ctx.fillStyle = '#ef4444';
                            ctx.shadowColor = '#ef4444';
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.arc(b.x + d.x, b.y - d.h, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;
                        }
                    } else if (d.type === 'ac') {
                        ctx.fillStyle = `rgba(71, 85, 105, ${baseAlpha + 0.3})`;
                        ctx.fillRect(b.x + d.x, b.y - 8, 14, 8);
                        ctx.strokeStyle = `rgba(15, 23, 42, ${baseAlpha})`;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(b.x + d.x, b.y - 8, 14, 8);
                        // Fan circle
                        ctx.fillStyle = `rgba(15, 23, 42, ${baseAlpha + 0.2})`;
                        ctx.beginPath();
                        ctx.arc(b.x + d.x + 7, b.y - 4, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (d.type === 'tank') {
                        ctx.fillStyle = `rgba(51, 65, 85, ${baseAlpha + 0.3})`;
                        ctx.beginPath();
                        ctx.roundRect(b.x + d.x, b.y - 22, 18, 20, 4);
                        ctx.fill();
                        // Tank legs
                        ctx.fillRect(b.x + d.x + 2, b.y - 26, 2, 4);
                        ctx.fillRect(b.x + d.x + 14, b.y - 26, 2, 4);
                    } else if (d.type === 'dish') {
                        ctx.strokeStyle = `rgba(148, 163, 184, ${baseAlpha + 0.3})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(b.x + d.x, b.y - 6, 8, Math.PI * 1.2, Math.PI * 2.8);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(b.x + d.x, b.y - 6);
                        ctx.lineTo(b.x + d.x - 4, b.y);
                        ctx.stroke();
                    } else if (d.type === 'billboard') {
                        // Billboard posts
                        ctx.fillStyle = `rgba(51, 65, 85, ${baseAlpha + 0.2})`;
                        ctx.fillRect(b.x + d.x + 10, b.y - 30, 4, 30);
                        ctx.fillRect(b.x + d.x + 40, b.y - 30, 4, 30);
                        // Billboard screen
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(b.x + d.x, b.y - 45, 54, 25);
                        ctx.fillStyle = d.color;
                        ctx.shadowColor = d.color;
                        ctx.shadowBlur = 15;
                        ctx.globalAlpha = 0.8 + Math.sin(animTime * 2 + b.x) * 0.2; // pulse
                        ctx.fillRect(b.x + d.x + 2, b.y - 43, 50, 21);
                        ctx.globalAlpha = 1.0;
                        ctx.shadowBlur = 0;
                    }
                });
            }

            // Balconies
            if (b.balconies) {
                b.balconies.forEach(bal => {
                    const bx = bal.side === 'left' ? b.x - 6 : b.x + b.w;
                    ctx.fillStyle = `rgba(51, 65, 85, ${baseAlpha + 0.2})`;
                    ctx.beginPath();
                    ctx.roundRect(bx, b.y + bal.y, 6, 4, 1);
                    ctx.fill();
                    ctx.strokeStyle = `rgba(100, 116, 139, ${baseAlpha})`;
                    ctx.lineWidth = 0.8;
                    ctx.strokeRect(bx, b.y + bal.y - 14, 6, 18);
                });
            }

            // Windows
            const isNight = timeProgress > 0.25 && timeProgress < 0.75;
            const isStormy = weather.intensity > 0.5;
            if (b.windows) {
                b.windows.forEach(win => {
                    let lightOn = (isNight || isStormy) && win.lightSeed > 0.4;
                    if (lightOn) {
                        // Different window light temperatures (warm/cool)
                        const isWarm = win.colorTheme > 0.5;
                        ctx.fillStyle = isWarm ? `rgba(253, 224, 71, ${0.5 + b.layer * 0.2})` : `rgba(224, 242, 254, ${0.5 + b.layer * 0.2})`;
                        ctx.shadowColor = isWarm ? '#facc15' : '#7dd3fc';
                        ctx.shadowBlur = 8;
                    } else {
                        // Dark reflections
                        ctx.fillStyle = `rgba(15, 23, 42, 0.6)`;
                        ctx.shadowBlur = 0;
                    }
                    ctx.fillRect(b.x + win.x, b.y + win.y, win.w, win.h);

                    if (lightOn) {
                        // Window sill / blinds silouhette
                        ctx.fillStyle = `rgba(0, 0, 0, 0.3)`;
                        ctx.fillRect(b.x + win.x, b.y + win.y, win.w, win.h * 0.3); // half drawn blind
                    }

                    // Window frame
                    ctx.strokeStyle = `rgba(51, 65, 85, ${baseAlpha * 0.4})`;
                    ctx.lineWidth = 0.8;
                    ctx.strokeRect(b.x + win.x, b.y + win.y, win.w, win.h);
                    ctx.shadowBlur = 0;
                });
            }

            // Neon sign
            if (b.neonSign) {
                const ns = b.neonSign;
                ctx.fillStyle = ns.color;
                ctx.shadowColor = ns.color;
                ctx.shadowBlur = 15;
                if (ns.style === 0) {
                    ctx.fillRect(b.x + ns.x, b.y + ns.y, ns.w, ns.h);
                } else if (ns.style === 1) {
                    // Lines of text
                    ctx.fillRect(b.x + ns.x, b.y + ns.y, ns.w, 2);
                    ctx.fillRect(b.x + ns.x, b.y + ns.y + 4, ns.w * 0.8, 2);
                    ctx.fillRect(b.x + ns.x, b.y + ns.y + 8, ns.w * 0.6, 2);
                } else {
                    // Vertical sign
                    ctx.fillRect(b.x + ns.x, b.y + ns.y, 6, ns.h * 2);
                }
                ctx.shadowBlur = 0;
            }
        }

        // === ENHANCED TREE RENDERER ===
        function drawTree(t) {
            const baseAlpha = 0.3 + t.layer * 0.2;
            const cx = t.x + t.w / 2;

            // Roots
            if (t.roots) {
                ctx.strokeStyle = `rgba(80, 50, 20, ${baseAlpha + 0.2})`;
                ctx.lineWidth = 3 + t.trunkW * 0.1;
                t.roots.forEach(root => {
                    const rootStartX = cx + root.side * t.trunkW * 0.4;
                    const rootStartY = t.y + t.h - 5;
                    ctx.beginPath();
                    ctx.moveTo(rootStartX, rootStartY);
                    ctx.quadraticCurveTo(
                        rootStartX + root.side * root.len * 0.6,
                        rootStartY + root.curve,
                        rootStartX + root.side * root.len,
                        rootStartY + 10
                    );
                    ctx.stroke();
                });
            }

            // Trunk with gradient
            const trunkGrad = ctx.createLinearGradient(cx - t.trunkW / 2, t.y, cx + t.trunkW / 2, t.y);
            trunkGrad.addColorStop(0, `rgba(60, 35, 15, ${baseAlpha + 0.2})`);
            trunkGrad.addColorStop(0.3, `rgba(101, 67, 33, ${baseAlpha + 0.15})`);
            trunkGrad.addColorStop(0.8, `rgba(139, 90, 43, ${baseAlpha + 0.15})`);
            trunkGrad.addColorStop(1, `rgba(70, 45, 18, ${baseAlpha + 0.1})`);
            ctx.fillStyle = trunkGrad;

            // Draw curved trunk
            ctx.beginPath();
            ctx.moveTo(cx - t.trunkW / 2, t.y + t.h);
            ctx.lineTo(cx - t.trunkW * 0.3, t.y);
            ctx.lineTo(cx + t.trunkW * 0.3, t.y);
            ctx.lineTo(cx + t.trunkW / 2, t.y + t.h);
            ctx.closePath();
            ctx.fill();

            // Bark texture (pre-seeded)
            if (t.barkLines) {
                ctx.strokeStyle = `rgba(40, 20, 5, ${baseAlpha * 0.7})`;
                ctx.lineWidth = 1;
                t.barkLines.forEach(bl => {
                    ctx.beginPath();
                    ctx.moveTo(cx - t.trunkW * 0.3, t.y + bl.y);
                    ctx.quadraticCurveTo(cx + bl.curve, t.y + bl.y + 3, cx + t.trunkW * 0.3, t.y + bl.y + 1);
                    ctx.stroke();
                });
            }

            // Trunk Moss
            if (t.mosses) {
                ctx.fillStyle = `rgba(34, 139, 34, ${baseAlpha + 0.2})`;
                t.mosses.forEach(m => {
                    ctx.beginPath();
                    ctx.arc(cx + m.side * t.trunkW * 0.3, t.y + m.y, m.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Branches
            if (t.branches) {
                ctx.strokeStyle = `rgba(80, 50, 20, ${baseAlpha + 0.2})`;
                ctx.lineCap = 'round';
                t.branches.forEach(br => {
                    const bStartY = t.y + t.h * br.yFrac;
                    const bEndX = cx + br.side * br.len;
                    const bEndY = bStartY - br.len * br.angle;
                    ctx.lineWidth = br.width;
                    ctx.beginPath();
                    ctx.moveTo(cx, bStartY);
                    ctx.quadraticCurveTo(
                        cx + br.side * br.len * 0.5,
                        bStartY - br.len * 0.3,
                        bEndX, bEndY
                    );
                    ctx.stroke();
                });
            }

            // Canopy colors (4 shades)
            const greens = [
                [22, 101, 52],
                [34, 139, 34],
                [74, 222, 128],
                [13, 148, 136] // Teal/Jungle green
            ];
            const gc = greens[t.leafShade];
            const canopyY = t.y - t.canopySize * 0.5;

            if (t.canopyType === 'round') {
                // Multiple overlapping circles with depth
                for (let i = 0; i < 6; i++) {
                    const offX = (i - 2.5) * t.canopySize * 0.3;
                    const offY = -Math.abs(i - 2.5) * 8;
                    const r = t.canopySize * (0.6 + (2.5 - Math.abs(i - 2.5)) * 0.15);
                    const shade = Math.min(255, gc[1] + i * 12);
                    ctx.fillStyle = `rgba(${gc[0]}, ${shade}, ${gc[2]}, ${baseAlpha + 0.15})`;
                    ctx.beginPath();
                    ctx.arc(cx + offX, canopyY + offY, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Canopy highlight
                ctx.fillStyle = `rgba(${Math.min(255, gc[0] + 40)}, ${Math.min(255, gc[1] + 50)}, ${Math.min(255, gc[2] + 30)}, ${baseAlpha * 0.4})`;
                ctx.beginPath();
                ctx.arc(cx - t.canopySize * 0.2, canopyY - t.canopySize * 0.3, t.canopySize * 0.4, 0, Math.PI * 2);
                ctx.fill();
            } else if (t.canopyType === 'pine') {
                // Pine tree: stacked triangles
                for (let i = 0; i < 5; i++) {
                    const tier = t.canopySize * (1.4 - i * 0.25);
                    const tierY = canopyY + i * t.canopySize * 0.4;
                    const shade = Math.min(255, gc[1] + i * 20);
                    ctx.fillStyle = `rgba(${gc[0]}, ${shade}, ${gc[2]}, ${baseAlpha + 0.15})`;
                    ctx.beginPath();
                    ctx.moveTo(cx, tierY - tier * 0.8);
                    ctx.lineTo(cx - tier, tierY + tier * 0.4);
                    ctx.lineTo(cx + tier, tierY + tier * 0.4);
                    ctx.closePath();
                    ctx.fill();
                }
            } else if (t.canopyType === 'umbrella') {
                // African umbrella thorn style
                ctx.fillStyle = `rgba(${gc[0]}, ${gc[1]}, ${gc[2]}, ${baseAlpha + 0.15})`;
                ctx.beginPath();
                ctx.ellipse(cx, canopyY - t.canopySize * 0.2, t.canopySize * 1.5, t.canopySize * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = `rgba(${Math.min(255, gc[0] + 30)}, ${Math.min(255, gc[1] + 30)}, ${gc[2]}, ${baseAlpha * 0.4})`;
                ctx.beginPath();
                ctx.ellipse(cx, canopyY - t.canopySize * 0.3, t.canopySize * 1.2, t.canopySize * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Tall poplar / cypress style
                ctx.fillStyle = `rgba(${gc[0]}, ${gc[1]}, ${gc[2]}, ${baseAlpha + 0.15})`;
                ctx.beginPath();
                ctx.ellipse(cx, t.y - t.canopySize, t.canopySize * 0.4, t.canopySize * 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Leaf clusters on branches
            if (t.leafClusters) {
                t.leafClusters.forEach(lc => {
                    const lcGC = greens[lc.shade];
                    const bStartY = t.y + t.h * lc.yFrac;
                    const bEndX = cx + lc.side * lc.len;
                    const bEndY = bStartY - lc.len * lc.angle;
                    ctx.fillStyle = `rgba(${lcGC[0]}, ${lcGC[1]}, ${lcGC[2]}, ${baseAlpha + 0.2})`;
                    ctx.beginPath();
                    ctx.arc(bEndX, bEndY, lc.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Vines with leaflets
            if (t.vines) {
                t.vines.forEach(v => {
                    const vx = cx + v.xOff;
                    const vy = canopyY + t.canopySize * 0.2;
                    const sway = Math.sin(animTime * 0.8 + v.sway) * 8;
                    const thick = 1 + (v.len / 40);
                    ctx.strokeStyle = `rgba(22, 163, 74, ${baseAlpha + 0.2})`;
                    ctx.lineWidth = thick;
                    ctx.beginPath();
                    ctx.moveTo(vx, vy);
                    ctx.quadraticCurveTo(vx + sway, vy + v.len * 0.5, vx + sway * 0.5, vy + v.len);
                    ctx.stroke();
                    // Leaflets along vine
                    if (v.leaflets) {
                        ctx.fillStyle = `rgba(74, 222, 128, ${baseAlpha + 0.15})`;
                        for (let vl = 0.2; vl < 1; vl += 0.25) {
                            const lx = vx + sway * Math.sin(vl * Math.PI) * 0.8;
                            const ly = vy + v.len * vl;
                            ctx.beginPath();
                            ctx.ellipse(lx + 4, ly, 4, 2, 0.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                });
            }
        }

        function loop(timestamp) {
            if (gameState === 'PLAYING') {
                // Delta-time: dt = 1.0 at 60fps, scales proportionally
                if (lastTime === 0) lastTime = timestamp;
                const elapsed = timestamp - lastTime;
                lastTime = timestamp;
                // Clamp dt to avoid spiral-of-death on tab switch (max ~2 frames)
                const totalDt = Math.min(elapsed / (1000 / 60), 2);

                // Sub-step physics when dt > 1 for reliable collision detection
                if (totalDt > 1.0) {
                    const steps = Math.ceil(totalDt);
                    const subDt = totalDt / steps;
                    for (let i = 0; i < steps; i++) update(subDt);
                } else {
                    update(totalDt);
                }
                draw();
                requestAnimationFrame(loop);
            }
        }

        // === PAUSE SYSTEM ===
        const pauseOverlay = document.createElement('div');
        pauseOverlay.id = 'pause-overlay';
        pauseOverlay.className = 'overlay hidden';
        pauseOverlay.innerHTML = `
            <div class="flex flex-col items-center gap-6">
                <h2 class="text-4xl sm:text-6xl font-black text-white uppercase tracking-tight shadow-xl">Paused</h2>
                <p class="text-slate-400 text-sm uppercase tracking-widest text-shadow">Press P or tap Resume to continue</p>
                <div class="flex flex-wrap items-center justify-center gap-4 mt-4">
                    <button id="resume-btn" class="btn-start shadow-lg shadow-blue-500/50">Resume</button>
                    <button id="mute-btn" class="btn-start shadow-lg shadow-purple-500/50" style="background-image: linear-gradient(to right, #6b21a8, #9333ea);">Sound: ON</button>
                </div>
            </div>
        `;
        document.getElementById('game-container').appendChild(pauseOverlay);

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.classList.remove('hidden');
                document.getElementById('pause-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="6,4 20,12 6,20"/></svg>';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseOverlay.classList.add('hidden');
                document.getElementById('pause-btn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
                lastTime = 0; // Reset delta so no time-jump
                requestAnimationFrame(loop);
            }
        }

        document.getElementById('pause-btn').addEventListener('click', e => {
            e.stopPropagation();
            togglePause();
        });
        document.getElementById('pause-btn').addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            togglePause();
        });
        pauseOverlay.querySelector('#resume-btn').addEventListener('click', togglePause);
        pauseOverlay.querySelector('#resume-btn').addEventListener('touchend', e => {
            e.preventDefault();
            togglePause();
        });

        pauseOverlay.querySelector('#mute-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const isMuted = SoundSys.toggleMute();
            e.target.innerText = isMuted ? 'Sound: OFF' : 'Sound: ON';
        });
        pauseOverlay.querySelector('#mute-btn').addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isMuted = SoundSys.toggleMute();
            e.target.innerText = isMuted ? 'Sound: OFF' : 'Sound: ON';
        });

        function loseLife() {
            lives--;
            updateLivesUI();
            if (lives <= 0) {
                gameOver();
                return;
            }
            // Respawn on nearest platform
            invincibleTimer = 120; // ~2 seconds of invincibility
            player.vy = 0;
            player.vx = 0;
            // Find nearest platform ahead of or at the camera
            let bestPlatform = platforms[platforms.length - 1];
            for (const p of platforms) {
                if (p.x + p.w > cameraX + 100) {
                    bestPlatform = p;
                    break;
                }
            }
            player.x = Math.max(bestPlatform.x + 50, cameraX + 100);
            player.y = bestPlatform.y - player.height - 10;
            player.isGrounded = false;

            // Snap the camera back so the player is always visible at x=100 from the left
            cameraX = player.x - 100;

            // Flash screen red
            weather.flashOpacity = 0.4;
            createParticles(player.x + player.width / 2, player.y + player.height / 2, 15, '#ef4444');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = score;
            if (SoundSys.initialized && SoundSys.rainGain) {
                SoundSys.rainGain.gain.exponentialRampToValueAtTime(0.001, SoundSys.ctx.currentTime + 1);
            }
        }

        function jump() {
            if (gameState !== 'PLAYING') return;
            if (player.isGrounded) {
                player.vy = JUMP_FORCE;
                createParticles(player.x + player.width / 2, player.y + player.height, 5, '#fff');
                SoundSys.playJump();
            }
        }

        function dash() {
            if (gameState !== 'PLAYING') return;
            if (player.stamina >= 30) {
                player.stamina -= 30;
                player.x += 100; // Blink forward
                createParticles(player.x, player.y + player.height / 2, 10, '#6366f1');
                updateStaminaUI();
            }
        }

        // ── Keyboard Input ──
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
            if (e.code === 'ShiftLeft' || e.code === 'ArrowRight') { e.preventDefault(); dash(); }
            if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); togglePause(); }
        });

        // ── Mobile Touch Input ──
        const touchJumpBtn = document.getElementById('touch-jump');
        const touchDashBtn = document.getElementById('touch-dash');

        // On-screen button handlers (multi-touch safe)
        touchJumpBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            jump();
        }, { passive: false });

        touchDashBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            dash();
        }, { passive: false });

        // Fallback: tap anywhere on canvas (left half = jump, right half = dash)
        canvas.addEventListener('touchstart', e => {
            // Don't trigger if touching a button or control
            if (e.target.closest('.pause-btn, .touch-btn, .btn-start, .overlay')) return;
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) jump();
            else dash();
        }, { passive: false });

        // Prevent default touch behaviors on the game container
        document.getElementById('game-container').addEventListener('touchmove', e => {
            e.preventDefault();
        }, { passive: false });

        // ── Character Selection ──
        const cardDefault = document.getElementById('card-default');
        const cardBatman = document.getElementById('card-batman');
        const cardSuperman = document.getElementById('card-superman');
        const allCards = [cardDefault, cardBatman, cardSuperman];

        function selectSkin(skinName, activeCard) {
            player.skin = skinName;
            allCards.forEach(c => c.classList.remove('selected'));
            activeCard.classList.add('selected');
        }

        cardDefault.addEventListener('click', () => selectSkin('default', cardDefault));
        cardBatman.addEventListener('click', () => selectSkin('batman', cardBatman));
        cardSuperman.addEventListener('click', () => selectSkin('superman', cardSuperman));

        selectSkin('default', cardDefault);

        // ── Character Preview Rendering ──
        function renderCharacterPreviews() {
            const previews = [
                { id: 'preview-default', skin: 'default' },
                { id: 'preview-batman', skin: 'batman' },
                { id: 'preview-superman', skin: 'superman' }
            ];
            previews.forEach(({ id, skin }) => {
                const c = document.getElementById(id);
                if (!c) return;
                const p = c.getContext('2d');
                p.clearRect(0, 0, c.width, c.height);
                const cx = c.width / 2;
                const by = c.height - 8;

                // Shadow
                p.fillStyle = 'rgba(0,0,0,0.25)';
                p.beginPath();
                p.ellipse(cx, by, 12, 3, 0, 0, Math.PI * 2);
                p.fill();

                // Skin-dependent colors
                let suit, leg, boot, sleeve, hand, belt, trunk, capeCol;
                if (skin === 'default') {
                    suit = '#f8fafc'; leg = '#1e293b'; boot = '#0f172a';
                    sleeve = '#f8fafc'; hand = '#ffedd5'; belt = '#0f172a'; trunk = null; capeCol = null;
                } else if (skin === 'batman') {
                    suit = '#374151'; leg = '#4b5563'; boot = '#111827';
                    sleeve = '#4b5563'; hand = '#030712'; belt = '#eab308'; trunk = '#111827'; capeCol = '#111827';
                } else {
                    suit = '#1d4ed8'; leg = '#1d4ed8'; boot = '#991b1b';
                    sleeve = '#1d4ed8'; hand = '#ffedd5'; belt = '#eab308'; trunk = '#dc2626'; capeCol = '#dc2626';
                }

                // Cape (behind body)
                if (capeCol) {
                    p.fillStyle = capeCol;
                    p.beginPath();
                    p.moveTo(cx - 9, by - 47);
                    p.quadraticCurveTo(cx - 16, by - 25, cx - 13, by - 6);
                    p.lineTo(cx + 13, by - 6);
                    p.quadraticCurveTo(cx + 16, by - 25, cx + 9, by - 47);
                    p.fill();
                }

                // Legs
                p.fillStyle = leg;
                p.beginPath(); p.roundRect(cx - 7, by - 20, 6, 16, 1); p.fill();
                p.beginPath(); p.roundRect(cx + 1, by - 20, 6, 16, 1); p.fill();

                // Boots
                p.fillStyle = boot;
                p.beginPath(); p.roundRect(cx - 8, by - 5, 8, 5, [0, 0, 2, 2]); p.fill();
                p.beginPath(); p.roundRect(cx + 0, by - 5, 8, 5, [0, 0, 2, 2]); p.fill();

                // Torso
                p.fillStyle = suit;
                p.beginPath();
                p.moveTo(cx - 9, by - 22);
                p.lineTo(cx + 9, by - 22);
                p.lineTo(cx + 10, by - 46);
                p.lineTo(cx - 10, by - 46);
                p.closePath();
                p.fill();

                // Belt
                p.fillStyle = belt;
                p.fillRect(cx - 8, by - 23, 16, 3);

                // Trunks
                if (trunk) {
                    p.fillStyle = trunk;
                    p.fillRect(cx - 7, by - 20, 14, 4);
                }

                // Chest detail
                if (skin === 'batman') {
                    p.fillStyle = '#000';
                    p.beginPath(); p.ellipse(cx, by - 36, 5, 2.5, 0, 0, Math.PI * 2); p.fill();
                } else if (skin === 'superman') {
                    p.fillStyle = '#dc2626';
                    p.beginPath();
                    p.moveTo(cx, by - 41); p.lineTo(cx + 5, by - 36);
                    p.lineTo(cx, by - 31); p.lineTo(cx - 5, by - 36);
                    p.fill();
                    p.fillStyle = '#eab308';
                    p.beginPath();
                    p.moveTo(cx, by - 39); p.lineTo(cx + 3, by - 36);
                    p.lineTo(cx, by - 33); p.lineTo(cx - 3, by - 36);
                    p.fill();
                } else {
                    // Collar
                    p.fillStyle = '#e2e8f0';
                    p.beginPath();
                    p.moveTo(cx - 3, by - 46); p.lineTo(cx + 3, by - 46);
                    p.lineTo(cx, by - 42); p.closePath(); p.fill();
                    // Tie
                    p.fillStyle = '#dc2626';
                    p.beginPath();
                    p.moveTo(cx - 1.5, by - 44); p.lineTo(cx + 1.5, by - 44);
                    p.lineTo(cx + 1, by - 28); p.lineTo(cx - 1, by - 28);
                    p.closePath(); p.fill();
                    p.fillStyle = '#b91c1c';
                    p.beginPath();
                    p.moveTo(cx - 1, by - 28); p.lineTo(cx + 1, by - 28);
                    p.lineTo(cx, by - 25); p.closePath(); p.fill();
                }

                // Arms
                p.fillStyle = sleeve;
                p.beginPath(); p.roundRect(cx - 14, by - 46, 5, 16, 2); p.fill();
                p.beginPath(); p.roundRect(cx + 9, by - 46, 5, 16, 2); p.fill();

                // Hands
                p.fillStyle = hand;
                p.beginPath(); p.arc(cx - 11.5, by - 28, 3, 0, Math.PI * 2); p.fill();
                p.beginPath(); p.arc(cx + 11.5, by - 28, 3, 0, Math.PI * 2); p.fill();

                // Batman gauntlet spikes
                if (skin === 'batman') {
                    p.fillStyle = '#1f2937';
                    p.beginPath(); p.moveTo(cx + 14, by - 40); p.lineTo(cx + 17, by - 42); p.lineTo(cx + 14, by - 37); p.fill();
                    p.beginPath(); p.moveTo(cx + 14, by - 36); p.lineTo(cx + 17, by - 38); p.lineTo(cx + 14, by - 33); p.fill();
                }

                // Neck
                p.fillStyle = skin === 'batman' ? '#111827' : '#fed7aa';
                p.fillRect(cx - 3, by - 51, 6, 5);

                // Head
                p.fillStyle = '#fed7aa';
                p.beginPath(); p.arc(cx, by - 58, 9, 0, Math.PI * 2); p.fill();
                // Jaw
                p.beginPath();
                p.moveTo(cx - 9, by - 58); p.lineTo(cx - 6, by - 50);
                p.lineTo(cx + 6, by - 50); p.lineTo(cx + 9, by - 58);
                p.fill();

                // Nose
                p.fillStyle = '#fdb172';
                p.beginPath();
                p.moveTo(cx + 8, by - 58); p.lineTo(cx + 11, by - 56); p.lineTo(cx + 8, by - 54);
                p.fill();

                if (skin === 'default') {
                    // Hair
                    p.fillStyle = '#452b17';
                    p.beginPath();
                    p.arc(cx, by - 58, 9.5, Math.PI, Math.PI * 2, false);
                    p.quadraticCurveTo(cx + 9, by - 56, cx + 5, by - 64);
                    p.quadraticCurveTo(cx - 2, by - 68, cx - 10, by - 56);
                    p.fill();
                    // Eye
                    p.fillStyle = '#fff';
                    p.beginPath(); p.ellipse(cx + 3, by - 59, 2.5, 1.5, 0, 0, Math.PI * 2); p.fill();
                    p.fillStyle = '#0f172a';
                    p.beginPath(); p.arc(cx + 4, by - 59, 1, 0, Math.PI * 2); p.fill();
                    // Glasses
                    p.strokeStyle = '#1e293b'; p.lineWidth = 1;
                    p.strokeRect(cx + 0.5, by - 61, 5, 4);
                    p.beginPath(); p.moveTo(cx + 0.5, by - 59); p.lineTo(cx - 4, by - 59); p.stroke();
                } else if (skin === 'batman') {
                    // Cowl
                    p.fillStyle = '#111827';
                    p.beginPath();
                    p.arc(cx, by - 58, 10, Math.PI, 0, false);
                    p.lineTo(cx + 10, by - 54);
                    p.lineTo(cx + 5, by - 55); p.lineTo(cx + 4, by - 54);
                    p.lineTo(cx, by - 54); p.lineTo(cx - 5, by - 53);
                    p.lineTo(cx - 10, by - 54);
                    p.closePath(); p.fill();
                    // Ears
                    p.beginPath();
                    p.moveTo(cx - 5, by - 66); p.lineTo(cx - 8, by - 78); p.lineTo(cx - 2, by - 66);
                    p.closePath(); p.fill();
                    p.beginPath();
                    p.moveTo(cx + 2, by - 66); p.lineTo(cx + 6, by - 78); p.lineTo(cx + 7, by - 66);
                    p.closePath(); p.fill();
                    // White eyes
                    p.fillStyle = '#fff';
                    p.beginPath();
                    p.moveTo(cx, by - 60); p.lineTo(cx + 4, by - 61);
                    p.lineTo(cx + 5, by - 59); p.lineTo(cx, by - 58.5);
                    p.fill();
                } else {
                    // Superman hair
                    p.fillStyle = '#0a0a0a';
                    p.beginPath();
                    p.arc(cx, by - 58, 9.5, Math.PI, Math.PI * 2, false);
                    p.quadraticCurveTo(cx + 9, by - 56, cx + 5, by - 64);
                    p.quadraticCurveTo(cx - 2, by - 68, cx - 10, by - 56);
                    p.fill();
                    // Spit curl
                    p.beginPath();
                    p.moveTo(cx + 5, by - 58);
                    p.quadraticCurveTo(cx + 8, by - 56, cx + 4, by - 55);
                    p.fill();
                    // Eye
                    p.fillStyle = '#fff';
                    p.beginPath(); p.ellipse(cx + 3, by - 59, 2.5, 1.5, 0, 0, Math.PI * 2); p.fill();
                    p.fillStyle = '#1d4ed8';
                    p.beginPath(); p.arc(cx + 4, by - 59, 1, 0, Math.PI * 2); p.fill();
                }
            });
        }
        renderCharacterPreviews();

        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
        });

        // Also handle touch for start button explicitly
        document.getElementById('start-btn').addEventListener('touchend', e => {
            e.preventDefault();
            startScreen.classList.add('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('touchend', e => {
            e.preventDefault();
            gameOverScreen.classList.add('hidden');
            initGame();
        });

    </script>
</body>

</html>
